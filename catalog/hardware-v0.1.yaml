    - cobra-insert
    - cobra-memory-bins
    - cobra-flush
    result:
      form: Partitioned per-thread index/value tuple sequences in memory bins; no destination-array update.
      old_value: not_applicable
      validity: All submitted tuples must reach their assigned bins before CPU Accumulate; requires counts/capacity,
        ownership and phase-release obligations.
      claim_refs:
      - cobra-phase-boundary
      - cobra-memory-bins
      - cobra-flush
    ordering:
      scope: Thread-private collection and later bin traversal
      description: Append slots preserve index/value association and tuple multiplicity. Hierarchical repartitioning
        and cross-thread/bin traversal do not establish original global update order or stable sorting.
      claim_refs:
      - cobra-insert
      - cobra-drain
      - cobra-phase-boundary
    completion:
      event: binflush initiates per-core L1→L2→LLC residual drain at the Binning boundary; physical done/ack binding
        unspecified.
      visibility: Paper requires all tuples in memory bins before Accumulate; ROB retirement is not bin drain, destination
        update completion, or a global write barrier.
      claim_refs:
      - cobra-flush
      - cobra-issue
    datatype_notes: Neighbor-Populate evaluation uses 8 B tuples; no supported catalog payload type or index-width
      domain inferred from this size. Index/value pair is data to collect.
    limitations:
    - Required program write is tuple materialization, not arbitrary scatter or atomic destination update.
    - No byte-address pattern coverage established for C-Buffers.
    - No observed executable model or ISA implementation.
    realization:
      kind: documented_sequence
      description: bininit per level; initialize per-bin LLC offsets with unnamed instruction; binupdate(index,value)
        per tuple; binflush then externally bound phase release. Paper interface description only.
      claim_refs:
      - cobra-init
      - cobra-insert
      - cobra-memory-bins
      - cobra-flush
  requirements:
  - id: application-legality
    description: Prove reordered bin processing preserves the application’s required outputs; Neighbor-Populate
      permits neighbor order variation. Preserve every tuple, including multiplicity.
    scope: Software transformation
    claim_refs:
    - cobra-phase-boundary
    verification: required
  - id: numeric-order
    description: Establish allowable floating-point order, integer overflow and any exact reproducibility obligations
      for the chosen application; commutativity is insufficient for bit-identical FP output.
    scope: Workload-specific obligation
    claim_refs:
    - cobra-phase-boundary
    verification: required
  - id: thread-private-storage
    description: Provide disjoint per-thread bin allocations and C-Buffer ownership; partition Accumulate destinations
