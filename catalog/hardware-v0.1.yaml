- id: tmu-micro2023-fig8-spmv
  name: TMU MICRO2023 Fig8 two-lane CSR SpMV supply mapping
  revision: source-scoped-proposal-r1
  record_kind: mapping
  summary: Required operand and ordered row callback supply; host CPU performs arithmetic and output stores.
  mechanism_refs:
  - tmu-fiber-operand-event-marshaling
  source_refs:
  - tmu-micro2023-primary
  operations:
  - id: required-operand-event-supply
    operation: read
    subtype: csr_spmv_two_lane_operand_event_supply
    execution_role: execute
    address_patterns:
    - sequential
    - ranged_indirect
    - indirect
    support: paper_specified
    claim_refs:
    - tmu-traversal
    - tmu-fig8
    - tmu-cpu
    - tmu-outq
    realization:
      kind: mapping_role
      description: Published Fig8 traversal/LockStep/output sequence supplies required CPU inputs and
        row callbacks; it is not one generic gather instruction.
      claim_refs:
      - tmu-fig8
      - tmu-cpu
    result:
      form: Ordered callback-ID stream with paired nnz/vec operands for ri, and operand-free re row-end
        event.
      old_value: not_applicable
      validity: Valid active lane operands with padding or predicate treatment of exhausted lanes; stream
        association follows parent element ordinal.
      claim_refs:
      - tmu-fig8
      - tmu-tu
      - tmu-merges
    ordering:
      scope: Mapped thread callback/operand sequence across TGs
      description: Serialized outQ construction preserves callback order; no physical response or global
        memory order follows.
      claim_refs:
      - tmu-outq
    completion:
      event: GEND emits re after mapped row iterations. Full output chunks are processed by CPU; global
        done/consumed acknowledgment and final partial delivery are unknown.
      visibility: Paper-private outQ injected into host L2; CPU result-store visibility and universal
        observers are not established by this supply event.
      claim_refs:
      - tmu-outq
      - tmu-integration
    type_constraints:
      payload_types: []
      index_width_bits: []
      claim_refs:
      - tmu-unknowns
      notes: Fig6 vfloat and Table1 int are explanatory types; no concrete payload precision/index bit
        width assigned.
    datatype_notes: CPU vector reduction order may differ from scalar accumulation; numerical equivalence
      must be established for the mapping.
    limitations:
    - Physical memory response tags/slots, duplicate cacheline association and out-of-order completion
      rules.
    - Concrete ABI/register encodings, payload/index widths and address arithmetic/containment.
    - Chunk readiness, ownership, consumption acknowledgment, safe reuse, callback splitting and final
      partial chunk delivery.
    - Outstanding request drain/cancellation and precise exception, retry and context-switch replay semantics.
    - Concurrent source mutation, aliasing and cross-core observation beyond the paper-private read-only
      mapping.
