      index_width_bits: []
      claim_refs: []
      notes: Double-add example supports scoped float64;integer signedness/universal index ABI unknown.
        Address/value instruction isnot an index vector ABI.
    datatype_notes: FP order/nan/signed-zero/overflow numericalrequirements must beproved;originalbenchmarks
      not relaxed.
    limitations:
    - No returned priorvalue,genericgather ormixed intervening reads.
    - Float64paper example does notcertifyoriginalorderedbit-oracle equivalence.
  requirements:
  - id: bulk-no-reads
    description: No destination reads during ingest/replay;explicit relaxed-atomic annotation required.
      Do not mix conventional atomics on the updated region.
    scope: PHI explicit bulk mapping
    verification: required
    claim_refs:
    - phi-flush-consistency
  - id: flush-before-read
    description: Prove replay completion,private partialflush,phi_sync andshared readmerge visibility.
    scope: PHI explicit bulk mapping
    verification: required
    claim_refs:
    - phi-flush-consistency
    - phi-selective-batching
  - id: physical-data-bins
    description: Contiguous physical destination storage andbank-local striped bins/chunks;disable batching
      before paging andrefill.
    scope: PHI explicit bulk mapping
    verification: required
    claim_refs:
    - phi-physical-bins
  - id: numeric-legality
    description: Prove reduction/reordering is legal under unchanged original oracle;identity,NaN, signed
      zero,overflow androunding constraints not discharged.
    scope: PHI explicit bulk mapping
    verification: required
    claim_refs:
    - phi-types-reference
    - phi-flush-consistency
  - id: not-old-value
    description: Mapping must not need returned priorvalue,CASsuccess orimmediate nonatomicvisibility.
    scope: PHI explicit bulk mapping
    verification: required
    claim_refs:
    - phi-program-interface
  - id: actual-source
    description: Exact opcode/ALU/bin/flush implementation source/model must be authenticated.
    scope: PHI explicit bulk mapping
    verification: unknown
    claim_refs: []
  parameters:
  - id: line-bytes
    unit: bytes
    state: fixed_reference
    value: 64
    domain: null
    claim_refs:
    - phi-types-reference
    notes: Evaluated cacheline reference;not universal index/operand ABI.
  - id: bin-chunk
    unit: bytes perphysicalbinchunk
    state: unknown
    value: null
    domain: null
    claim_refs: []
    notes: Paper cites256KB example;actualOSallocation/capacity needs binding.
  internal_mechanisms:
  - id: identity-lines
    kind: buffering
    status: described
    description: Identity-initialized partial lines withbuffered-update tag coexist withordinary coherent
      data.
    claim_refs:
    - phi-partial-lines
  - id: cache-alu
    kind: coalescing
    status: described
    description: Private/sharedcache ALU combines updates byword offset without fetching original data
      first.
    claim_refs:
    - phi-partial-lines
  - id: density-choice
    kind: reordering
    status: described
    description: LLC eviction either applies in-place orstreams index/value updates tobins based on density;replay
      phase disables rebatching.
    claim_refs:
    - phi-selective-batching
  - id: bulk-dependencies
    kind: dependency_tracking
    status: described
    description: Relaxed-atomic domain forbidsinterveningreads untilbinsandprivate partials areflushed.
    claim_refs:
    - phi-flush-consistency
  - id: striped-bin-issue
    kind: issue_policy
    status: described
    description: LLCbanks independentlyupdate bank-local binpointers/partial lines;fullchunkinterrupt
      temporarily disablesbatching.
    claim_refs:
    - phi-physical-bins
  - id: read-visibility
    kind: completion
    status: described
    description: Explicitphi_sync flushesprivate partials;shared readmerges remaininglinepartial before
      returning data.
    claim_refs:
    - phi-flush-consistency
  limitations:
  - Examined bulk commutative update operation,not ordinaryBFSparentCAS/defaultgather.
  - No current source/RTL/model identity,FP bitwise equivalence,performance orcompatibility acceptance.
  - The no-intervening-read/flush/physical contiguity requirements are stronger than genericgraph workload
    labels.

- id: extensor-micro2019-ordered-fiber-operands
  name: ExTensor MICRO2019 ordered fiber operand delivery
  revision: primary-scoped-proposal-r1
  record_kind: mapping
  summary: Explicit compressed tensor mapping that intersects sorted coordinates before delivering position-addressed
    operands; scalar arithmetic is outside this operation.
  mechanism_refs:
  - extensor-hierarchical-coordinate-intersection
  source_refs:
  - extensor-micro2019-proceedings
  interface:
    software_supplies: Tiled tensor metadata/data, canonical fibers, parent/tile coordinates, loop bounds/strides/dimension
      maps and buffer/routes configuration.
    invocation: Configure sequencers and Scanner Iterate(level,parent); optional synchronized SkipTo.
      Low-level register/DMA ABI is not supplied.
    outputs: Matched coordinate with separate A/B positions and tagged scalar or subtile operand data.
    claim_refs:
    - extensor-coordinate-position
    - extensor-configuration-and-types
  operations:
  - id: matched_fiber_operands
    operation: read
    subtype: extensor_ordered_fiber_operand_pair
    execution_role: execute
    support: paper_specified
    address_patterns:
    - sequential
    - indirect
    claim_refs:
    - extensor-ordered-intersection
    - extensor-coordinate-position
    realization:
      kind: documented_sequence
      description: Select canonical tensor fibers, merge increasing coordinates, retain both positions
        and parent/tile identities, fetch matched operand values, terminate at EOS and drain outstanding
        delivery.
      claim_refs:
      - extensor-ordered-intersection
      - extensor-coordinate-position
    result:
      form: Coordinate-tagged operand pair; not a generic CPU gather return or scalar reduction result.
      validity: Only explicitly configured canonical fiber/tensor mapping with authenticated positions,
        owners and finite bounds.
      old_value: not_applicable
      claim_refs:
      - extensor-coordinate-position
    ordering:
      scope: Within one declared pair of increasing coordinate fibers
      description: Matching coordinates are emitted in increasing order. No global FIFO, request/response
        ABI or source-ordered partial-sum semantics follows.
      claim_refs:
      - extensor-ordered-intersection
      - extensor-partial-output
    completion:
      event: Intersect observes stream EOS and flushes unmatched remainder; concrete integration must
        additionally drain all issued operand reads.
      visibility: Host-visible kernel/writeback completion and physical coherence are unproved by stream
        EOS.
      claim_refs:
      - extensor-ordered-intersection
      - extensor-partial-output
    type_constraints:
      payload_types:
      - float64
      index_width_bits: []
      claim_refs:
      - extensor-configuration-and-types
      notes: Double-precision evaluation supports this scoped payload; coordinate/index bit width and
        concrete transport encoding remain unknown.
    datatype_notes: Opaque float64 operand bits only; no product, accumulation, rounding, FMA or IEEE
      order claim.
    limitations:
    - No generic gather, BFS traversal, scatter atomic or returned old value capability.
    - Canonical unique fibers are an explicit conservative restriction; duplicate-coordinate ABI unknown.
  requirements:
  - id: canonical-fibers
    description: Explicitly map sorted unique compressed fibers, per-level parent and tile identity, coordinate-to-position
      storage bounds. Duplicate handling is not specified; this proposal requires canonical unique coordinates.
    scope: Explicit ExTensor tensor mapping
    verification: required
    claim_refs:
    - extensor-ordered-intersection
    - extensor-coordinate-position
  - id: sequencer-mapping
    description: Prove tensor format, level/dimension maps, loop nesting/strides, tile partition and per-owner
      data positions; no arbitrary program-address stream substitution.
    scope: Explicit ExTensor tensor mapping
    verification: required
    claim_refs:
    - extensor-coordinate-position
    - extensor-hierarchical-staging
  - id: skip-frontier
    description: If optimized SkipTo is enabled, only successfully output coordinates may create hints;
      preserve previous hint frontier and double-buffer lifetimes.
    scope: Explicit ExTensor tensor mapping
    verification: required
    claim_refs:
    - extensor-skip-synchronization
  - id: capacity-and-backpressure
    description: Declare finite metadata/data/output capacities; no matching operand pair may be consumed
      without output storage. Handle overfull PE tiles by a proved partition.
    scope: Explicit ExTensor tensor mapping
    verification: required
    claim_refs:
    - extensor-hierarchical-staging
  - id: completion-visibility
    description: 'Stream EOS is not kernel memory visibility: prove all outstanding value reads, partial-output
      merges, writebacks and software completion separately.'
    scope: Explicit ExTensor tensor mapping
    verification: required
    claim_refs:
    - extensor-ordered-intersection
    - extensor-partial-output
  - id: numeric-order
    description: Scalar arithmetic and partial sums need independent original numerical legality. No ordered
      floating-point reduction equivalence is granted.
    scope: Explicit ExTensor tensor mapping
    verification: required
    claim_refs:
    - extensor-partial-output
    - extensor-configuration-and-types
  - id: actual-implementation
    description: Authenticate model/RTL, DMA and physical-memory ownership, instruction/command interface
      and completion mechanism before integration.
    scope: Implementation binding
    verification: unknown
    claim_refs: []
  parameters:
  - id: PE-count
    unit: PEs
    state: fixed_reference
    value: 128
    domain: null
    claim_refs:
    - extensor-configuration-and-types
    notes: Evaluated reference only; not an inferred allocation or universal capacity.
  - id: PEB-size
    unit: paper KB
    state: fixed_reference
    value: 64
    domain: null
    claim_refs:
    - extensor-configuration-and-types
    notes: Evaluated reference only; not an inferred allocation or universal capacity.
  - id: CAM-T
    unit: comparators
    state: fixed_reference
    value: 32
    domain: null
    claim_refs:
    - extensor-configuration-and-types
    notes: Evaluated reference only; not an inferred allocation or universal capacity.
  internal_mechanisms:
  - id: metadata-data-separation
    kind: buffering
    status: described
    description: Metadata scanner storage and separate data storage preserve coordinate-position associations;
      comparator registers are double buffered.
    claim_refs:
    - extensor-coordinate-position
    - extensor-skip-synchronization
  - id: merge-and-skip
    kind: issue_policy
    status: described
    description: Basic smaller-head drop/matching-head issue, optionally synchronized bidirectional SkipTo
      hints; sequencer skips empty parents.
    claim_refs:
    - extensor-ordered-intersection
    - extensor-skip-synchronization
    - extensor-coordinate-position
  - id: tagged-parent-state
    kind: dependency_tracking
    status: described
    description: Level/parent/tile coordinates and positions accompany survivors; previous SkipTo frontier
      constrains new hints.
    claim_refs:
    - extensor-coordinate-position
    - extensor-skip-synchronization
  - id: hierarchy-work-staging
    kind: other
    status: described
    description: LLB post-intersection tile fills and PE pre-intersection scalar fills filter work at
      distinct granularities.
    claim_refs:
    - extensor-hierarchical-staging
  - id: coordinate-partial-merge
    kind: coalescing
    status: described
    description: POB hashes output coordinates and locally accumulates partial results, allocating entries
      on first use.
    claim_refs:
    - extensor-partial-output
  - id: algebraic-output-reordering
    kind: reordering
    status: described
    description: Paper assumes associative tensor reduction permits partial outputs to be reordered; actual
      IEEE numerical legality remains required.
    claim_refs:
    - extensor-partial-output
  - id: stream-eos
    kind: completion
    status: described
    description: EOS ends intersection and flushes unmatched streams. Kernel software fence/DMA completion
      ABI is not specified.
    claim_refs:
    - extensor-ordered-intersection
  - id: host-completion-ABI
    kind: completion
    status: unknown
    description: null
    claim_refs: []
  limitations:
  - Logical paper mapping, not RTL/port netlist or measured implementation.
  - Physical translation, protection, cache coherence, exception and callback credit ABI unknown.
  - No inheritance of arbitrary indexed-load or graph traversal capabilities.
  - Abstract finite merge helper does not implement optimized CAM SkipTo or hierarchy timing.
