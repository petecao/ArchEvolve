claims:
  maple-api:
    source_refs:
    - maple-paper
    locator: PDF pp.4–5, §§3.1–3.2, Figs.2–4
    statement: MMIO queue operations initialize and bind queues, enqueue data or pointers, and consume values. PRODUCE_PTR
      requests a fetch whose value is delivered through a queue; LIMA_PRODUCE supplies an indexed range of values
      to a queue, while LIMA and PREFETCH target the LLC.
    evidence_kind: paper_specification
    limitations:
    - API names and abstract arguments are described, but concrete C types, header, packing and index-width domains
      are not established by this paper.
  maple-lima:
    source_refs:
    - maple-paper
    locator: PDF pp.5–6, §§3.2,3.4, Fig.6
    statement: LIMA accepts two array bases and caller-provided begin/end bounds for A[B[i]]; A=0 requests B[i].
      It reads adjacent B data in 64-byte chunks into scratchpad, computes target addresses word by word, and feeds
      pointer-fetch or LLC-prefetch requests into the produce path.
    evidence_kind: paper_specification
    limitations:
    - Caller-provided range bounds do not prove autonomous nested CSR traversal or arbitrary index functions.
    - A shared B chunk is not evidence that arbitrary A addresses are sorted or merged by locality.
  maple-queue-order:
    source_refs:
    - maple-paper
    locator: PDF pp.5–6, §3.1 produce/consume timeline and §3.4, Figs.3,6
    statement: A pointer fetch reserves a FIFO slot and uses its slot index as the memory transaction ID. Out-of-order
      memory replies are deposited into the associated reserved slots, preserving the software-visible queue sequence.
      Consumes take values from the queue head.
    evidence_kind: paper_specification
    limitations:
    - Per-queue value association does not establish global order across queues, cores or memory updates.
  maple-backpressure:
    source_refs:
    - maple-paper
    locator: PDF p.6, §3.4, Fig.6
    statement: Configuration, produce and consume use separate pipelines. Full queues hold produces until entries
      are consumed; empty queues hold consumes until data is available, without polling. Requests to other queues
      can progress while one queue is blocked.
    evidence_kind: paper_specification
    limitations:
    - Paper descriptions do not provide a complete arbitration, fairness or cycle-level model for this integration.
  maple-acknowledgement:
    source_refs:
    - maple-paper
    locator: PDF p.5, §3.1 steps 1–6 and A–C; p.7 §3.6
    statement: The core retires the pointer-produce store on MAPLE acknowledgement before the memory reply arrives.
      The reply later fills the reserved queue entry. A consume finishes when its load response returns the queue
      value.
    evidence_kind: paper_specification
    limitations:
    - Pointer-produce acknowledgement is not fetched-data readiness or a general shared-memory visibility fence.
  maple-translation:
    source_refs:
    - maple-paper
    locator: PDF p.7, §3.5
    statement: The OS maps protected MAPLE MMIO resources; a local MMU, 16-entry fully associative TLB and page-table
      walker translate supplied virtual data pointers. A driver handles valid page faults and translation shootdowns.
    evidence_kind: paper_specification
    limitations:
    - A concrete deployment still needs the described driver/MMIO mappings and pointer-domain checks.
  maple-stable-data:
    source_refs:
    - maple-paper
    locator: PDF p.7, §3.6, Efficient paragraph
    statement: Requests can select coherent LLC loads or noncoherent direct-memory loads. Queue scratchpad values
      have no coherence guarantee after fetch; the compiler or DSL must ensure fetched arrays receive no further
      writes during their use, with epoch-separated updates discussed as an example.
    evidence_kind: paper_specification
    limitations:
    - Coherent fetch routing does not make a previously queued value track later CPU writes.
    - Concurrent parent CAS in the current BFS source does not satisfy this stable-array condition merely because
      the proposed engine operation is a read.
  maple-future-atomics:
    source_refs:
    - maple-paper
    locator: PDF p.4, §3 opening; p.7 §3.6 Extensible
    statement: Read-modify-write atomics are mentioned as a possible extension of the programming model. The examined
      API and implementation description establishes loads, queues and prefetching, not a MAPLE CAS executor.
    evidence_kind: paper_specification
    limitations:
    - An extensible opcode space is not current CAS support; absence of a contract is recorded as unknown, not a
      universal impossibility.
  maple-reference-config:
    source_refs:
    - maple-paper
    locator: PDF p.6 §3.4; p.9 Table 2; p.11 §§5.3–5.4
    statement: The evaluated/synthesized reference uses a 1-KB scratchpad and eight circular queues; the sensitivity
      discussion reports 32 entries of 4 bytes each per queue. Queue allocation is configurable within shared storage,
      while maximum queues and scratchpad capacity are RTL parameters.
    evidence_kind: paper_specification
    limitations:
    - Reference values are not chosen BFS settings or a universally legal tuning interval.
    - A 4-byte evaluation element is not a complete signed/unsigned or width contract for every API operation.
  maple-model-conditions:
    source_refs:
    - maple-paper
    locator: PDF p.9 §4.4; p.11 §5.3, Figs.14–15
    statement: Latency hiding depends on producer runahead, queue capacity, memory latency and core-to-engine round-trip
      cost. Queue consumption adds a NoC communication cost; placement and queue occupancy affect the useful latency
      tolerance.
    evidence_kind: paper_specification
    limitations:
    - Reported performance belongs to the paper configurations and workloads, not our received BFS profiles. No
      speedup is transferred.
  maple-structure:
    source_refs:
    - maple-paper
    locator: PDF pp.5–6, Figs.3,6 and §§3.1,3.4
    statement: MAPLE has request/response protocol interfaces, configuration/produce/consume pipelines, a queue
      controller and shared scratchpad, LIMA address logic, and an MMU. Requests and replies follow the pointer-produce
      and queue-consume paths described in those sections.
    evidence_kind: paper_specification
    limitations:
    - The catalog schematic records described logical paths, not per-port RTL wiring, bus widths or a proved composed
      BFS accelerator.
  maple-code-head-readiness:
    source_refs:
    - maple-fifo-rtl
    locator: dcp_fifo_ctrl.v L191–196, L284–325 and L354–374
    statement: In the pinned RTL's ordinary consume path outside reset/invalidation, occupied/reserved state is
      separate from valid-data state. Consume eligibility requires a valid head and, when the consume-length flag
      requires it, a valid adjacent piece. Reservation alone does not make a value consumable; an unready head cannot
      be bypassed on this path.
    evidence_kind: code_inspection
    limitations:
    - Configuration widths and complete API packing remain unbound; these state predicates do not establish a general
      typed payload/index domain or end-to-end fairness.
  maple-code-dequeue-custody:
    source_refs:
    - maple-fifo-rtl
    - maple-consume-rtl
    locator: dcp_fifo_ctrl.v L191–196, L303–325 and L364–374; maple.sv L290–351
    statement: In the pinned RTL's ordinary consume path, the successful FIFO-decrement handshake advances the head
      and invalidates consumed storage while the consume path captures the data into pipeline registers. NoC response
      delivery and CPU use can occur later. Queue-credit release and CPU consumption are distinct events.
    evidence_kind: code_inspection
    limitations:
    - This describes local ownership transfer in the inspected pipeline, not application completion, a universal
      CLOSE/drain barrier, fault recovery or global visibility.
  dxp-read:
    source_refs:
    - dx100-paper
    locator: PDF pp.4–6, Table 2, §§3.1–3.4, Figs.3 and 5
    statement: SLD fetches constant-stride elements; ILD gathers base-plus-index elements to scratchpad slots. Chaining
      tiles supports multiple indirections. RNG expands active half-open ranges into outer/inner index tiles for
      subsequent accesses.
    evidence_kind: paper_specification
    limitations:
    - Ranged and chained gathers are instruction compositions, not one monolithic ILD opcode.
    - §4.1 p.7 excludes conventional random-base pointer chasing.
  dxp-update:
    source_refs:
    - dx100-paper
    locator: PDF pp.4–5, Table 2, §§3.1–3.2, Fig.3
    statement: IST assigns values at indirect addresses. IRMW supports a restricted reordered update class including
      ADD, MIN and MAX. A condition tile controls whether each access executes.
    evidence_kind: paper_specification
    limitations:
    - Table 2 has no IRMW destination tile; a fetch-old interface is not established by this edition.
    - Arithmetic/ALU operator enumeration does not imply every operator is an IRMW.
    - No CAS instruction is established. Floating numerical equivalence under reordering is workload-specific.
  dxp-legality:
    source_refs:
    - dx100-paper
    locator: PDF p.6 §3.6 and p.7 §4.2 Legality
    statement: Indirect arrays are exclusively written by DX100 during the ROI. Compiler legality requires no core
      stores to accessed memory regions in the loop body and no inter-iteration dependencies.
    evidence_kind: paper_specification
    limitations:
    - Scope is the mapped arrays and offloaded region, not all CPU memory.
    - Repeated updates and reduction legality require a concrete mapping; this text does not authorize arbitrary
      duplicate assignment or concurrent CPU atomics.
  dxp-interface:
    source_refs:
    - dx100-paper
    locator: PDF pp.6–7 §§3.5–4.2, Fig.6 and Fig.7
    statement: Software provides typed tiles/registers, array bases and instructions through memory-mapped stores.
      Wait synchronizes before consuming scratchpad outputs or accessing memory updated by DX100; ready bits mark
      retired instructions.
    evidence_kind: paper_specification
    limitations:
    - Paper-level synchronization promise is distinct from static simulator-path evidence.
  dxp-translation:
    source_refs:
    - dx100-paper
    locator: PDF pp.6–7 §3.6 Address Translation
    statement: Stream and indirect regions use huge pages; software transfers PTEs into a 256-entry DX100 TLB for
      the application lifetime.
    evidence_kind: paper_specification
    limitations:
    - This edition does not establish safe remapping, revocation or arbitrary alias lifetime.
  dxc-gather:
    source_refs:
    - dx100-api
    - dx100-indirect
    locator: MAA_gem5.hpp L270–287; IndirectAccess.cc L491–527 and L898–924
    statement: Indirect load API supplies array base, index tile, result tile and optional mask. Execution reads
      uint32 indices, calculates base + word_size * index, range-checks addresses and writes response words into
      original iteration slots.
    evidence_kind: code_inspection
    limitations:
    - 'Element width and index width are different: 64-bit payloads do not establish 64-bit indices.'
  dxc-stream:
    source_refs:
    - dx100-api
    - dx100-stream
    locator: MAA_gem5.hpp L232–249; StreamAccess.cc L139–170, L222–280, L321–343 and L394–403
    statement: Stream load uses min/max/stride registers and optional condition tile. Execution emits bounded strided
      accesses and writes fetched words to result slots; false conditions use setFakeData.
    evidence_kind: code_inspection
    limitations:
    - Nonpositive strides and overflow are not validated by this study.
  dxc-range:
    source_refs:
    - dx100-api
    - dx100-range
    locator: MAA_gem5.hpp L364–383; RangeFuser.cc L86–94, L159–239
    statement: Range execution reads uint32 lower/upper bounds and mask, uses signed int continuation/stride registers,
      emits outer and inner indices while j < upper, and resumes after filling a finite tile.
    evidence_kind: code_inspection
    limitations:
    - The API template does not widen the implementation range-bound path.
    - Callers must establish positive stride, representable continuation values, matching tile lengths and bounded
      output consumption.
  dxc-old:
    source_refs:
    - dx100-api
    - dx100-indirect
    locator: MAA_gem5.hpp L289–362; IndirectAccess.cc L898–1165
    statement: Scalar/vector indirect stores and RMW APIs accept an optional destination tile. recvData copies the
      current word to that tile before assignment or arithmetic; RMW execution has ADD/MIN/MAX branches for uint32,
      int32, float, uint64, int64 and double.
    evidence_kind: code_inspection
    limitations:
    - No CAS comparison-and-update branch exists in the inspected indirect operation path.
    - No independent runtime correctness or CPU-interoperable atomicity is established.
    - Floating NaNs, signed zero, overflow and reordering require explicit workload numerical contracts.
  dxc-mask:
    source_refs:
    - dx100-indirect
    - dx100-spd
    - dx100-stream
    locator: IndirectAccess.cc L491–527; SPD.hh L73–78; StreamAccess.cc L242–280
    statement: An inactive condition bypasses target access. setFakeData marks element completion without changing
      its stored payload; a ready/finished masked slot is not a valid newly returned value.
    evidence_kind: code_inspection
    limitations: []
  dxc-local-order:
    source_refs:
    - dx100-tables
    - dx100-indirect
    - dx100-port
    locator: Tables.cc L156–184; IndirectAccess.cc L898–1165; Port.cc L29–66
    statement: Offset entries append to a linked list and are consumed in that list order against a mutable line
      copy. Same-unit/same-MAA pending writeback data can be forwarded to a subsequent exclusive read, and pending
      write payloads can be replaced.
    evidence_kind: code_inspection
    limitations:
    - Scope is a collected response group and the specific pending same-line path. Not a global duplicate-index
      or inter-core order proof.
  dxc-region:
    source_refs:
    - dx100-if
    - dx100-invalidator
    locator: IF.cc L185–219 and L280–296; Invalidator.cc L133–195 and L249–264
    statement: Issue checks conflicting accesses to the same region within an MAA ID; multi-MAA admission consults
      region ownership states and modeled transitions.
    evidence_kind: code_inspection
    limitations:
    - Declared-region checks do not prove coverage of physical aliases, arbitrary overlapping registrations or CPU
      atomics.
  dxc-completion:
    source_refs:
    - dx100-port
    - dx100-indirect
    - dx100-maa
    - dx100-api
    - dx100-cpuport
    - dx100-spd-code
    locator: Port.cc L313–328 and L387–402; IndirectAccess.cc L742–791 and L843–866; MAA.cc L605–623; MAA_gem5.hpp
      L98–101; CpuSidePort.cc L295–315; SPD.cc L120–138; MAA.cc L652–676
    statement: No-response write acceptance/replacement feeds write accounting. Pending packet counts, response
      counts and modeled latency gate finish; finishInstructionCompute updates tile readiness. wait_ready performs
      a mapped load held until its ready counter clears, then mfence.
    evidence_kind: code_inspection
    limitations:
    - Accounting callbacks are not global visibility acknowledgements. Direct Ramulator2 backing mutation is separately
      scoped in dxc-direct-backing.
    - The held status-read path is established; end-to-end CPU/compiler/coherence sequencing and safe reuse remain
      separate obligations.
  dxc-config:
    source_refs:
    - dx100-config
    - dx100-spd
    - dx100-spd-code
    - dx100-api
    locator: MAA.py L13–25; SPD.hh L30–34 and L93–94; SPD.cc L188–197; MAA_gem5.hpp L102–107
    statement: The pinned SimObject declares 16384 elements per tile, 64 row-table rows per slice, 8 entries per
      subslice row, 128 request-table addresses and 16 entries per address; booleans permit no_reorder and force_cache_access.
      Configuration capacity is separate from uint16 tile-size storage, getSize/setSize arguments, and the API size
      read.
    evidence_kind: code_inspection
    limitations:
    - Defaults are not the effective configuration of every run; declaration alone does not establish a supported
      tuning domain.
    - An Unsigned configuration declaration does not establish arbitrary legal tile capacities; produced sizes must
      be representable in the independent bookkeeping paths.
  term-read:
    source_refs:
    - terminus-paper
    locator: PDF pp.4–7 §§IV-A–E; Figs.4–7, Listing 1
    statement: Read accepts an address, datatype, stride and count; ReadRange consumes start/end addresses. Composed
      tasks implement dependent hash-table lookup including linked-list traversal and B-tree traversal.
    evidence_kind: paper_specification
    limitations:
    - A verified general gather lowering for the received BFS source is not supplied by this paper.
  term-write:
    source_refs:
    - terminus-paper
    locator: PDF pp.5–6 Fig.4, Fig.7, Listing 2, §§IV-A–B
    statement: Write consumes addresses and values. The hash-table update task replaces the matching value and returns
      a success indication. CAS has address, expected and new inputs and a success output.
    evidence_kind: paper_specification
    limitations:
    - CAS is an engine primitive only in configurations with memory-unit/L2 atomic support.
    - Success output is not a returned old value. Generic fetch-add/min/max tasks are not verified here.
  term-order:
    source_refs:
    - terminus-paper
    locator: PDF pp.6–9 §§IV-C–E, V-B–D; Figs.8,12,15
    statement: Partitions enforce single-writer/multiple-reader exclusion. Tasks may hold at most one partition
      and re-enqueue on partition changes. The ROB delivers task results in enqueue order even when tasks finish
      out of order.
    evidence_kind: paper_specification
    limitations:
    - Partition protection and result order are distinct. Local locks do not synchronize other cores without shared-memory
      synchronization.
  term-host:
    source_refs:
    - terminus-paper
    locator: PDF pp.6–9 §§IV-D, V-C, V-E
    statement: Core enqueue/dequeue instructions exchange tasks/results. Acquire is asynchronous and notifies after
      running partition users drain. Deferred tasks retain partitions; handlers respond or complete/release. Concurrent
      CLHT uses shared node locks in addition to local serialization.
    evidence_kind: paper_specification
    limitations:
    - Issuing acquire is not immediate permission to modify data.
    - Exact cross-observer write visibility is not proved from task-result delivery alone.
  term-deferred:
    source_refs:
    - terminus-paper
    locator: PDF p.12 §VII-E and Fig.22; p.9 §V-E
    statement: An evaluated variant removes atomics and multiplication primitives, deferring atomic and hash operations
      to the CPU.
    evidence_kind: paper_specification
    limitations:
    - This record cannot execute CAS in the engine.
    - The evaluated distinction is not a separate published version or an invented microarchitecture.
  term-config:
    source_refs:
    - terminus-paper
    locator: PDF p.10 Table II; p.9 §V-C
    statement: Reference Terminus has 4 by 8 PEs, 256 task ROB entries, 32 partitions and 16 entries per partition
      buffer. PEs use 64-bit datapaths.
    evidence_kind: paper_specification
    limitations:
    - Reference configuration does not establish general legality or performance for other sizes.
    - 64-bit PE datapath alone does not establish every memory datatype.
  prod-dig:
    source_refs:
    - prodigy-paper
    locator: PDF pp.5–7 §§III-A–B, Figs.5–9
    statement: Software registers node base/bounds/element size, traversal edges and trigger edges in a Data Indirection
      Graph. Runtime stores configure prefetcher tables; DIG describes data relationships rather than an offloaded
      instruction stream.
    evidence_kind: paper_specification
    limitations: []
  prod-prefetch:
    source_refs:
    - prodigy-paper
    locator: PDF p.3 introduction and pp.7–9 §§IV-B–G, Figs.10–11
    statement: Demand loads in trigger regions and prefetch fills advance nonbinding L1D prefetch sequences through
      single-valued and ranged indirections. PFHRs track sequences; lagging sequences may be discarded.
    evidence_kind: paper_specification
    limitations:
    - Cache fills are assistance, not architecturally returned load values or update completion.
    - The paper leaves a general prefetch throttling mechanism to future work.
  prod-config:
    source_refs:
    - prodigy-paper
    locator: PDF pp.9–10 §VI-A, Fig.12
    statement: The study sweeps 4, 8, 16 and 32 PFHRs and chooses 16 for its reference design.
    evidence_kind: paper_specification
    limitations:
    - Explored values are not a proven runtime tuning interface or legal range.
  spzip-fetch:
    source_refs:
    - spzip-paper
    locator: PDF pp.2–4 §§II-A–C, Figs.1–6; p.6 §III-B
    statement: DCL specifies queue-connected indirection, range fetch and compression/decompression operators. The
      Push mapping fetches neighbor streams, while a destination prefetch indirection has no output queue.
    evidence_kind: paper_specification
    limitations:
    - This record describes the Push graph mapping, not every application or the compressor engine.
  spzip-cpu-update:
    source_refs:
    - spzip-paper
    locator: PDF p.4 §II-C, Listing 2; pp.8–9 §III-D Coherence and consistency
    statement: SpZip uses coherent accesses and queue synchronization. For shared destination data requiring parallel
      atomic RMW, the fetcher prefetches but does not supply the authoritative data; the CPU performs atomics.
    evidence_kind: paper_specification
    limitations:
    - This is a mapping-specific destination rule, not an assertion that SpZip has no writes or cannot handle phase-separated
      read/write arrays.
  spzip-config:
    source_refs:
    - spzip-paper
    locator: PDF p.9 §III-E and Table I
    statement: Each fetcher/compressor engine uses a 2 KB queue scratchpad; the described BPC implementation supports
      32- or 64-bit elements.
    evidence_kind: paper_specification
    limitations:
    - The queue capacity is a reference implementation parameter, not inferred effective capacity for every operator
      arrangement.
  bfs-types:
    source_refs:
    - dx100-bfs
    - dx100-graph
    locator: bfs.cc L227–259; graph.h L87–90
    statement: Pinned TDStep loads frontier, CSR bounds and neighbors, reads parent, uses CPU CAS, explicitly stores
      parent and appends newly discovered vertices. SGOffset is int32_t in this source revision.
    evidence_kind: code_inspection
    limitations:
    - Received feature files describe int64_t offsets; source binding must resolve this mismatch.
    - No profiling results or runtime behavior were measured for this catalog.
  dxc-ready-response:
    source_refs:
    - dx100-cpuport
    - dx100-maa
    - dx100-spd-code
    - dx100-api
    locator: CpuSidePort.cc L295–315; MAA.cc L652–676; SPD.cc L120–138; MAA_gem5.hpp L98–101
    statement: The artifact ready-range read returns constant 1 only when the tile-ready counter is zero; otherwise
      the response is retained. setTileReady later releases retained responses. The API performs one mapped read
      followed by mfence.
    evidence_kind: code_inspection
    limitations:
    - Core-0 status interface in this inspected path; no instruction generation tag is returned.
    - This is a held-read implementation, distinct from the paper polling description.
    - This local status-response chain does not prove the entire CPU/compiler/cache visibility composition.
  dxc-direct-backing:
    source_refs:
    - dx100-reference-script
    - dx100-ramulator
    - dx100-abstract-memory
    locator: scripts/sim.py L112–113 and L233–234; ramulator2.cc L197–230 and L241–271; abstract_mem.cc L460–472
    statement: The reference command generator selects Ramulator2. An accepted write calls accessAndRespond immediately;
      AbstractMemory::access copies write data to backing storage when writeOK and backing storage are present.
    evidence_kind: code_inspection
    limitations:
    - This is conditional direct-route modeled data mutation, not a statement about every packet route or live configuration.
    - DRAM timing completion, CPU-visible global order, coherence and safe reuse remain separate.
    - No-response acceptance alone is not evidence of a lost write.
  dxc-reuse-scope:
    source_refs:
    - dx100-maa
    - dx100-spd
    - dx100-spd-code
    - dx100-if
    locator: MAA.cc L556–582 and L605–623; SPD.hh L30–34; SPD.cc L120–138; IF.cc L193–220
    statement: Dispatch/completion update ready counts for dst1/dst2/src1/src2 tile operands. condSpdID participates
      in scoreboard conflicts but is absent from those ready-count updates; ready is equality to zero in uint8 storage.
    evidence_kind: code_inspection
    limitations:
    - A condition-only tile wait is not established as a safe host reuse barrier.
    - 'No reachable counter-overflow defect is alleged: actual instruction admission and dependency bounds must
      be checked.'
    disposition: research_only_unresolved_mapping_obligation
  dxc-bfs-composition:
    source_refs:
    - dx100-bfs
    - dx100-api
    - dx100-range
    - dx100-indirect
    locator: bfs.cc L146–183 and L201–220; MAA_gem5.hpp L270–383; RangeFuser.cc L186–239; IndirectAccess.cc L491–527
      and L898–924
    statement: TDStepMAA composes frontier loads, gathered bounds, range generation and dependent neighbor/parent
      gathers. Its accelerated parent-update sequence is enclosed in an OpenMP critical region and uses masked store
      with old results; a separate small-frontier fallback uses CPU CAS.
    evidence_kind: code_inspection
    limitations:
    - This is a source example of instruction composition, not an equivalence proof or a supplied mapping for the
      received profiles.
    - Do not relabel the masked store as engine CAS or silently transfer its synchronization to arbitrary callers.
  dxc-float-order:
    source_refs:
    - dx100-indirect
    locator: IndirectAccess.cc L975–984, L1019–1029, L1071–1081 and L1116–1126
    statement: The floating MIN/MAX comparison-and-select branches choose the incoming operand when the comparison
      is false. Operand order can therefore affect NaN and signed-zero results, so operator names alone do not prove
      bitwise commutative reductions.
    evidence_kind: research_inference
    limitations:
    - Inference from the inspected C++ expressions; no hardware execution or language-wide numerical contract is
      claimed.
    - Finite addition also requires an application-appropriate reordering tolerance.
  bfs-mapping-boundary:
    source_refs:
    - dx100-paper
    - dx100-bfs
    - dx100-graph
    locator: DX100 PDF p.6 §3.6 and p.7 §4.2; bfs.cc L227–259; graph.h L87–90
    statement: BFS read offload can be investigated for exact stable graph/frontier regions while the CPU updates
      other arrays. Offloading reads of parent while CPU CAS modifies that same array is not established as legal
      by the DX100 paper contract.
    evidence_kind: research_inference
    limitations:
    - Mapping inference, not workload compatibility evidence; aliases, phases, writers, types and synchronization
      still need proof.
    - The received profiles and pinned source disagree on offset width; this catalog does not resolve their provenance.
  dxc-payload-types:
    source_refs:
    - dx100-api
    - dx100-indirect
    - dx100-stream
    locator: MAA_gem5.hpp L164–172 and L232–362; IndirectAccess.cc L491–527 and L898–1150; StreamAccess.cc L139–161
      and L394–415
    statement: API get_data_type maps uint32_t, int32_t, float, uint64_t, int64_t and double. Read/store execution
      moves 32/64-bit words; RMW has six corresponding typed branches. Indirect index and condition reads remain
      uint32.
    evidence_kind: code_inspection
    limitations:
    - This supports type encodings and inspected execution paths, not a certified numerical or compiler ABI contract.
    - A supported 64-bit payload does not widen index, mask, range or continuation operands.
  dxc-byte-offset-domain:
    source_refs:
    - dx100-indirect-header
    - dx100-indirect
    locator: IndirectAccess.hh L113–116; IndirectAccess.cc L491–495
    statement: my_word_size is int and idx is uint32_t. On the examined ABI with 32-bit int and uint32_t as unsigned
      int, their product is 32-bit unsigned before addition to the wider base address. A 32-bit index representation
      therefore does not imply the full uint32 index domain produces the intended byte offset.
    evidence_kind: research_inference
    limitations:
    - Source-expression inference under the stated ABI, supported by an isolated C++ expression example; no gem5
      or accelerator execution was performed.
    - 'Require word_size * index to be representable before base addition: for positive 4/8-byte elements on this
      ABI, index must be at most floor((2^32-1)/word_size), plus normal base/range/alias obligations.'
    - This is an unresolved mapping limitation, not a runtime-validated hardware bug or proposed code fix.
    - The range check applies after address computation; it does not by itself prove that a wrapped product still
      denotes the intended element.
  dx-internal-p2:
    source_refs:
    - dx100-paper
    locator: 'dx100-paper: §3.2 pp.4–5; Fig.4'
    statement: Fill translates virtual addresses, decodes CH/RA/BG/BA/RO/CO and WO, groups rows by bank slice, and
      links all target words in a column to their original iteration.
    evidence_kind: paper_specification
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - ISCA 2025 author edition; publisher fulltext not independently matched.
  dx-internal-p3:
    source_refs:
    - dx100-paper
    locator: 'dx100-paper: §3.2 p.4; Fig.4 p.5'
    statement: Figure 4 has one slice per CH×RA×BG×BA; 64 associative row slots with V/S/RO; up to 8 column slots
      per row with V/S/H/CO/Tail i; Word Table has TILE entries with V/WO/Previous i. Capacities are depicted design
      choices, not a universal ISA constraint. Column is the response cache-line/burst access unit here, not an
      individual word.
    evidence_kind: paper_specification
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - ISCA 2025 author edition; publisher fulltext not independently matched.
  dx-internal-p4:
    source_refs:
    - dx100-paper
    locator: 'dx100-paper: §3.2 Request stage p.5'
    statement: Request stage starts after all words for a row have been inserted or Row Table reaches capacity.
      Slice scans valid unsent row/column entries; predetermined arbitration interleaves channels and bank groups.
      No named sorting algorithm, adaptive prediction, or precise row-complete detector is specified.
    evidence_kind: paper_specification
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - ISCA 2025 author edition; publisher fulltext not independently matched.
  dx-internal-p5:
    source_refs:
    - dx100-paper
    locator: 'dx100-paper: §3.2 Response stage p.5; Fig.4'
    statement: Response address selects row/column and word linked list; each word offset and iteration writes destination
      TD[i]. All consumers of the same word remain represented. Request order need not match original element order.
    evidence_kind: paper_specification
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - ISCA 2025 author edition; publisher fulltext not independently matched.
  dx-internal-p7:
    source_refs:
    - dx100-paper
    locator: 'dx100-paper: §3 overview p.3; §3.5 p.6; Introduction p.2'
    statement: Tile size/ready bits coordinate host; per-element finish bits permit a downstream unit to begin before
      the entire producer tile is finished. Example tile is 16K 4-byte elements. Large potential visibility is bounded
      by producer readiness and finite tables.
    evidence_kind: paper_specification
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - ISCA 2025 author edition; publisher fulltext not independently matched.
  dx-internal-p8:
    source_refs:
    - dx100-paper
    locator: 'dx100-paper: §3.2 p.5 Fill; §3.6 pp.6–7'
    statement: Paper caches a directory-snoop H bit during fill, routes H hits to LLC and misses to memory controllers;
      assumes huge pages and provisions a 256-entry TLB. These are paper choices, not a statement about current
      private virtualization.
    evidence_kind: paper_specification
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - ISCA 2025 author edition; publisher fulltext not independently matched.
  dx-internal-c1:
    source_refs:
    - dx100-indirect
    locator: 'dx100-indirect: 399–528 checkTileReady/checkElementReady/fillRowTable'
    statement: Fill advances my_i in original order only after success or a masked element; waits for condition/index
      element finish (4-byte accesses), reads uint32 index, forms base+word_size*idx, checks declared virtual range,
      aligns to block_size, translates aligned address, and stores word-index offset (vaddr-block_vaddr)/word_size.
      Masked ILD uses setFakeData, not an actual memory request; its exact value semantics are not established here.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c3:
    source_refs:
    - dx100-maa
    - dx100-indirect
    locator: 'dx100-maa: 257–337 addRamulator/map_addr; dx100-indirect: 113–241 allocate/getRowTableIdx/getGrowAddr'
    statement: MAA obtains mapping geometry from Ramulator2; map_addr discards transaction offset bits, extracts
      channel bits, then column bits, then levels 1 through row (rank, bank-group, bank, row in this organization).
      Slice index is mixed-radix modulo CH/RA/BG/BA slice organization; grow key retains quotient BG/BA plus row
      for merged-bank configurations. Physical mapping is configuration-dependent; no fixed bit positions asserted.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c4:
    source_refs:
    - dx100-tables-header
    - dx100-tables
    - dx100-port
    locator: 'dx100-tables-header: 44–169 OffsetTable/RowTableEntry/RowTableSlice; dx100-tables: 142–194 OffsetTable;
      253–281 RowTableEntry::insert; dx100-port: 102–147 sendPacket'
    statement: RowTableSlice has valid/sent row records; each RowTableEntry stores physical aligned line addr and
      first_itr/last_itr plus valid bits and send cursor. OffsetTable is tile-sized indexed by original iteration,
      with wid and next_itr. Code appends a forward list, whereas paper describes a backward Previous i list with
      a tail pointer. Code has no per-column H field; cache decision is in Port.cc.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c5:
    source_refs:
    - dx100-tables
    locator: 'dx100-tables: 347–399 RowTableSlice::insert; 253–281 RowTableEntry::insert'
    statement: Insertion first matches an unsent row+line, then tries another unsent record with same grow key,
      then allocates first free row record. When one row record exhausts its line slots another record may represent
      the same DRAM row. Only absence of a usable/free row record causes insert=false. Matching line appends another
      original-element association without another line slot.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c6:
    source_refs:
    - dx100-indirect
    - dx100-tables
    locator: 'dx100-indirect: 188–210 slice order; 621–724 Fill/Build; dx100-tables: 433–470 find_next_grow_addr/get_send_grow_rowid/get_entry_send'
    statement: With reorder enabled, Fill enters Build on final fill or insertion failure; waits for producer element/tile
      readiness do not by themselves trigger Build. Build walks unique slice order constructed by bank outermost,
      bank-group, rank, channel innermost; repeatedly selects at most one line per active slice per pass until every
      slice exhausted. Slice selects first valid unsent record from cursor, emits line slots in allocated-slot order,
      then scans other records of same grow before another grow. No address sort or DRAM-open-row feedback drives
      selection. get_entry_send drain argument is unused.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c7:
    source_refs:
    - dx100-indirect
    - dx100-tables
    locator: 'dx100-indirect: 506–514 failed insert; 725–764 Request; 1166–1173 recvData; dx100-tables: 347–399
      insert; 472–500 recv/is_full'
    statement: On failure my_i stays at failed element. Build generates currently admitted batch, marks exhausted
      row records sent; Request can continue fill as responses free records, but sent records cannot absorb additions.
      Request waits for all per-unit packets sent and cumulative received==expected, then returns Fill if fill not
      final, otherwise Response. Opportunistic fill flags in Request are local outputs not promoted to my_fill_finished;
      finalization is re-evaluated via Fill. Full-to-nonfull change of failed slice schedules execution. This is
      partial-batch progress, not proof of starvation freedom.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c8:
    source_refs:
    - dx100-indirect
    - dx100-tables
    locator: 'dx100-indirect: 868–927 recvData; dx100-tables: 170–194 OffsetTable::get_entry_recv; 313–336 RowTableEntry::recv;
      472–498 RowTableSlice::recv'
    statement: Receive decodes physical line back to slice/grow, matches valid row and (when reorder enabled) sent
      row, consumes line association list, sorts returned entries by itr, copies response bytes and writes each
      ILD destination itr using wid. Duplicate words fan out to all recorded itr values. This sort restores within-response
      association order; it does not sort outgoing requests or impose global response order.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c9:
    source_refs:
    - dx100-port
    - dx100-maa-header
    - dx100-cache-port
    - dx100-memory-port
    locator: 'dx100-port: 180–279 schedules; 301–560 send loops; dx100-maa-header: 655–695 OutstandingPacket/CompareByTick;
      dx100-cache-port: 84–133 retry/send/capacity; dx100-memory-port: 80–92 retry/send'
    statement: Port queues are multisets compared only by eligibility tick, grouped by memory channel or cache bus.
      Memory sends eligible writes before reads per channel; cache does indirect writes, indirect reads, stream
      writes, stream reads, then stream misses only if indirect memory queues empty. A failed send blocks that channel/bus
      until retry/capacity release; unsent requests remain queued. Generated slice order is not a proof of final
      DRAM command order or fairness.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c10:
    source_refs:
    - dx100-port
    locator: 'dx100-port: 31–178 sendPacket; 562–581 recvTimingResp'
    statement: New Port packet snoops synchronously at packet creation unless global or per-instruction force-cache
      is set; isBlockCached selects LLC versus direct memory. Address-keyed outstanding packet map coalesces compatible
      reads across units with waiter unit IDs and response fanout; same-unit duplicate outstanding reads are rejected.
      This is separate from within-unit word-list coalescing. Write forwarding/replacement exists under same-unit
      assertions and is outside required-gather scope.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c11:
    source_refs:
    - dx100-indirect
    - dx100-tables
    - dx100-maa
    - dx100-if
    locator: 'dx100-indirect: 330–398 checks/latency; 725–809 Request/Response; 1158–1165 ILD receive; dx100-tables:
      170–217 OffsetTable; 330–336 row all received; 472–495 slice recv; dx100-maa: 605–621 finishInstructionCompute;
      dx100-if: 303–336 finishInstructionCompute'
    statement: ILD completion needs all queued per-unit packets sent, all expected line responses received and modeled
      scratchpad/table latencies elapsed, with source tiles ready and histories empty. Responses invalidate OffsetTable
      entries and line slots; a row record becomes reusable only after all its lines return, resetting cursor/sent/valid.
      Final check_reset verifies table state; Decode resets for next instruction. MAA publishes destination Finished/Ready
      and IF clears instruction valid and updates dependent source status. Local completion is not proof of systemwide
      coherence, fences or liveness.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c12:
    source_refs:
    - dx100-config
    - dx100-indirect
    locator: 'dx100-config: 13–39 parameters; dx100-indirect: 113–186 allocate; 243–329 config selection'
    statement: 'Public defaults: tile 16384 elements; 64 row records/slice; 8 line slots/subslice-row; 32 initial
      slices; row-table latency 1 cycle; reorder enabled (no_reorder false); reconfigure false; force-cache false.
      Merged-bank configurations trade row-record totals against line slots per record. Optional enabled reconfiguration
      caches choice by base address and selects using previously observed unique row count; it is disabled by default
      and not invented adaptive intelligence. Config-cache replacement implementation is not assumed to be correct
      LRU.'
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  dx-internal-c13:
    source_refs:
    - dx100-if
    locator: 'dx100-if: 185–231 pushInstruction; 250–300 getReady'
    statement: IF rejects admission on instruction-file full, destination tile conflicts with existing sources/destinations,
      and specified same-range read/write conflicts within maa_id; getReady begins scan at rand() offset, permits
      source Service/Finished with element-level checks downstream and optional region permit for multiple units.
      These local tests do not establish all writers/aliases or global ordering.
    evidence_kind: code_inspection
    limitations:
    - Required-gather (ILD) mechanism scope; does not extend existing operation contracts, infer physical interfaces,
      or establish fairness, global coherence or performance.
    - Public e4fc4af model only; static inspection is not simulator execution or hardware validation.
  omi-term-partition:
    source_refs:
    - terminus-paper
    locator: PDF pp.6–9 §§IV-C–E, V-B–D; Figs.8,12,15
    statement: Serializer buffers same-partition tasks until conflicting users finish; it issues ready heads of
      per-partition buffers round-robin. A task holds at most one partition, releases its old partition on a change,
      and re-enqueues for the new one. Local SWMR exclusion permits concurrent readers or a single writer.
    evidence_kind: paper_specification
    limitations:
    - Partition execution order is distinct from ROB result order and shared-memory synchronization between cores.
    - Do not treat the textual grab/enqueue description as a cycle-accurate lock-acquisition protocol; exact buffer-full
      admission and fairness bounds are not specified.
  omi-term-rob:
    source_refs:
    - terminus-paper
    locator: PDF pp.5–6 §IV-B, Fig.7; pp.8–9 §V-C, Fig.15; p.10 Table II
    statement: Each task allocates a ROB entry in arrival order. Its taskID is the ROB position, propagated with
      task data; finished tasks write results to the ROB for enqueue-order core consumption. ROB stores up to 32
      bytes of task context; each PE row accesses an 8-byte slice. Reference configuration has 256 entries.
    evidence_kind: paper_specification
    limitations:
    - ROB result order is not a global write-visibility fence.
    - Exact ROB entry reclamation cycle, full-ROB admission/retry behavior and taskID generation/reuse protection
      are unspecified.
  omi-term-memory:
    source_refs:
    - terminus-paper
    locator: PDF pp.8–9 §V-C; Fig.13
    statement: Memory requester and response handler are decoupled; the response handler has a 32-entry completion
      buffer. Reads issue when their destination output queue has enough space, choosing among ready reads round-robin;
      writes launch when input address and value are ready. Data is fetched from L2 at cache-line granularity.
    evidence_kind: paper_specification
    limitations:
    - Exact request tag encoding, completion-buffer slot reclamation and arbitration of writes against reads are
      unspecified.
    - Cache-line granularity is not evidence of sorting or coalescing arbitrary task addresses.
  omi-term-filter:
    source_refs:
    - terminus-paper
    locator: PDF p.5 §IV-A, Fig.5; p.9 §V-C
    statement: Read streams terminate with a marker. Filter compares fetched values and produces matching positions
      and optionally values, or an empty marker. Parallel comparators and a collapsing network pack retained values
      contiguously in the output queue; a time-multiplexed context retains filter value or position for processing
      read responses.
    evidence_kind: paper_specification
    limitations:
    - Packing surviving values is not memory-request coalescing; a general response-tag ABI is not specified.
  omi-term-host:
    source_refs:
    - terminus-paper
    locator: PDF pp.6–7 §IV-D, Listing 3; pp.8–9 §V-C–E
    statement: 'Deferred tasks enter a defer queue without releasing their partition. A CPU handler may respond
      through a defer return queue to continue an individual primitive, or complete core-side work and release the
      partition. terminus_acquire is asynchronous: it blocks new partition entrants, waits for running users to
      release, then notifies the CPU through the defer queue.'
    evidence_kind: paper_specification
    limitations:
    - Acquire issuance does not itself grant access. CPU handlers and shared-memory node locks remain separate from
      engine execution.
    - Exact defer queue capacities, interrupt scheduling latency, fault/replay and per-resource reclamation protocols
      are unspecified.
  omi-term-variant:
    source_refs:
    - terminus-paper
    locator: PDF p.12 §VII-E, Fig.22
    statement: 'The evaluated no-atomics/no-multiplication variant defers atomics and hash operations to the CPU.
      Figure 22 evaluates hash-table benchmarks: ycsb still speeds up, to a lesser extent, because traversal eliminates
      unpredictable branches and long-latency loads; hashjoin relies more critically on these primitives because
      hashing is most of its work.'
    evidence_kind: paper_specification
    limitations:
    - Applies to the deferred configuration; it does not upgrade its engine CAS support or establish a CPU-handler
      performance bound.
  omi-term-capacity:
    source_refs:
    - terminus-paper
    locator: PDF pp.12–13 §VII-F, Fig.23; p.9 §V-D
    statement: YCSB sensitivity experiments find 64–256 task ROB entries necessary for high performance in that
      study. With one or few partitions, fine-grained update workloads see negligible speedups. The task timeline
      explains overlapping nonconflicting tasks while same-partition conflicts serialize, including false conflicts
      with limited partitions.
    evidence_kind: paper_specification
    limitations:
    - Source-cohort sensitivity, not legal tuning ranges or a universal optimal capacity; no new workload speedup
      is claimed.
  omi-prod-tables:
    source_refs:
    - prodigy-paper
    locator: PDF p.7 §§III-B3, IV-A–B; Fig.9
    statement: Software runtime stores configure DIG node, edge-index and edge tables. Node base, count and data
      size become virtual base/bound addresses; the edge-index table locates outgoing edges. PFHR entries contain
      free status, node ID, virtual trigger address, cache-line-aligned physical outstanding address and an offset
      bitmap of outstanding byte addresses in that line.
    evidence_kind: paper_specification
    limitations:
    - DIG is dependency metadata, not required-operation offload code; bitmap tracking is not a documented general
      demand coalescer.
  omi-prod-advance:
    source_refs:
    - prodigy-paper
    locator: PDF pp.7–8 §§IV-C–D; Figs.10–11
    statement: A demand load to a trigger region initializes multiple lookahead prefetch sequences according to
      trigger bounds and direction. On prefetch fill, a physical line-address CAM lookup finds tracking PFHR state,
      DIG edges and indirection type; returned indices/pointers or base/bound pairs generate subsequent single-valued
      or ranged prefetches. New PFHRs track non-leaf-node requests; traversal continues to a DIG leaf.
    evidence_kind: paper_specification
    limitations:
    - No architecturally returned gather stream or program-order result queue.
    - Duplicate physical-address CAM matches, exact scheduling among edges/ranges, arbitration and generation protection
      for stale fills are unspecified.
  omi-prod-lookahead:
    source_refs:
    - prodigy-paper
    locator: PDF pp.7–8 §IV-C1; Fig.10
    statement: The lookahead heuristic decreases distance with increasing DIG critical-path depth up to three; depth
      four or more uses distance one. Trigger metadata supplies bounds and ascending/descending traversal. When
      the core demands the trigger address of a live sequence, Prodigy drops that sequence to favor future work.
    evidence_kind: paper_specification
    limitations:
    - Dropping a speculative sequence cannot be generalized to suppress required CPU loads.
    - Logical sequence cancellation does not establish physical request cancellation or exact safe PFHR reuse ordering.
  omi-prod-finite:
    source_refs:
    - prodigy-paper
    locator: PDF p.9 §IV-G; p.10 §VI-A, Fig.12; p.13 §VI-F
    statement: When all PFHRs are busy, a prefetch is dropped. The study sweeps 4, 8, 16 and 32 PFHRs and chooses
      16 as its reference tradeoff. For area estimation it assumes 16-entry DIG tables, versus a largest evaluated
      DIG of 11 nodes/11 edges. A general prefetch throttling mechanism is not implemented and is future work.
    evidence_kind: paper_specification
    limitations:
    - 16-entry DIG tables are an area-estimation assumption, not an established runtime bound for every run.
    - No blocking required-work admission/backpressure or generic programmable throttler is inferred.
  omi-prod-negative:
    source_refs:
    - prodigy-paper
    locator: PDF pp.10–11 §§VI-A–C, Figs.12–15; p.14 §VI-G
    statement: Increasing PFHRs beyond eight hurts cc in the capacity experiment as untimely prefetches pollute
      caches. Timely prefetches aim to reduce demand memory stalls, but Prodigy does not account for branch-dependent
      neighbor selection or ordered-algorithm node priority; inaccurate prefetches and cache thrashing may result.
      Larger DIGs may need more table/PFHR storage.
    evidence_kind: paper_specification
    limitations:
    - Performance observations remain scoped to evaluated benchmarks, inputs and system; metadata coverage does
      not prove timeliness or usefulness.
  omi-spzip-scheduler:
    source_refs:
    - spzip-paper
    locator: PDF p.6 §III-B; Fig.10
    statement: Fetcher time-multiplexes operator contexts over an access unit and decompression unit. Circular scratchpad
      queues have min/max/head/tail state. A ready operator has an input element, sufficient space in its output
      queues and an available functional unit; ready operators are selected round-robin, passing the input head
      and context ID to the FU. Contexts retain FU-specific state such as a range current index.
    evidence_kind: paper_specification
    limitations:
    - Ready-operator order is not destination atomic-update order; queue-space or FU pressure prevents operator
      firing.
    - Exact number of contexts and queue-credit reservation/reclamation cycles are not established by this description.
  omi-spzip-access:
    source_refs:
    - spzip-paper
    locator: PDF p.6 §III-B; Fig.10; p.9 §III-E, Table I
    statement: Access-unit address generation and response handling are decoupled. Responses write to operator output
      queues; the AU supports up to eight outstanding cache lines in the described implementation and sends accesses
      to L2. Each engine has a 2 KB queue scratchpad shared by configured queues.
    evidence_kind: paper_specification
    limitations:
    - Eight cache lines is not eight whole traversals or eight requests per operator; 2 KB is not capacity per queue.
    - Exact response tags, out-of-order line reassembly and slot release protocol are unspecified; no locality sort/coalescer
      is documented.
  omi-spzip-markers:
    source_refs:
    - spzip-paper
    locator: PDF pp.6–7 §III-B; Fig.11, Listing 4; PDF pp.3–4 §II-C, Figs.5–6, Listing 2
    statement: Queues tag each 32-bit word with a marker bit. A range fetch emits a marker after each range, may
      associate a value with it, and operators pass input markers through to output queues. Markers delimit neighbor
      sets/frontier ranges so the CPU interprets dequeued stream elements. Push pipelines supply required adjacency/source
      streams, while destination indirection prefetch has no output queue.
    evidence_kind: paper_specification
    limitations:
    - Markers establish stream/chunk identity, not a generic global task tag or cross-queue CPU update order.
    - A marker is not a fence for completion of CPU atomics or all engine writes; exact context reuse timing remains
      unspecified.
  omi-spzip-compression:
    source_refs:
    - spzip-paper
    locator: PDF pp.3–4 §II-B–C; p.6 §III-B; p.9 §IV (Schemes)
    statement: Fetcher decompression operators use delta encoding and BPC. Delta encoding is preferable for short
      streams such as neighbor sets; BPC needs longer chunks (e.g. 32 elements) to compress effectively. In evaluated
      Push, only the adjacency matrix is compressed, using delta encoding; vertex data is not compressed.
    evidence_kind: paper_specification
    limitations:
    - Compression preference is source-specific, not a documented adaptive per-chunk selector.
    - Compressor SWU/MQU, bin writes, sorted update batching and PHI are outside this Push record; no destination
      compression/update execution is added.
  omi-spzip-cpu:
    source_refs:
    - spzip-paper
    locator: PDF p.4 §II-C, Fig.5, Listing 2; pp.8–9 §III-D
    statement: Fetcher/compressor use coherent accesses and queue synchronization. Read-only adjacency and phase-separated
      read/write streams can be served directly; shared Push destination data needing parallel atomic RMW is prefetched
      into nearby cache but not served as authoritative data by the fetcher. CPU performs atomics. Context switches
      require engine quiescence and saving/restoring contexts.
    evidence_kind: paper_specification
    limitations:
    - CPU update result, visibility and synchronization remain CPU/application responsibilities; queue consumption
      is not update completion.
    - No blanket claim that the whole SpZip design cannot write, nor a generic atomics executor.
  omi-spzip-push-negative:
    source_refs:
    - spzip-paper
    locator: PDF p.4 §II-C, Fig.7; PDF pp.9–10 §IV, §V-A, Fig.15
    statement: The illustrative BFS Push experiment on a large web graph and 16-core system reports 1.7x over software
      Push, mainly from accelerating traversals; traffic is nearly unchanged. Scatter destination updates account
      for over 80% of traffic and are uncompressed; scattered neighbor IDs compress poorly. Evaluation includes
      Push variants with and without DFS preprocessing.
    evidence_kind: paper_specification
    limitations:
    - The illustration is not a universal speedup or proof of compression benefit. Full compression results for
      UB/PHI must not be promoted into Push.
  tmu-traversal:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p5, §4.1, Tables 1–2
    statement: DnsFbrT uses constant begin/end/stride; RngFbrT uses parent stream begin/end plus constant offset/stride;
      IdxFbrT uses parent begin plus fixed size/offset/stride. ite produces induction indexes; mem loads p[x]; chained
      mem streams implement indirect lookup.
    evidence_kind: paper_specification
    limitations:
    - Table 1 names Index/IdxFbrT; nearby prose calls the SpMM primitive Indirect. This proposal follows the table
      signature. Integer signatures do not establish bit widths or legal numeric/address domains.
  tmu-fig8:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p6, Fig. 8 lines 2–21; §4.4; PDF p5 §4.2
    statement: Fig8 traverses row pointers with DnsFbrT(0,num_rows), broadcasts row begin/end to two RngFbrT lanes
      with offsets 0/1 and stride 2, loads column indexes and nnz values, loads b through column indexes, LockStep-marshals
      paired vectors, and registers GITE ri and GEND re.
    evidence_kind: paper_specification
    limitations:
    - Two lanes are the illustration, not the Table 5 evaluated eight-lane system or a legal tuning interval. Boundaries
      require padding or an msk predicate (§4.2); Fig8 omits a concrete predicate/padding ABI.
  tmu-cpu:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p5 Fig. 4; PDF p6 Fig. 6 and §4.3
    statement: TMU supplies required operands and ordered callback IDs. CPU ri multiplies vector operands and reduces/accumulates
      into sum; CPU re stores x[i++] and resets sum.
    evidence_kind: paper_specification
    limitations:
    - A CPU store is not a TMU scatter capability; CPU reduction is not TMU arithmetic.
  tmu-tu:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF pp6–7, §5.1
    statement: TU fbeg waits for valid parent bounds; fite stalls on full circular streams, pushes iteration/control
      and stream elements; fend emits end. Streams within a TU are equal-size and controlled simultaneously. Element
      i of a child queue derives from element i of its parent.
    evidence_kind: paper_specification
    limitations:
    - Logical association does not define physical request/response tags or slots.
  tmu-merges:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p7, §5.2
    statement: TG activity follows the preceding layer predicate; gite requires valid heads of all active lanes.
      Disjunctive merge consumes minimum-index active lanes and emits iteration, ending when all finish. Conjunctive
      merge consumes minimum-index lanes but emits iteration only when all active lanes match, ending when any active
      lane finishes. LockStep consumes active unfinished lanes and ends when all active lanes finish.
    evidence_kind: paper_specification
    limitations:
    - These general TG modes are context, not extra operations admitted for this Fig8 LockStep mapping. Sorted-coordinate
      merge preconditions are not discharged by retrieval.
  tmu-outq:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p6 §4.3; PDF p7 §5.3
    statement: Head/body/tail callbacks have IDs and scalar/vector/predicate operands. TG output FSMs serialize
      across groups with previous/next waiting states to preserve callback/operand order. outQ and its buffers are
      double-buffered; the core processes a full chunk while TMU fills another.
    evidence_kind: paper_specification
    limitations:
    - Callback order is not physical memory-response order or global CPU visibility. Ready/consumed acknowledgment,
      reuse and final partial chunk protocol are unspecified in inspected sections.
  tmu-arbiter:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p7, §5.4
    statement: Cacheline requests prioritize leftmost outer-loop layers; select TUs round-robin within a layer;
      select streams in configuration order and requests within a queue in order.
    evidence_kind: paper_specification
    limitations:
    - No general CAM coalescer, duplicate suppression, predictor, response ordering, or fairness bound established.
  tmu-sizing:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF pp7–8, §5.5
    statement: TUs of a layer instantiate equal stream counts and sizes at configuration. TUs within a lane share
      storage, allowing shorter leftward queues. Analytical queue allocation uses statically estimated nnzs per
      fiber.
    evidence_kind: paper_specification
    limitations:
    - Not a complete legal capacity/configuration domain or a proven sizing model for a new workload.
  tmu-integration:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF pp8–9, §5.6
    statement: TMU traverses via coherent read-only requests from LLC and writes thread-private memory-mapped outQ
      into host private L2. It uses virtual addresses and host L2 TLB/MMU; page fault interrupts the core and MMU
      signals retry after translation. Context switching quiesces and saves/restores state including initial configuration,
      ite heads and control registers.
    evidence_kind: paper_specification
    limitations:
    - Paper assumes no shared read-write data between TMU/host/other cores. This route is not a universal CPU memory-consistency
      guarantee. Detailed drain/cancel/replay, fault ordering, concurrent source mutation and acknowledgment protocol
      remain unknown.
  tmu-reference:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p9, Table 5 and §6; PDF p9, §6 RTL implementation and area analysis
    statement: Evaluation reports gem5 v20.1.0.0, 8 lanes, 4 TGs with mergers, 2KB per-lane storage and 128 outstanding
      requests. Paper separately reports a SystemVerilog implementation and synthesis/place-and-route.
    evidence_kind: paper_specification
    limitations:
    - Reported model and RTL do not establish publicly accessible runnable source, RTL bytes, evaluated commit or
      an executable ABI. Reference counts are not supported tuning ranges.
  tmu-scope:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p6 Figs. 6/8 and §4.3; PDF pp8–9 §5.6
    statement: This proposed Fig8 mapping admits required operand/event reads only. Its CPU arithmetic, CPU stores
      and any atomic read-modify-write are outside the TMU operation contract.
    evidence_kind: research_inference
    limitations:
    - Scope exclusion is a proposal decision, not a claim that every conceivable TMU extension is impossible.
  tmu-unknowns:
    source_refs:
    - tmu-micro2023-primary
    locator: PDF p5 Tables 1–2; p6 Fig. 8/§4.3; p7 §§5.1–5.4; pp8–9 §5.6
    statement: Inspected primary sections do not establish concrete configuration/register encodings, numeric widths,
      physical response tags, chunk ownership/consumption/finalpartial protocol or complete fault/drain/replay ordering.
    evidence_kind: research_inference
    limitations:
    - Evidence limit only; unknown is not unsupported.
  cobra-phase-boundary:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF pp. 3–4, §III.A–B, Fig. 3, Algorithms 1–2
    statement: PB materializes index/value tuples during Binning, then software Accumulate reads bins and applies
      destination updates. Neighbor-Populate bins (e.src,e.dst); Algorithm 2 partitions bins across Accumulate workers
      and uses ordinary Add on offsets, whereas Algorithm 1 uses AtomicAdd. Unordered neighbor lists permit the
      changed order.
    evidence_kind: paper_specification
    limitations:
    - No general permission to reorder noncommutative operations or floating-point arithmetic; no hardware destination
      update/atomic executor.
  cobra-hierarchy:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 5, §IV, Fig. 6
    statement: Hardware-managed per-level cacheline C-Buffers collect tuples over progressively narrower index ranges;
      full L1/L2 buffers are unpacked and repartitioned into next-level C-Buffers; full LLC buffers go to per-thread
      memory bins. This combines inexpensive small-buffer-set Binning with many bins for Accumulate.
    evidence_kind: paper_specification
    limitations:
    - Coalescing here means tuple collection, not same-index arithmetic reduction.
  cobra-init:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 6, §V.A, Fig. 7
    statement: bininit operands are cache-level identifier, number of reserved ways, number of unique indices, and
      tuple size in bytes. It reserves ways, computes the smallest power-of-two bin range whose C-Buffers fit, stores
      the range, and records actually used ways so unused reserved capacity can be reclaimed.
    evidence_kind: paper_specification
    limitations:
    - No encoding, header, C prototype, error convention or complete legal configuration interval is specified.
  cobra-insert:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF pp. 6–7, §V.B–C, Fig. 7
    statement: binupdate takes an index and update value and appends that pair to the selected L1 C-Buffer. Index
      high bits select buffer/set/way after removing log2(bin range) low bits. Per-buffer counters select the next
      tuple slot and wrap when full. C-Buffers are not byte addressable and exist outside shared-memory address
      space.
    evidence_kind: paper_specification
    limitations:
    - The supplied index selects a partition, not a direct store to the application destination address. No old
      destination value is returned by this collection contract.
  cobra-private-metadata:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 7, §V.C–E; PDF p. 8, Fig. 9
    statement: C-Buffers and bins are duplicated per thread; cache C-Buffers are core-private. Replacement/dirty/coherence
      bits can be repurposed for tuple counters. LLC banks are divided among cores; per-core LLC buffer count is
      bounded by the assigned bank capacity. LLC tags store per-bin offsets.
    evidence_kind: paper_specification
    limitations:
    - Private buffer metadata reuse does not establish coherent observer visibility of final application updates.
  cobra-drain:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 7, §V.D, Fig. 8; PDF p. 11, §VII.B, Fig. 13a
    statement: A full C-Buffer transfers as a cacheline to a FIFO eviction buffer; the binning engine later sequentially
      extracts and serially inserts tuples into next-level buffers using that level’s range. Buffer sizing uses
      Little’s Law then a burst-aware DES model; full eviction buffers can stall Binning.
    evidence_kind: paper_specification
    limitations:
    - No complete queue-credit reservation, cross-level arbitration, deadlock/progress proof, or packet acknowledgment
      protocol is provided.
  cobra-memory-bins:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF pp. 7–8, §V.E, Fig. 9
    statement: Each thread has contiguous tuples per bin with precomputed counts and starting BinOffset entries.
      An unnamed ISA instruction initializes LLC tag offsets from buffer ID and starting offset. A full LLC buffer
      writes to BinBasePtr + BinOffset[binID], advances the offset by its tuple count, and resets its counter.
    evidence_kind: paper_specification
    limitations:
    - The text alternates pointer/offset and tuple-count descriptions; physical byte scaling and register binding
      are not a specified ABI. Bin base initialization and the unnamed instruction’s encoding remain unknown.
  cobra-flush:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 8, §V.E, Flushing the Cache After Binning
    statement: binflush marks end of Binning. Each core walks nonempty C-Buffers serially, L1 then L2 then its LLC
      bank, writing residual tuples to memory; eviction buffers, binning engines and offset logic must handle partial
      lines using tuple counters. All remaining tuples must reach bins before Accumulate.
    evidence_kind: paper_specification
    limitations:
    - Paper states the phase requirement, but does not specify a software-visible done/ack event, inter-core join,
      memory ordering/fence semantics, cancellation, or global write completion. binupdate retirement alone cannot
      release Accumulate.
  cobra-os:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 8, §V.E, Evicting from LLC / Handling virtualization / Need for Static Cache Partitioning
    statement: The no-translation path assumes system support for matching virtual and physical addresses of important
      structures such as bins. Per-process way partitioning pins C-Buffers during Binning; other processes can evict
      partial buffers on preemption. Swapping a bin page invokes binflush; locking critical pages with mlock can
      avoid premature flush. A non-partitioned replacement-policy variant is evaluated separately.
    evidence_kind: paper_specification
    limitations:
    - mlock does not by itself establish matching VA/PA. No implemented kernel support, process isolation, migration/state-save
      protocol, translation-fault retry, or portable OS integration is verified.
  cobra-issue:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 9, §VI, Simulator
    statement: The modified Sniper model makes binupdate retire only at the ROB head because it writes data caches
      like a store; operand-selected C-Buffers avoid the usual address-generation port. CACTI supplies cache timings;
      a custom Pin cache simulator models selected studies.
    evidence_kind: paper_specification
    limitations:
    - Reported modeling is not inspected runnable source or a guarantee of global visibility on retirement.
  cobra-parameters:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF p. 6, §V.A; p. 7, §V.C–D; p. 9, §VI/Table II; p. 11, §VII.B/Fig. 13
    statement: 'Reference hierarchy: 16 OoO cores, 2.66 GHz, 4-wide issue, 128 ROB, 48 load and 32 store queue entries;
      32 KB 8-way L1, 256 KB 8-way L2, 2 MB/core 16-way LLC. Default reserves all but one L1/LLC way and one L2
      way with stream prefetching. 64 B line and 8 B tuple illustrate eight tuple slots. DES motivates 32-entry
      L1→L2 eviction buffering, while the L2→LLC Little’s Law estimate is one entry.'
    evidence_kind: paper_specification
    limitations:
    - These are paper settings/examples, not portable legal ranges. The paper’s 4/8/16 B workload tuples do not
      establish arbitrary payload types or index-width support.
  cobra-bottleneck:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF pp. 4–5, §III.C/IV, Figs. 4–6; p. 11, §VII.B, Figs. 12–13
    statement: Software PB trades fewer bins for cheap Binning against more bins for cache-local Accumulate. Many
      software C-Buffers and their management instructions/branches limit Binning. Hierarchical hardware buffering
      removes this compromise; eviction bursts and capacity retained for prefetched non-buffer data remain limiting
      factors.
    evidence_kind: paper_specification
    limitations:
    - No DX100 speedup, workload suitability or measured producer/consumer balance follows from the paper.
  cobra-comm-exclusion:
    source_refs:
    - cobra-hpca2022-paper
    locator: PDF pp. 11–12, §VII.C
    statement: COBRA-COMM is a separate commutativity-specialized design with LLC same-index tuple reduction and
      an atomic LLC reduction unit enabling shared LLC buffers.
    evidence_kind: paper_specification
    limitations:
    - Excluded from this base COBRA mapping; its reduction unit cannot be inherited by base COBRA.
  axi24-index:
    statement: Wide index fetches feed N parallel index queues and dependent narrow element request generation.
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.2 §II-A Fig.2a
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-window:
    statement: W oldest narrow requests form a parallel comparison window; N,W powers of two, W>=N; single CSHR
      aggregates same-block hits.
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.2 §II-B Fig.2b
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-association:
    statement: Hitmap and per-position offset queues associate wide responses with narrow consumers; W element queues
      and downsizer enforce original order before packing.
    source_refs:
    - axi-pack-coalescer
    locator: PDF pp.2–3 §II-B
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-progress:
    statement: Regulator timeout forwards an incomplete window; separate watcher watchdog issues a pending coalesced
      wide request.
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.2 §II-B
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-staging:
    statement: CVA6 programs L2-SPM contiguous/indirect staging; prefetcher AXI-Pack path is distinct from Ara/CVA6
      ordinary AXI4 consumer access.
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.3 §II-C Fig.2c
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-tiles:
    statement: Six L2 arrays hold slice pointers, results, double-buffered nonzeros and indexed vectors; execution
      interrupts on pointer depletion or full result array and signals refresh.
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.3 §II-C
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-reference:
    statement: 'Reference queue depths: index 256, up/down 2, hitmap 128, offsets 2048/W; on-chip storage 27 KB
      at W=256 and 16-lane VPC with 384 KB L2 (paper notation). The integrated interfaces are 512 bits wide.'
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.3 section II-C and section III Table I
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-types:
    statement: Evaluated workloads use 32-bit indices and 64-bit nonzeros/metadata, SELL with 32 rows per slice.
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.3 §III
    evidence_kind: paper_specification
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-scope-required:
    statement: 'Required staging classification is an interpretation of the actual dataflow: computation consumes
      operands staged into L2; no general optional-prediction path is claimed.'
    source_refs:
    - axi-pack-coalescer
    locator: PDF p.3 §II-C; this report Required staging section
    evidence_kind: research_inference
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  axi24-scope-unknown:
    statement: Exact host ready/drain/register/result-lifetime/translation ABI is not established by inspected evidence.
    source_refs:
    - axi-pack-coalescer
    locator: PDF pp.2–3 §II versus public artifact inventory in this report
    evidence_kind: research_inference
    limitations:
    - Publication-scoped evidence; no runnable binding or independent reproduction.
  integration-maple-P1:
    source_refs:
    - integration-maple-paper
    locator: §3.1; Fig3 steps1–6 and A–C
    statement: Required queue API, slot ID response association and pointer-produce ACK separate from consume
    evidence_kind: paper_specification
    limitations:
    - Exact reviewed source edition only; no simulator, RTL equivalence or performance acceptance.
  integration-maple-P2:
    source_refs:
    - integration-maple-paper
    locator: §3.2; Fig4
    statement: LIMA versus required LIMA_PRODUCE; hardware range traversal
    evidence_kind: paper_specification
    limitations:
