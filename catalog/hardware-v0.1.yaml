    - dxc-local-order
    - dxc-float-order
    verification: required
  - id: dxc-reuse
    description: Before host overwrites tiles, establish which live operands consume them and a completion barrier
      covering those consumers; condition-only ready state is insufficient evidence.
    scope: Tile reuse, especially masks and aliased/wide tile storage
    claim_refs:
    - dxc-reuse-scope
    - dxc-ready-response
    verification: required
  - id: dxc-old-destination
    description: When old values are required, allocate and supply the optional destination tile and preserve it
      until all active results are consumed.
    scope: Scalar/vector stores and RMW operations requesting old values
    claim_refs:
