    software_supplies: Typed memory-mapped instruction stream, bases, register operands, scratchpad tiles and optional
      condition tiles. RNG input bounds and intermediate index tiles encode range/dependency compositions.
    invocation: Three 64-bit stores encode each instruction; manual APIs or proposed MLIR lowering.
    outputs: Fetched scratchpad values, computed index/mask tiles, and memory updates depending on instruction.
    claim_refs:
    - dxp-interface
    - dxp-read
