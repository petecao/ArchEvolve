  requirements:
  - id: maple-stable-target
    scope: All queue-fetched target arrays and any index data used for address generation
    description: Establish stable data and ownership from fetch through consumption; a coherent request
      cannot refresh an already queued value after a CPU write.
    verification: required
    claim_refs:
    - maple-stable-data
  - id: maple-queue-lifecycle
    scope: Per queue and participating software threads
    description: Bind/init/open/close queues exclusively as required and establish producer/consumer counts,
      ordering, storage reuse and a nondeadlocking runahead schedule.
    verification: required
    claim_refs:
    - maple-api
    - maple-backpressure
  - id: maple-typed-abi
    scope: Pointers, A/B element formats, bounds, packed queue values and API operands
    description: Resolve concrete payload/index/pointer types, element scaling, valid ranges, result packing
      and counts; paper-level operation names are not complete C signatures.
    verification: required
    claim_refs:
    - maple-api
    - maple-lima
    - maple-reference-config
  - id: maple-source-binding
    scope: Per BFS statement and ROI
    description: Choose pointer-produce or LIMA mode and demonstrate source operand/interval correspondence;
      supplied bounds do not offload the full queue-to-CSR dependency chain.
    verification: required
    claim_refs:
