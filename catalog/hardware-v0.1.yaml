      scope: one instruction and legally transformed ROI
      description: Memory requests may reorder; gathered responses populate input-indexed scratchpad slots.
        Update legality restricts conflicting accesses.
      claim_refs:
      - dxp-read
      - dxp-legality
    completion:
      event: Instruction retirement sets tile ready; software waits before consumption.
      visibility: Paper requires wait before scratchpad consumption or accessing memory updated by DX100;
        not independently verified here.
      claim_refs:
      - dxp-interface
    datatype_notes: u32/i32/f32/u64/i64/f64 payloads (§3.1); index/range ABI widths not established by
      this table.
    limitations: []
    realization:
      kind: native_primitive
      description: SLD instruction with base, loop-bound/stride registers and optional condition tile.
