      - dxp-read
      - dxp-interface
    ordering:
      scope: one instruction and legally transformed ROI
      description: Memory requests may reorder; gathered responses populate input-indexed scratchpad slots. Update
        legality restricts conflicting accesses.
      claim_refs:
      - dxp-read
      - dxp-legality
    completion:
      event: Instruction retirement sets tile ready; software waits before consumption.
