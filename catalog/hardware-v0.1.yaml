    verification: required
  - id: dxp-dependence
    description: Prove legal loop transformation and permissible reduction/reordering behavior.
    scope: Offloaded iterations and duplicate destinations
    claim_refs:
    - dxp-legality
    - dxp-update
    verification: required
  - id: dxp-wait
    description: Insert required waits before CPU consumption and memory accesses dependent on DX100 updates.
    scope: CPU/accelerator producer-consumer boundary
    claim_refs:
    - dxp-interface
    verification: required
