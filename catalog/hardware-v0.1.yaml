  interface:
    software_supplies: Queue identities and lifecycle/binding, virtual pointers for individual fetches,
      or configured A/B bases plus begin/end bounds for LIMA. Software establishes producer/consumer schedule,
      stable arrays and memory route.
    invocation: User-mode MMIO stores issue produces/configuration and MMIO loads consume queue values,
      using ordinary core load/store instructions. INIT, OPEN/CLOSE, PRODUCE_PTR/CONSUME and LIMA_PRODUCE/LIMA
      are paper API names, not generated C declarations.
    outputs: FIFO-delivered fetched values for queue mode, or nonbinding shared-LLC fills for speculative
      prefetch mode. CPU remains responsible for computation and updates.
    claim_refs:
    - maple-api
    - maple-queue-order
    - maple-acknowledgement
    - maple-stable-data
  internal_mechanisms:
  - id: maple-queues
    kind: buffering
    status: described
    description: Circular FIFOs share scratchpad. Full-queue produces and empty-queue consumes wait in
      buffered pipelines; configuration remains available.
    claim_refs:
    - maple-backpressure
    - maple-reference-config
  - id: maple-index-chunks
    kind: buffering
    status: described
    description: LIMA fetches adjacent B-index data in 64-byte chunks and iterates through those words
      to generate A addresses.
    claim_refs:
    - maple-lima
  - id: maple-response-association
    kind: reordering
    status: described
    description: Reserved queue slot indices are used as transaction IDs. Replies may arrive out of order
      but are placed into their associated FIFO slots for ordered consumption; this is response association,
      not a demonstrated DRAM-locality sort.
    claim_refs:
    - maple-queue-order
  - id: maple-pipelined-issue
    kind: issue_policy
    status: described
    description: Separate produce/consume/configuration pipelines permit concurrent operations. LIMA feeds
      generated requests into the produce path; a blocked queue need not stall other queues. No locality-aware
      A-address sorting policy is specified.
    claim_refs:
    - maple-backpressure
    - maple-lima
  - id: maple-host-dependencies
    kind: dependency_tracking
    status: described
    description: Software produces pointers or configures one-level LIMA intervals; queued replies retain
      slot identity. Dependencies needed to compute pointers/bounds stay in software unless the described
      LIMA operation covers them.
    claim_refs:
    - maple-api
    - maple-lima
    - maple-queue-order
  - id: maple-two-stage-completion
    kind: completion
    status: described
    description: The issue store acknowledgement occurs before the fetched memory data arrives; a consumer
      receives its data only on the queue-consume load response.
    claim_refs:
    - maple-acknowledgement
  - id: maple-pinned-head-readiness
    kind: buffering
    status: described
    description: In public RTL 742a22d's ordinary non-invalidation consume path, reservation/occupancy and
      valid payload are separate. The head and any additional piece required by the consume length must
      be valid before dequeue; ready later values do not bypass an unready head. Paper-evaluation
      configuration binding remains unknown.
    claim_refs:
    - maple-code-head-readiness
  - id: maple-pinned-credit-transfer
    kind: completion
    status: described
    description: In public RTL 742a22d's ordinary consume path, successful dequeue returns queue storage
      capacity with payload capture in the consume pipeline, before possible later NoC response delivery and CPU arithmetic.
      Admission, payload readiness, pipeline custody and CPU final use have distinct resource lifetimes.
    claim_refs:
    - maple-code-dequeue-custody
  - id: maple-target-coalescing
    kind: coalescing
    status: unknown
    description: null
    claim_refs: []
  performance_hypotheses:
  - id: maple-latency-hiding
    description: Queue-backed asynchronous fetches may hide long memory latency when useful runahead and
      concurrent requests exceed producer/consumer communication costs.
    workload_conditions:
    - Stable source arrays and a legal producer/consumer split
    - Enough independent requests and queue space for runahead
    - Useful lookahead and compatible pointer/index/queue formats
    limiting_factors:
    - NoC/MMIO consume round-trip overhead
    - Queue-full/empty stalls, dependent address computation and translation misses
    - BFS mutable parent data fails the stable-array requirement without an additional mapping proof
    claim_refs:
