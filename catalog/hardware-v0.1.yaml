    claim_refs:
    - phi-program-interface
    - phi-types-reference
    - phi-flush-consistency
    realization:
      kind: documented_sequence
      description: Configure operation/bin storage,push commutative address/value updates,disable batching
        and replay bins,flush private partial lines andsynchronize before CPU reads.
      claim_refs:
      - phi-partial-lines
      - phi-selective-batching
      - phi-program-interface
      - phi-flush-consistency
      - phi-physical-bins
      - phi-types-reference
