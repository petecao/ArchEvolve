    description: Before host overwrites tiles, establish which live operands consume them and a completion
      barrier covering those consumers; condition-only ready state is insufficient evidence.
    scope: Tile reuse, especially masks and aliased/wide tile storage
    claim_refs:
    - dxc-reuse-scope
    - dxc-ready-response
    verification: required
  - id: dxc-old-destination
    description: When old values are required, allocate and supply the optional destination tile and preserve
      it until all active results are consumed.
    scope: Scalar/vector stores and RMW operations requesting old values
    claim_refs:
    - dxc-old
    - dxc-mask
    verification: required
  - id: dxc-byte-offset
    description: Prove byte-offset product and base-address addition representability for every active
      indirect index. On the examined 32-bit int/uint32 ABI require word_size * index < 2^32 before adding
      the base; 32-bit index encoding alone is insufficient.
    scope: All selected indirect loads, scalar/vector stores and RMW, including generated indices in ranged/chained
      sequences
    claim_refs:
    - dxc-byte-offset-domain
    - dxc-gather
    verification: required
  - id: dxc-capacity
    description: Bind effective simulator/API tile configuration and prove every produced tile size fits
      its bookkeeping, alongside index/offset arithmetic and storage allocation. Do not infer a broad
      legal capacity range from Unsigned knobs.
    scope: Configured tile capacity, produced lengths, uint16 size bookkeeping and callers consuming those
      lengths
    claim_refs:
    - dxc-config
    - dxc-range
    verification: required
  parameters:
  - id: tile_elements
    unit: elements
    state: fixed_reference
    value: 16384
    domain: null
    claim_refs:
    - dxc-config
    notes: Pinned SimObject default only; effective run settings can override. Size bookkeeping is uint16;
      legal effective capacity must be established separately, not inferred from the Unsigned parameter
      type.
  - id: row_table_rows_per_slice
    unit: rows
    state: fixed_reference
    value: 64
    domain: null
    claim_refs:
    - dxc-config
