  axi24-issue-decision:
    source_refs:
    - axi-pack-coalescer
    locator: PDF p2, §II-B, Fig2b, request watcher/CSHR issue and metadata paragraphs
    statement: One active CSHR accepts hits in parallel. Pending misses cause its current wide access and hitmap/offset
      metadata to issue; misses determine next tag. After all window requests coalesce, the regulator advances;
      a watchdog can issue the current block when no new window arrives.
    evidence_kind: paper_specification
    limitations:
    - Publication mechanism only; public realization/commit, concrete ID lifetime, backpressure and complete transaction
      ABI remain independently unbound.
  pipette-register-mapping:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDF pp4,6 §III-A TableII and §IV-A queue ownership
    statement: Architectural register reads/writes map to blocking FIFO dequeue/enqueue;peek exposes the
      head without consuming ordinary data. Point-to-point queue ownership is one enqueuer and one dequeuer.
    evidence_kind: paper_specification
    limitations:
    - No authenticated executable simulator/RTL revision or numerical/performance measurement is supplied
      by this proposal.
  pipette-control-handlers:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDFp5 §III-B
    statement: Control-bit entries redirect the dequeue/peek consumer to a user-level handler. skip_to_ctrl
      discards data through the next control value;when absent,it blocks and the producer next enqueue redirects
      to its control handler.
    evidence_kind: paper_specification
    limitations:
    - No authenticated executable simulator/RTL revision or numerical/performance measurement is supplied
      by this proposal.
  pipette-speculation:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDFpp6-7 §IV-A Fig7
    statement: QRM maintains speculative/committed head/tail. Consumers use only committed producer values.
      Producer rollback releases speculative enqueue registers;consumer rollback restores speculative head.
      Consumer commit releases registers.
    evidence_kind: paper_specification
    limitations:
    - No authenticated executable simulator/RTL revision or numerical/performance measurement is supplied
      by this proposal.
  pipette-reference-access:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDFp7 §IV-B
    statement: A configured reference accelerator consumes an index stream for A[i],or start/end pairs for
      half-open A[start:end),and produces returned values through its output queue. It uses the existing
      load/store unit and virtual addresses;faults interrupt its associated producer thread.
    evidence_kind: paper_specification
    limitations:
    - No authenticated executable simulator/RTL revision or numerical/performance measurement is supplied
      by this proposal.
  pipette-finite-config:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDFp8 TablesIII-IV §IV-D
    statement: Evaluated reference uses148 QRM register entries,at most16 queues,default depth24,4 RAs and4
      connectors. RA RTL includes a32-entry outstanding-load completion buffer. These are evaluated reference
      numbers,not 16 independent queues times24 storage.
    evidence_kind: paper_specification
    limitations:
    - No authenticated executable simulator/RTL revision or numerical/performance measurement is supplied
      by this proposal.
  pipette-core-connectors:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDFpp6,8 §III-C/IV-C
    statement: Queue mapping cannot change while active. OS drains/saves architectural queues on deschedule;connectors
      enforce receiver capacity with credits and must quiesce before consumer deschedule.
    evidence_kind: paper_specification
    limitations:
    - No authenticated executable simulator/RTL revision or numerical/performance measurement is supplied
      by this proposal.
  pipette-issue-sharing:
    source_refs:
    - pipette-micro2020-author-primary
    locator: PDFp7 §IV-A issue logic and §IV-B RA implementation
    statement: Pipette retains standard ICOUNT thread prioritization. RAs opportunistically use spare rename
      and register bandwidth and existing load/store machinery. Queue-full/empty stalls preserve issue legality.
    evidence_kind: paper_specification
    limitations:
    - No authenticated simulator/RTL revision or measured issue/circuit cost supplied.
  phi-partial-lines:
    source_refs:
    - phi-micro2019-author-primary
    locator: PDFp5 §3.1.1 Fig6
    statement: Cache lines marked as buffered updates contain identity-initialized partial reductions rather
      than fetched original data. Per-level ALU coalesces updates on hits.
    evidence_kind: paper_specification
    limitations:
    - Paper specification only;actual instruction/ALU/coherence/flush/bin source and numeric legality need
      binding.
  phi-selective-batching:
    source_refs:
    - phi-micro2019-author-primary
    locator: PDFp6 §3.1.1 Fig7
    statement: LLC evictions choose in-place apply versus tagged update-bin streaming based on nonidentity
      element density;the threshold is derived from update/index byte sizes. Replay disables further batching
      and applies bin updates.
    evidence_kind: paper_specification
    limitations:
    - Paper specification only;actual instruction/ALU/coherence/flush/bin source and numeric legality need
      binding.
  phi-program-interface:
    source_refs:
    - phi-micro2019-author-primary
    locator: PDFpp6-8 §3.1.2/§3.3 Listing2
    statement: Software configures operation and bin starting addresses,then uses a push-update instruction
      with destination address and value source operands. CPU computes index/address;configuration uses
      memory-mapped registers.
    evidence_kind: paper_specification
    limitations:
    - Paper specification only;actual instruction/ALU/coherence/flush/bin source and numeric legality need
      binding.
  phi-flush-consistency:
    source_refs:
    - phi-micro2019-author-primary
    locator: PDFpp7-8 §3.2.1/§3.2.2
    statement: Buffered private partial lines are outside ordinary coherence and flush to shared banks.
      Bulk updates require relaxed-atomic annotation and phi_sync before reads;PHI does not transparently
      gather private partials for intervening reads. Mixing conventional atomics with PHI updates to the
      updated region is outside the stated discipline.
    evidence_kind: paper_specification
    limitations:
    - Paper specification only;actual instruction/ALU/coherence/flush/bin source and numeric legality need
      binding.
  phi-physical-bins:
    source_refs:
    - phi-micro2019-author-primary
    locator: PDFp8 §3.3
    statement: The examined batching implementation requires contiguous physical update storage to derive
      index from physical address. Bin chunks/pointers are physical,cache-bank-striped,and full chunks interrupt
      allocation with batching disabled temporarily. Paging out requires disabling batching.
    evidence_kind: paper_specification
    limitations:
    - Paper specification only;actual instruction/ALU/coherence/flush/bin source and numeric legality need
      binding.
  phi-types-reference:
    source_refs:
    - phi-micro2019-author-primary
    locator: PDFp9 Table3 and adjacent64B-line description
    statement: Evaluated PageRank/PageRankDelta/SpMV use8-byte double add;integer min/add examples use4-byte
      objects and radii uses8-byte bitwiseOR. Exact integer signedness and full ISA type/width ABI are not
      specified by table alone.
    evidence_kind: paper_specification
    limitations:
    - Paper specification only;actual instruction/ALU/coherence/flush/bin source and numeric legality need
      binding.
  extensor-ordered-intersection:
    source_refs:
    - extensor-micro2019-proceedings
    locator: PDFpp4-5 §4.1-4.2 Fig5-6
    statement: Scanners emit increasing coordinates and EOS; Intersect consumes matching heads together,
      drops the smaller head, and flushes when either stream ends.
    evidence_kind: paper_specification
    limitations:
    - Paper-level contract; no authenticated RTL, DMA/register ABI, physical ownership or measured reproduction.
  extensor-skip-synchronization:
    source_refs:
    - extensor-micro2019-proceedings
    locator: PDFpp6-7 §5.1-5.2 Fig8-9
    statement: Bidirectional SkipTo hints originate only from successfully output coordinates. A subsequent
      hint cannot be consumed before the previous hint frontier is reached. A coarse CAM tracks coordinates
      and metadata addresses; its registers are double buffered with a second metadata read port.
    evidence_kind: paper_specification
    limitations:
    - Paper-level contract; no authenticated RTL, DMA/register ABI, physical ownership or measured reproduction.
  extensor-coordinate-position:
    source_refs:
    - extensor-micro2019-proceedings
    locator: PDFpp7-8 §6.1-6.2 Fig10-11
    statement: Sequencer configuration supplies loop bounds, strides and tensor-dimension maps. Iterate
      selects a level and parent. Coordinate-position tuples surviving intersection address separate operand
      data storage; tile coordinates accompany delivered data.
    evidence_kind: paper_specification
    limitations:
    - Paper-level contract; no authenticated RTL, DMA/register ABI, physical ownership or measured reproduction.
  extensor-hierarchical-staging:
    source_refs:
    - extensor-micro2019-proceedings
    locator: PDFpp8-9 §7.1-7.4 Fig12-13
    statement: DRAM-level scanners sequence tiles; LLB intersects PE metadata with post-intersection fills;
      PEs intersect datapath metadata with pre-intersection scalar fills. Input tensors are tiled compressed
      sparse fibers in the evaluated design, and oversized PE tiles may be split across PEs.
    evidence_kind: paper_specification
    limitations:
    - Paper-level contract; no authenticated RTL, DMA/register ABI, physical ownership or measured reproduction.
  extensor-partial-output:
    source_refs:
    - extensor-micro2019-proceedings
    locator: PDFpp9-10 §7.5
    statement: PE partial outputs carry coordinates to a hash-table partial output buffer; COO output tiles
      are converted on fill and unloaded by sequential hash iteration. Reduction reorderability is assumed
      for the tensor algebra; it does not establish source-order IEEE bit equality.
    evidence_kind: paper_specification
    limitations:
    - Paper-level contract; no authenticated RTL, DMA/register ABI, physical ownership or measured reproduction.
  extensor-configuration-and-types:
    source_refs:
    - extensor-micro2019-proceedings
    locator: PDFp10 §7.6, §8.1-8.2
    statement: Configuration specifies tensor tiling, loop nest/dataflow and connectivity; low-level DMA,
      buffer partition, control FSM and routes are omitted. Evaluated tensors use double precision, with
      128 PEs, 64 KB PEB per PE and CAM T=32. TACO configuration generation is future work.
    evidence_kind: paper_specification
    limitations:
    - Paper-level contract; no authenticated RTL, DMA/register ABI, physical ownership or measured reproduction.
mechanism_families:
- id: queue-latency-tolerance
  name: Queue-backed asynchronous access
  description: Software-directed asynchronous fetch and queue consumption; classification does not inherit operation
    capabilities.
- id: bulk-indexed
  name: Bulk indexed access
  description: Explicit tiles and address computation; membership conveys no capabilities.
- id: task-dataflow
  name: Programmable task dataflow
  description: Queued tasks composed from primitives with scoped synchronization.
- id: semantic-prefetch
  name: Software-described prefetch
  description: Software traversal metadata guides nonbinding cache requests.
- id: compressed-stream
  name: Compressed stream traversal
  description: Queue-connected fetching and compression operators with mapping-specific duties.
- id: tmu-fiber-operand-event-marshaling
  description: Dependent fiber traversal and ordered callback/operand supply; family confers no inherited capabilities.
- id: cobra-hierarchical-tuple-binning
  description: Cacheline tuple collection and hierarchical repartitioning for software propagation blocking; no
    inherited atomics.
- id: axi-pack-required-l2-staging
  description: Programmed required operand staging into L2 with bounded request-window block coalescing; no inherited
    capabilities or generic gather substitution.
- id: pipette-register-queue-reference-access
  description: Committed inter-thread register queues with explicit configurable reference-access endpoints;no
    family-inherited operations.
- id: phi-hierarchical-bulk-update
  description: Explicit bulk commutative scatter-update interface with hierarchy coalescing,selective
    bins andflush;no generic gather capability.
- id: extensor-hierarchical-coordinate-intersection
  description: Configured tensor-fiber coordinate intersections with position-tagged operand delivery
    across a memory hierarchy; no inherited general gather capability.
decision_questions:
- id: operation-result
  question: Is the requested result a fetched value, update success, old value, reduction, or only a cache hint?
  why_it_matters: A cache hint, successful update and returned old word cannot substitute for one another.
  claim_refs:
  - dxp-update
  - dxc-old
  - term-write
  - prod-prefetch
- id: mapping-scope
  question: Which exact arrays, address ranges, aliases, writers and ROI participate?
  why_it_matters: A writer restriction applies to participating arrays and their aliases during a defined phase.
  claim_refs:
  - dxp-legality
  - dxc-region
  - spzip-cpu-update
  - bfs-mapping-boundary
- id: order
  question: Which conflicting operations must serialize, and which result order is observable?
  why_it_matters: Input-order result delivery does not establish conflict execution order or global atomicity.
  claim_refs:
  - term-order
  - term-host
  - dxc-local-order
- id: completion
  question: Which event permits which observer to consume results or reuse storage?
  why_it_matters: Ready state, accepted write, visibility and storage reuse name different obligations.
  claim_refs:
  - dxc-completion
  - term-host
  - dxc-ready-response
  - dxc-direct-backing
- id: representation
  question: Does software supply an instruction sequence, dependency graph, task graph, or compressed stream layout?
  why_it_matters: A DIG, a DCL pipeline and an ISA sequence require different software preparation.
  claim_refs:
  - prod-dig
  - spzip-fetch
  - dxp-interface
  - term-read
- id: types
  question: Are payload, index, range-bound and continuation widths independently compatible?
  why_it_matters: A supported payload width can coexist with narrower indices or range bounds. Address arithmetic
    can have a narrower intermediate product than the final address.
  claim_refs:
  - dxc-gather
  - dxc-range
  - bfs-types
  - dxc-byte-offset-domain
- id: finite-state
  question: What bounds concurrent work, and when may queues, tiles, descriptors or translations be reused?
  why_it_matters: Finite contexts may be full or still owned after values become available.
  claim_refs:
  - dxc-range
  - term-config
  - prod-config
  - spzip-config
  - dxc-reuse-scope
- id: tmu-executable-contract
  question: Who binds physical read association, typed ABI, chunk consumption and fault/drain semantics?
  why_it_matters: Paper logical paths are insufficient for an executable CPU-connected adapter.
  claim_refs:
  - tmu-unknowns
- id: tmu-representation-fit
  question: Can the workload consume the exact CSR operand/event representation while retaining CPU arithmetic/stores?
  why_it_matters: Generic gather retrieval cannot prove callback or sparse-layout compatibility.
  claim_refs:
  - tmu-fig8
  - tmu-scope
