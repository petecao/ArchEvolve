  interface:
    software_supplies: CSR and dense-vector bases, num_rows, traversal/stream/TG configuration, callback IDs and
      operand registration, private outQ; exact ABI unknown.
    invocation: Fig8 explanatory DnsFbrT/BCast/RngFbrT/LockStep/add_callback configuration; no runnable public library
      or concrete start/drain instruction established.
    outputs: ri callback ID plus nnz/vec vectors; re callback ID at row end. CPU dispatch consumes them and owns
      x stores.
    claim_refs:
