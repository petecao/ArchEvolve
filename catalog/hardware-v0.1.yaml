    software_supplies: Memory-mapped instruction stream, bases, typed scalar/vector tiles, optional mask
      and old-value destination. Range continuation registers and lower/upper bound tiles for range composition.
    invocation: Pinned MAA_gem5.hpp calls encode instructions and issue fences; wait_ready is a held mapped
      status read followed by mfence in the inspected core-0 interface.
    outputs: Input-associated fetched/old values in scratchpad tiles; range indices; memory writes.
    claim_refs:
    - dxc-gather
    - dxc-stream
    - dxc-range
    - dxc-old
    - dxc-completion
    - dxc-ready-response
  limitations:
  - Static code observation, not a runtime test.
  - Do not inherit paper guarantees or private/virtualized extensions into this pinned public artifact.
  - Array range width is narrower than a generic 64-bit payload capability.
  internal_mechanisms:
  - id: dx100-model-admission
    kind: dependency_tracking
    status: described
    description: 'Public e4fc4af ILD: IF rejects full instruction storage, destination-tile conflicts and
      specified same-range read/write conflicts within maa_id. Ready selection scans from a random offset
      and accepts Service/Finished source status; Fill still waits at unfinished condition/index elements
      in original iteration order. These checks do not establish all aliases or fairness.'
    claim_refs:
    - dx-internal-c13
    - dx-internal-c1
  - id: dx100-model-physical-grouping
    kind: buffering
    status: described
    description: 'Public e4fc4af ILD: form base + word_size * uint32 index, check virtual bounds, translate
      aligned blocks and decode configured Ramulator2 physical geometry into slice/grow keys. Unsent row
      records contain aligned physical lines; same-row overflow can use another record. Finite capacity
      failure retains the failed iteration. Geometry and merged-bank organization are configuration-dependent.'
    claim_refs:
    - dx-internal-c1
    - dx-internal-c3
    - dx-internal-c4
    - dx-internal-c5
  - id: dx100-model-duplicate-consumers
    kind: coalescing
    status: described
    description: 'Public e4fc4af ILD: a matching unsent line appends another (original iteration, word offset)
      in a forward next_itr list using first/last pointers without consuming another line slot. Duplicate
      words retain separate consumers. Compatible reads across units may also share a Port packet and waiter
      list; same-unit duplicate outstanding reads are rejected.'
    claim_refs:
    - dx-internal-c4
    - dx-internal-c5
    - dx-internal-c10
  - id: dx100-model-fixed-slice-cycle
    kind: issue_policy
    status: described
    description: 'Public e4fc4af with reorder enabled: final Fill or insertion failure enters Build; a producer
      wait alone does not. Each pass emits at most one line per active slice, channel fastest then rank,
      bank group, bank. Within a slice, scan row/line slots and other records of the same grow before another
      grow. Selection neither sorts addresses nor consults DRAM open-row state.'
    claim_refs:
    - dx-internal-c6
  - id: dx100-model-downstream-backpressure
    kind: issue_policy
    status: described
    description: 'Public e4fc4af: new packets snoop at creation unless forced to cache. Eligibility-tick
      queues are grouped by channel/cache bus; writes precede reads, and cache indirect classes precede
      stream classes. Failed sends retain queued work and block that channel/bus until retry or capacity
      release. Generator order does not guarantee downstream DRAM command order or fairness.'
    claim_refs:
    - dx-internal-c9
    - dx-internal-c10
  - id: dx100-model-result-placement
    kind: reordering
    status: described
    description: 'Public e4fc4af ILD: decode response physical line to slice/grow, consume its associations
      and sort those by itr, then write each returned word[wid] to TD[itr], including duplicate-word fanout.
      Sorting is within one response, not outgoing address sorting or global response ordering.'
    claim_refs:
    - dx-internal-c8
  - id: dx100-model-state-reuse
    kind: completion
    status: described
    description: 'Public e4fc4af ILD: consume and invalidate offset entries and line slots; only after all
      lines return is a row record reset/reusable. Sent records cannot accept additions. Request may fill
      released space, but batch transition waits for queued packets sent and received == expected; final
      Fill status is re-evaluated. Completion also checks producer readiness, modeled scratchpad/table latency
      and empty histories/tables before destination Finished/Ready and dependent-source publication. Host
      synchronization remains required.'
    claim_refs:
    - dx-internal-c7
    - dx-internal-c11
  - id: dx100-model-reference-choices
    kind: buffering
    status: described
    description: Public e4fc4af defaults include 16384 tile elements, 64 row records per slice, 8 line slots
      per subslice-row, 32 initial slices and 1-cycle row-table latency. Reorder is enabled; optional base-address/observed-row-count
      reconfiguration is disabled by default and is separate from fixed request selection. These are model
      defaults, not selected workload parameters or hardware timing evidence.
    claim_refs:
    - dx-internal-c12
