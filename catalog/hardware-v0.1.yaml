  limitations:
  - Physical memory response tags/slots, duplicate cacheline association and out-of-order completion rules.
  - Concrete ABI/register encodings, payload/index widths and address arithmetic/containment.
  - Chunk readiness, ownership, consumption acknowledgment, safe reuse, callback splitting and final partial
    chunk delivery.
  - Outstanding request drain/cancellation and precise exception, retry and context-switch replay semantics.
  - Concurrent source mutation, aliasing and cross-core observation beyond the paper-private read-only
    mapping.
  - Proposal only; no production catalog edits, execution, timing or hardware correctness validation.
  - v0 has no structured event schema, chunk ownership state machine or fault contract; these remain prose
    requirements and evidence limits.
  - read/execute applies only to required operand supply. General gather, pointer chase, TMU arithmetic
    and stores gain no support.
