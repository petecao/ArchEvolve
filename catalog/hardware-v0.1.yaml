      claim_refs:
      - phi-partial-lines
      - phi-flush-consistency
    completion:
      event: All bins replayed with batching disabled and phi_sync/privateflush completed before destination
        reads.
      visibility: Ordinary coherence retained for other data;shared buffered line reads merge residualpartials
        in-place.
      claim_refs:
      - phi-selective-batching
      - phi-flush-consistency
    type_constraints:
      payload_types:
      - float64
      index_width_bits: []
      claim_refs:
      - phi-types-reference
      notes: Double-add example supports scoped float64;integer signedness/universal index ABI unknown.
        Address/value instruction isnot an index vector ABI.
    datatype_notes: FP order/nan/signed-zero/overflow numericalrequirements must beproved;originalbenchmarks
      not relaxed.
    limitations:
    - No returned priorvalue,genericgather ormixed intervening reads.
    - Float64paper example does notcertifyoriginalorderedbit-oracle equivalence.
  - id: integer_update
    operation: reduce
    subtype: phi_bulk_integer_update
    execution_role: execute
    address_patterns:
    - indirect
    support: paper_specified
    claim_refs:
    - phi-program-interface
    - phi-types-reference
    - phi-flush-consistency
    realization:
      kind: documented_sequence
      description: Configure operation/bin storage,push commutative address/value updates,disable batching
