      - dxc-region
    completion:
      event: Instruction finish after pending-count/accounting and modeled latency checks; destination tiles become
        ready.
      visibility: Direct Ramulator2 accepted writes mutate modeled backing storage when permitted; all-route CPU/global
        visibility and safe reuse are unknown.
      claim_refs:
      - dxc-completion
      - dxc-ready-response
      - dxc-direct-backing
    datatype_notes: Assignment moves 32/64-bit words; ADD/MIN/MAX have explicit u32/i32/f32/u64/i64/f64 branches.
    limitations:
    - Scalar and vector operands supported by separate execution branches.
    - No runtime correctness, arbitrary duplicate assignment ordering, or CPU-interoperable atomicity claimed.
    - Floating min/max comparisons, NaNs, signed zero and overflow need a workload-specific numerical contract.
    - dxc-float-order records source-derived NaN/signed-zero caveats; presence of typed branches is not a numerical-equivalence
      certificate.
    - Byte-offset product representability is required (dxc-byte-offset-domain); index_width_bits does not promise
      the entire unsigned index domain.
    realization:
      kind: native_primitive
      description: Scalar or vector indexed-store/RMW opcode; old result requires optional destination tile. No
        atomic CAS is implied.
      claim_refs:
      - dxc-old
      - dxc-mask
    type_constraints:
      payload_types:
      - uint32
      - int32
      - float32
      - uint64
      - int64
      - float64
      index_width_bits:
      - 32
      claim_refs:
      - dxc-payload-types
      - dxc-gather
      - dxc-byte-offset-domain
      notes: Observed API and execution type domain only. Index width is 32 for indirect operations, independent
        of payload width. Conditions read uint32; stream min/max/stride use int. Numerical equivalence, layout,
        signedness/range safety and tile allocation still need proof. For indirect addressing on the examined ABI,
        word_size * index is a 32-bit unsigned product; prove it does not wrap before wider base addition.
  - id: dxc-cas
    operation: read_modify_write
    subtype: cas
    execution_role: execute
    address_patterns: []
    support: unsupported
    claim_refs:
    - dxc-old
    result:
      form: none
      old_value: not_returned
      validity: Active inputs only.
      claim_refs:
      - dxc-old
    ordering:
      scope: unknown
      description: unknown
      claim_refs:
      - dxc-old
    completion:
      event: unknown
      visibility: unknown
      claim_refs:
      - dxc-old
    datatype_notes: No universal datatype contract asserted.
    limitations:
    - Inspected indirect path has no expected-value/CAS execution branch; compare followed by masked store is not
      equivalent to atomic CAS.
  requirements:
  - id: dxc-region-binding
    description: Bind actual bases, registered regions, aliases and permitted writers before mapping.
    scope: Addresses touched by selected operations; not all CPU memory
    claim_refs:
    - dxc-gather
    - dxc-region
    - dxc-completion
    verification: required
  - id: dxc-widths
    description: Prove payload, uint32 index and range bounds, signed continuation/stride and sizes fit without
      truncation.
    scope: Each mapped input tile and range composition
    claim_refs:
    - dxc-gather
    - dxc-range
    - dxc-stream
    verification: required
  - id: dxc-validity
    description: Propagate masks and produced sizes; never consume inactive old-value slots as fresh values.
    scope: Output lanes of masked reads/stores/RMW
    claim_refs:
    - dxc-mask
    - dxc-old
    verification: required
  - id: dxc-observer
    description: Establish required observer visibility and safe tile/region reuse separately from instruction finish.
    scope: CPU consumption, memory updates and storage reuse
    claim_refs:
    - dxc-completion
    verification: required
  - id: dxc-numerical
    description: Check duplicates and numerical equivalence for the requested result contract.
    scope: RMW operator, datatype and returned old values
    claim_refs:
