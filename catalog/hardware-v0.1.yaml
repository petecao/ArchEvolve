claims:
  dxp-read:
    source_refs:
    - dx100-paper
    locator: PDF pp.4–6, Table 2, §§3.1–3.4, Figs.3 and 5
    statement: SLD fetches constant-stride elements; ILD gathers base-plus-index elements to scratchpad
      slots. Chaining tiles supports multiple indirections. RNG expands active half-open ranges into outer/inner
      index tiles for subsequent accesses.
    evidence_kind: paper_specification
    limitations:
    - Ranged and chained gathers are instruction compositions, not one monolithic ILD opcode.
    - §4.1 p.7 excludes conventional random-base pointer chasing.
  dxp-update:
    source_refs:
    - dx100-paper
    locator: PDF pp.4–5, Table 2, §§3.1–3.2, Fig.3
    statement: IST assigns values at indirect addresses. IRMW supports a restricted reordered update class
      including ADD, MIN and MAX. A condition tile controls whether each access executes.
    evidence_kind: paper_specification
    limitations:
    - Table 2 has no IRMW destination tile; a fetch-old interface is not established by this edition.
    - Arithmetic/ALU operator enumeration does not imply every operator is an IRMW.
    - No CAS instruction is established. Floating numerical equivalence under reordering is workload-specific.
  dxp-legality:
    source_refs:
    - dx100-paper
    locator: PDF p.6 §3.6 and p.7 §4.2 Legality
    statement: Indirect arrays are exclusively written by DX100 during the ROI. Compiler legality requires
      no core stores to accessed memory regions in the loop body and no inter-iteration dependencies.
    evidence_kind: paper_specification
    limitations:
    - Scope is the mapped arrays and offloaded region, not all CPU memory.
    - Repeated updates and reduction legality require a concrete mapping; this text does not authorize
      arbitrary duplicate assignment or concurrent CPU atomics.
  dxp-interface:
    source_refs:
    - dx100-paper
    locator: PDF pp.6–7 §§3.5–4.2, Fig.6 and Fig.7
    statement: Software provides typed tiles/registers, array bases and instructions through memory-mapped
      stores. Wait synchronizes before consuming scratchpad outputs or accessing memory updated by DX100;
      ready bits mark retired instructions.
    evidence_kind: paper_specification
    limitations:
    - Paper-level synchronization promise is distinct from static simulator-path evidence.
  dxp-translation:
    source_refs:
    - dx100-paper
    locator: PDF pp.6–7 §3.6 Address Translation
    statement: Stream and indirect regions use huge pages; software transfers PTEs into a 256-entry DX100
      TLB for the application lifetime.
    evidence_kind: paper_specification
    limitations:
    - This edition does not establish safe remapping, revocation or arbitrary alias lifetime.
  dxc-gather:
    source_refs:
    - dx100-api
    - dx100-indirect
    locator: MAA_gem5.hpp L270–287; IndirectAccess.cc L491–527 and L898–924
    statement: Indirect load API supplies array base, index tile, result tile and optional mask. Execution
      reads uint32 indices, calculates base + word_size * index, range-checks addresses and writes response
      words into original iteration slots.
    evidence_kind: code_inspection
    limitations:
    - 'Element width and index width are different: 64-bit payloads do not establish 64-bit indices.'
  dxc-stream:
    source_refs:
    - dx100-api
    - dx100-stream
    locator: MAA_gem5.hpp L232–249; StreamAccess.cc L139–170, L222–280, L321–343 and L394–403
    statement: Stream load uses min/max/stride registers and optional condition tile. Execution emits
      bounded strided accesses and writes fetched words to result slots; false conditions use setFakeData.
    evidence_kind: code_inspection
    limitations:
    - Nonpositive strides and overflow are not validated by this study.
  dxc-range:
    source_refs:
    - dx100-api
    - dx100-range
    locator: MAA_gem5.hpp L364–383; RangeFuser.cc L86–94, L159–239
    statement: Range execution reads uint32 lower/upper bounds and mask, uses signed int continuation/stride
      registers, emits outer and inner indices while j < upper, and resumes after filling a finite tile.
    evidence_kind: code_inspection
    limitations:
    - The API template does not widen the implementation range-bound path.
    - Callers must establish positive stride, representable continuation values, matching tile lengths
      and bounded output consumption.
  dxc-old:
    source_refs:
    - dx100-api
    - dx100-indirect
    locator: MAA_gem5.hpp L289–362; IndirectAccess.cc L898–1165
    statement: Scalar/vector indirect stores and RMW APIs accept an optional destination tile. recvData
      copies the current word to that tile before assignment or arithmetic; RMW execution has ADD/MIN/MAX
      branches for uint32, int32, float, uint64, int64 and double.
    evidence_kind: code_inspection
    limitations:
    - No CAS comparison-and-update branch exists in the inspected indirect operation path.
    - No independent runtime correctness or CPU-interoperable atomicity is established.
    - Floating NaNs, signed zero, overflow and reordering require explicit workload numerical contracts.
  dxc-mask:
    source_refs:
    - dx100-indirect
    - dx100-spd
    - dx100-stream
    locator: IndirectAccess.cc L491–527; SPD.hh L73–78; StreamAccess.cc L242–280
    statement: An inactive condition bypasses target access. setFakeData marks element completion without
      changing its stored payload; a ready/finished masked slot is not a valid newly returned value.
    evidence_kind: code_inspection
    limitations: []
  dxc-local-order:
    source_refs:
    - dx100-tables
    - dx100-indirect
    - dx100-port
    locator: Tables.cc L156–184; IndirectAccess.cc L898–1165; Port.cc L29–66
    statement: Offset entries append to a linked list and are consumed in that list order against a mutable
      line copy. Same-unit/same-MAA pending writeback data can be forwarded to a subsequent exclusive
      read, and pending write payloads can be replaced.
    evidence_kind: code_inspection
    limitations:
    - Scope is a collected response group and the specific pending same-line path. Not a global duplicate-index
      or inter-core order proof.
  dxc-region:
    source_refs:
    - dx100-if
    - dx100-invalidator
    locator: IF.cc L185–219 and L280–296; Invalidator.cc L133–195 and L249–264
    statement: Issue checks conflicting accesses to the same region within an MAA ID; multi-MAA admission
      consults region ownership states and modeled transitions.
    evidence_kind: code_inspection
    limitations:
    - Declared-region checks do not prove coverage of physical aliases, arbitrary overlapping registrations
      or CPU atomics.
  dxc-completion:
    source_refs:
    - dx100-port
    - dx100-indirect
    - dx100-maa
    - dx100-api
    - dx100-cpuport
    - dx100-spd-code
    locator: Port.cc L313–328 and L387–402; IndirectAccess.cc L742–791 and L843–866; MAA.cc L605–623;
      MAA_gem5.hpp L98–101; CpuSidePort.cc L295–315; SPD.cc L120–138; MAA.cc L652–676
    statement: No-response write acceptance/replacement feeds write accounting. Pending packet counts,
      response counts and modeled latency gate finish; finishInstructionCompute updates tile readiness.
      wait_ready performs a mapped load held until its ready counter clears, then mfence.
    evidence_kind: code_inspection
    limitations:
    - Accounting callbacks are not global visibility acknowledgements. Direct Ramulator2 backing mutation
      is separately scoped in dxc-direct-backing.
    - The held status-read path is established; end-to-end CPU/compiler/coherence sequencing and safe
      reuse remain separate obligations.
  dxc-config:
    source_refs:
    - dx100-config
    - dx100-spd
    - dx100-spd-code
    - dx100-api
    locator: MAA.py L13–25; SPD.hh L30–34 and L93–94; SPD.cc L188–197; MAA_gem5.hpp L102–107
    statement: The pinned SimObject declares 16384 elements per tile, 64 row-table rows per slice, 8 entries
      per subslice row, 128 request-table addresses and 16 entries per address; booleans permit no_reorder
      and force_cache_access. Configuration capacity is separate from uint16 tile-size storage, getSize/setSize
      arguments, and the API size read.
    evidence_kind: code_inspection
    limitations:
    - Defaults are not the effective configuration of every run; declaration alone does not establish
      a supported tuning domain.
    - An Unsigned configuration declaration does not establish arbitrary legal tile capacities; produced
      sizes must be representable in the independent bookkeeping paths.
  term-read:
    source_refs:
    - terminus-paper
    locator: PDF pp.4–7 §§IV-A–E; Figs.4–7, Listing 1
    statement: Read accepts an address, datatype, stride and count; ReadRange consumes start/end addresses.
      Composed tasks implement dependent hash-table lookup including linked-list traversal and B-tree
      traversal.
    evidence_kind: paper_specification
    limitations:
    - A verified general gather lowering for the received BFS source is not supplied by this paper.
  term-write:
    source_refs:
    - terminus-paper
    locator: PDF pp.5–6 Fig.4, Fig.7, Listing 2, §§IV-A–B
    statement: Write consumes addresses and values. The hash-table update task replaces the matching value
      and returns a success indication. CAS has address, expected and new inputs and a success output.
    evidence_kind: paper_specification
    limitations:
    - CAS is an engine primitive only in configurations with memory-unit/L2 atomic support.
    - Success output is not a returned old value. Generic fetch-add/min/max tasks are not verified here.
  term-order:
    source_refs:
    - terminus-paper
    locator: PDF pp.6–9 §§IV-C–E, V-B–D; Figs.8,12,15
    statement: Partitions enforce single-writer/multiple-reader exclusion. Tasks may hold at most one
      partition and re-enqueue on partition changes. The ROB delivers task results in enqueue order even
      when tasks finish out of order.
    evidence_kind: paper_specification
    limitations:
    - Partition protection and result order are distinct. Local locks do not synchronize other cores without
      shared-memory synchronization.
  term-host:
    source_refs:
    - terminus-paper
    locator: PDF pp.6–9 §§IV-D, V-C, V-E
    statement: Core enqueue/dequeue instructions exchange tasks/results. Acquire is asynchronous and notifies
      after running partition users drain. Deferred tasks retain partitions; handlers respond or complete/release.
      Concurrent CLHT uses shared node locks in addition to local serialization.
    evidence_kind: paper_specification
    limitations:
    - Issuing acquire is not immediate permission to modify data.
    - Exact cross-observer write visibility is not proved from task-result delivery alone.
  term-deferred:
    source_refs:
    - terminus-paper
    locator: PDF p.12 §VII-E and Fig.22; p.9 §V-E
    statement: An evaluated variant removes atomics and multiplication primitives, deferring atomic and
      hash operations to the CPU.
    evidence_kind: paper_specification
    limitations:
    - This record cannot execute CAS in the engine.
    - The evaluated distinction is not a separate published version or an invented microarchitecture.
  term-config:
    source_refs:
    - terminus-paper
    locator: PDF p.10 Table II; p.9 §V-C
    statement: Reference Terminus has 4 by 8 PEs, 256 task ROB entries, 32 partitions and 16 entries per
      partition buffer. PEs use 64-bit datapaths.
    evidence_kind: paper_specification
    limitations:
    - Reference configuration does not establish general legality or performance for other sizes.
    - 64-bit PE datapath alone does not establish every memory datatype.
  prod-dig:
    source_refs:
    - prodigy-paper
    locator: PDF pp.5–7 §§III-A–B, Figs.5–9
    statement: Software registers node base/bounds/element size, traversal edges and trigger edges in
      a Data Indirection Graph. Runtime stores configure prefetcher tables; DIG describes data relationships
      rather than an offloaded instruction stream.
    evidence_kind: paper_specification
    limitations: []
  prod-prefetch:
    source_refs:
    - prodigy-paper
    locator: PDF p.3 introduction and pp.7–9 §§IV-B–G, Figs.10–11
    statement: Demand loads in trigger regions and prefetch fills advance nonbinding L1D prefetch sequences
      through single-valued and ranged indirections. PFHRs track sequences; lagging sequences may be discarded.
    evidence_kind: paper_specification
    limitations:
    - Cache fills are assistance, not architecturally returned load values or update completion.
    - The paper leaves a general prefetch throttling mechanism to future work.
  prod-config:
    source_refs:
    - prodigy-paper
    locator: PDF pp.9–10 §VI-A, Fig.12
    statement: The study sweeps 4, 8, 16 and 32 PFHRs and chooses 16 for its reference design.
    evidence_kind: paper_specification
    limitations:
    - Explored values are not a proven runtime tuning interface or legal range.
  spzip-fetch:
    source_refs:
    - spzip-paper
    locator: PDF pp.2–4 §§II-A–C, Figs.1–6; p.6 §III-B
    statement: DCL specifies queue-connected indirection, range fetch and compression/decompression operators.
      The Push mapping fetches neighbor streams, while a destination prefetch indirection has no output
      queue.
    evidence_kind: paper_specification
    limitations:
    - This record describes the Push graph mapping, not every application or the compressor engine.
  spzip-cpu-update:
    source_refs:
    - spzip-paper
    locator: PDF p.4 §II-C, Listing 2; pp.8–9 §III-D Coherence and consistency
    statement: SpZip uses coherent accesses and queue synchronization. For shared destination data requiring
      parallel atomic RMW, the fetcher prefetches but does not supply the authoritative data; the CPU
      performs atomics.
    evidence_kind: paper_specification
    limitations:
    - This is a mapping-specific destination rule, not an assertion that SpZip has no writes or cannot
      handle phase-separated read/write arrays.
  spzip-config:
    source_refs:
    - spzip-paper
    locator: PDF p.9 §III-E and Table I
    statement: Each fetcher/compressor engine uses a 2 KB queue scratchpad; the described BPC implementation
      supports 32- or 64-bit elements.
    evidence_kind: paper_specification
    limitations:
    - The queue capacity is a reference implementation parameter, not inferred effective capacity for
      every operator arrangement.
  bfs-types:
    source_refs:
    - dx100-bfs
    - dx100-graph
    locator: bfs.cc L227–259; graph.h L87–90
    statement: Pinned TDStep loads frontier, CSR bounds and neighbors, reads parent, uses CPU CAS, explicitly
      stores parent and appends newly discovered vertices. SGOffset is int32_t in this source revision.
    evidence_kind: code_inspection
    limitations:
    - Received feature files describe int64_t offsets; source binding must resolve this mismatch.
    - No profiling results or runtime behavior were measured for this catalog.
  dxc-ready-response:
    source_refs:
    - dx100-cpuport
    - dx100-maa
    - dx100-spd-code
    - dx100-api
    locator: CpuSidePort.cc L295–315; MAA.cc L652–676; SPD.cc L120–138; MAA_gem5.hpp L98–101
    statement: The artifact ready-range read returns constant 1 only when the tile-ready counter is zero;
      otherwise the response is retained. setTileReady later releases retained responses. The API performs
      one mapped read followed by mfence.
    evidence_kind: code_inspection
    limitations:
    - Core-0 status interface in this inspected path; no instruction generation tag is returned.
    - This is a held-read implementation, distinct from the paper polling description.
    - This local status-response chain does not prove the entire CPU/compiler/cache visibility composition.
  dxc-direct-backing:
    source_refs:
    - dx100-reference-script
    - dx100-ramulator
    - dx100-abstract-memory
    locator: scripts/sim.py L112–113 and L233–234; ramulator2.cc L197–230 and L241–271; abstract_mem.cc
      L460–472
    statement: The reference command generator selects Ramulator2. An accepted write calls accessAndRespond
      immediately; AbstractMemory::access copies write data to backing storage when writeOK and backing
      storage are present.
    evidence_kind: code_inspection
    limitations:
    - This is conditional direct-route modeled data mutation, not a statement about every packet route
      or live configuration.
    - DRAM timing completion, CPU-visible global order, coherence and safe reuse remain separate.
    - No-response acceptance alone is not evidence of a lost write.
  dxc-reuse-scope:
    source_refs:
    - dx100-maa
    - dx100-spd
    - dx100-spd-code
    - dx100-if
    locator: MAA.cc L556–582 and L605–623; SPD.hh L30–34; SPD.cc L120–138; IF.cc L193–220
    statement: Dispatch/completion update ready counts for dst1/dst2/src1/src2 tile operands. condSpdID
      participates in scoreboard conflicts but is absent from those ready-count updates; ready is equality
      to zero in uint8 storage.
    evidence_kind: code_inspection
    limitations:
    - A condition-only tile wait is not established as a safe host reuse barrier.
    - 'No reachable counter-overflow defect is alleged: actual instruction admission and dependency bounds
      must be checked.'
    disposition: research_only_unresolved_mapping_obligation
  dxc-bfs-composition:
    source_refs:
    - dx100-bfs
    - dx100-api
    - dx100-range
    - dx100-indirect
    locator: bfs.cc L146–183 and L201–220; MAA_gem5.hpp L270–383; RangeFuser.cc L186–239; IndirectAccess.cc
      L491–527 and L898–924
    statement: TDStepMAA composes frontier loads, gathered bounds, range generation and dependent neighbor/parent
      gathers. Its accelerated parent-update sequence is enclosed in an OpenMP critical region and uses
      masked store with old results; a separate small-frontier fallback uses CPU CAS.
    evidence_kind: code_inspection
    limitations:
    - This is a source example of instruction composition, not an equivalence proof or a supplied mapping
      for the received profiles.
    - Do not relabel the masked store as engine CAS or silently transfer its synchronization to arbitrary
      callers.
  dxc-float-order:
    source_refs:
    - dx100-indirect
    locator: IndirectAccess.cc L975–984, L1019–1029, L1071–1081 and L1116–1126
    statement: The floating MIN/MAX comparison-and-select branches choose the incoming operand when the
      comparison is false. Operand order can therefore affect NaN and signed-zero results, so operator
      names alone do not prove bitwise commutative reductions.
    evidence_kind: research_inference
    limitations:
    - Inference from the inspected C++ expressions; no hardware execution or language-wide numerical contract
      is claimed.
    - Finite addition also requires an application-appropriate reordering tolerance.
  bfs-mapping-boundary:
    source_refs:
    - dx100-paper
    - dx100-bfs
    - dx100-graph
    locator: DX100 PDF p.6 §3.6 and p.7 §4.2; bfs.cc L227–259; graph.h L87–90
    statement: BFS read offload can be investigated for exact stable graph/frontier regions while the
      CPU updates other arrays. Offloading reads of parent while CPU CAS modifies that same array is not
      established as legal by the DX100 paper contract.
    evidence_kind: research_inference
    limitations:
    - Mapping inference, not workload compatibility evidence; aliases, phases, writers, types and synchronization
      still need proof.
    - The received profiles and pinned source disagree on offset width; this catalog does not resolve
      their provenance.
  dxc-payload-types:
    source_refs:
    - dx100-api
    - dx100-indirect
    - dx100-stream
    locator: MAA_gem5.hpp L164–172 and L232–362; IndirectAccess.cc L491–527 and L898–1150; StreamAccess.cc
      L139–161 and L394–415
    statement: API get_data_type maps uint32_t, int32_t, float, uint64_t, int64_t and double. Read/store
      execution moves 32/64-bit words; RMW has six corresponding typed branches. Indirect index and condition
      reads remain uint32.
    evidence_kind: code_inspection
    limitations:
    - This supports type encodings and inspected execution paths, not a certified numerical or compiler
      ABI contract.
    - A supported 64-bit payload does not widen index, mask, range or continuation operands.
  dxc-byte-offset-domain:
    source_refs:
    - dx100-indirect-header
    - dx100-indirect
    locator: IndirectAccess.hh L113–116; IndirectAccess.cc L491–495
    statement: my_word_size is int and idx is uint32_t. On the examined ABI with 32-bit int and uint32_t
      as unsigned int, their product is 32-bit unsigned before addition to the wider base address. A 32-bit
      index representation therefore does not imply the full uint32 index domain produces the intended
      byte offset.
    evidence_kind: research_inference
    limitations:
    - Source-expression inference under the stated ABI, supported by an isolated C++ expression example;
      no gem5 or accelerator execution was performed.
    - 'Require word_size * index to be representable before base addition: for positive 4/8-byte elements
      on this ABI, index must be at most floor((2^32-1)/word_size), plus normal base/range/alias obligations.'
    - This is an unresolved mapping limitation, not a runtime-validated hardware bug or proposed code
      fix.
    - The range check applies after address computation; it does not by itself prove that a wrapped product
      still denotes the intended element.
mechanism_families:
- id: bulk-indexed
  name: Bulk indexed access
  description: Explicit tiles and address computation; membership conveys no capabilities.
- id: task-dataflow
  name: Programmable task dataflow
  description: Queued tasks composed from primitives with scoped synchronization.
- id: semantic-prefetch
  name: Software-described prefetch
  description: Software traversal metadata guides nonbinding cache requests.
- id: compressed-stream
  name: Compressed stream traversal
  description: Queue-connected fetching and compression operators with mapping-specific duties.
decision_questions:
- id: operation-result
  question: Is the requested result a fetched value, update success, old value, reduction, or only a cache
    hint?
  why_it_matters: A cache hint, successful update and returned old word cannot substitute for one another.
  claim_refs:
  - dxp-update
  - dxc-old
  - term-write
  - prod-prefetch
- id: mapping-scope
  question: Which exact arrays, address ranges, aliases, writers and ROI participate?
  why_it_matters: A writer restriction applies to participating arrays and their aliases during a defined
    phase.
  claim_refs:
  - dxp-legality
  - dxc-region
  - spzip-cpu-update
  - bfs-mapping-boundary
- id: order
  question: Which conflicting operations must serialize, and which result order is observable?
  why_it_matters: Input-order result delivery does not establish conflict execution order or global atomicity.
  claim_refs:
  - term-order
  - term-host
  - dxc-local-order
- id: completion
  question: Which event permits which observer to consume results or reuse storage?
  why_it_matters: Ready state, accepted write, visibility and storage reuse name different obligations.
  claim_refs:
  - dxc-completion
  - term-host
  - dxc-ready-response
  - dxc-direct-backing
- id: representation
  question: Does software supply an instruction sequence, dependency graph, task graph, or compressed
    stream layout?
  why_it_matters: A DIG, a DCL pipeline and an ISA sequence require different software preparation.
  claim_refs:
  - prod-dig
  - spzip-fetch
  - dxp-interface
  - term-read
- id: types
  question: Are payload, index, range-bound and continuation widths independently compatible?
  why_it_matters: A supported payload width can coexist with narrower indices or range bounds. Address
    arithmetic can have a narrower intermediate product than the final address.
  claim_refs:
  - dxc-gather
  - dxc-range
  - bfs-types
  - dxc-byte-offset-domain
- id: finite-state
  question: What bounds concurrent work, and when may queues, tiles, descriptors or translations be reused?
  why_it_matters: Finite contexts may be full or still owned after values become available.
  claim_refs:
  - dxc-range
  - term-config
  - prod-config
  - spzip-config
  - dxc-reuse-scope
designs:
- id: dx100-paper-v2
  name: DX100 paper
  revision: arxiv-2505.23073v2
  record_kind: design_version
  mechanism_refs:
  - bulk-indexed
  source_refs:
  - dx100-paper
  summary: Shared tile-based access accelerator with stream and indirect units, range expansion and conditional
    updates.
  operations:
  - id: dxp-stream_load
    operation: read
    subtype: stream_load
    execution_role: execute
    address_patterns:
    - sequential
    - constant_stride
    support: paper_specified
    claim_refs:
    - dxp-read
    - dxp-interface
    result:
      form: scratchpad_tile
      old_value: not_applicable
      validity: Active inputs only.
      claim_refs:
      - dxp-read
      - dxp-interface
    ordering:
      scope: one instruction and legally transformed ROI
      description: Memory requests may reorder; gathered responses populate input-indexed scratchpad slots.
        Update legality restricts conflicting accesses.
      claim_refs:
      - dxp-read
      - dxp-legality
    completion:
      event: Instruction retirement sets tile ready; software waits before consumption.
      visibility: Paper requires wait before scratchpad consumption or accessing memory updated by DX100;
        not independently verified here.
      claim_refs:
      - dxp-interface
    datatype_notes: u32/i32/f32/u64/i64/f64 payloads (§3.1); index/range ABI widths not established by
      this table.
    limitations: []
    realization:
      kind: native_primitive
      description: SLD instruction with base, loop-bound/stride registers and optional condition tile.
      claim_refs:
      - dxp-read
      - dxp-interface
    type_constraints:
      payload_types:
      - uint32
      - int32
      - float32
      - uint64
      - int64
      - float64
      index_width_bits: []
      claim_refs:
      - dxp-read
      notes: Paper §3.1 lists six ISA payload types. Exact index/range widths are unknown in this edition;
        empty index_width_bits denotes unknown for ILD and not applicable for SLD. This is a paper claim,
        not an implementation ABI proof.
