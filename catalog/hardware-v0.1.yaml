    - dxc-config
    notes: Pinned default; geometry legality not independently established.
  - id: effective_tile_elements
    unit: elements
    state: unknown
    value: null
    domain: null
    claim_refs:
    - dxc-config
    notes: Must bind a concrete run/configuration before execution; source default is a separate field.
      Size bookkeeping is uint16; legal effective capacity must be established separately, not inferred
      from the Unsigned parameter type.
  interface:
    software_supplies: Memory-mapped instruction stream, bases, typed scalar/vector tiles, optional mask
      and old-value destination. Range continuation registers and lower/upper bound tiles for range composition.
    invocation: Pinned MAA_gem5.hpp calls encode instructions and issue fences; wait_ready is a held mapped
      status read followed by mfence in the inspected core-0 interface.
    outputs: Input-associated fetched/old values in scratchpad tiles; range indices; memory writes.
    claim_refs:
