      claim_refs:
      - phi-partial-lines
      - phi-selective-batching
      - phi-program-interface
      - phi-flush-consistency
      - phi-physical-bins
      - phi-types-reference
    result:
      form: Deferred update of destination memory;ordinary read after required synchronization obtains
        final merged data.
      old_value: not_returned
      validity: Bulk relaxed-atomic commutative semantics,no intervening reads,correct algebra/identity/numeric
        legality,actual physical/bin/flush proofs.
      claim_refs:
      - phi-flush-consistency
      - phi-program-interface
    ordering:
      scope: Declared bulk commutative update domain
      description: Coalescing and batching may change update order;does not grant bit-exact IEEE source-order
        equality,reassociation permission or arbitrary atomic/CAS substitution.
      claim_refs:
      - phi-partial-lines
      - phi-flush-consistency
    completion:
      event: All bins replayed with batching disabled and phi_sync/privateflush completed before destination
        reads.
      visibility: Ordinary coherence retained for other data;shared buffered line reads merge residualpartials
