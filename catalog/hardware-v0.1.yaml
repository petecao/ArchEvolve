  - id: counts-capacity
    description: Compute per-thread/per-bin tuple counts and starting offsets before Binning; allocate sufficient
      contiguous capacity, keep namespace membership and offset arithmetic within allocations, and preserve pointer
      lifetime through drain/Accumulate.
    scope: Memory bins
    claim_refs:
    - cobra-memory-bins
    verification: required
  - id: cache-reservation
    description: Configure each cache level and its actually used ways; verify C-Buffers fit and per-core LLC bank
      assignments. This mapping selects the partitioned base design, not the unpinned variant.
    scope: Cache ownership
    claim_refs:
