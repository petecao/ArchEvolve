  - No inspected official source implementation or runtime validation.
  internal_mechanisms:
  - id: term-reference-partition-storage
    kind: buffering
    status: described
    description: Reference engine has 32 partitions with 16 entries per partition buffer, separate from
      its 256-entry task ROB and 32-entry memory completion buffer. PE links use shallow buffers and memory
      paths use larger decoupling queues; unspecified depths remain unknown.
    claim_refs:
    - term-config
    - omi-term-memory
    - omi-term-rob
  - id: term-partition-heads
    kind: issue_policy
    status: described
    description: Ready partition-buffer heads issue round-robin under engine-local SWMR exclusion. Partition
      changes release the old ownership and re-enqueue for the new partition; at most one partition is held
      per engine task.
    claim_refs:
    - omi-term-partition
  - id: term-task-result-rob
    kind: reordering
    status: described
    description: TaskID is the ROB position and flows with task data; tasks may finish out of order but
      ROB results are delivered in enqueue order. ROB task contexts retain long-lived operands separately
      from pipeline queues.
    claim_refs:
    - omi-term-rob
  - id: term-memory-issue
    kind: issue_policy
    status: described
    description: Reads need destination queue space and arbitrate round-robin; writes launch with ready
      address/value. A separate response handler tracks in-flight accesses in a 32-entry completion buffer.
    claim_refs:
    - omi-term-memory
  - id: term-filter-packing
    kind: other
    status: described
    description: Time-multiplexed filtering retains value/position context, packs matching fetched values/positions
      and preserves stream termination markers; this packs results rather than coalescing arbitrary requests.
    claim_refs:
    - omi-term-filter
  - id: term-core-partition-handoff
    kind: completion
    status: described
    description: Defer retains the task partition; CPU response can resume an individual primitive or the
      handler can finish core-side and release. Asynchronous acquire grants ownership only after running
      users drain and notification arrives. CPU/shared-memory synchronization remains distinct.
    claim_refs:
    - omi-term-host
  - id: term-target-coalescing
    kind: coalescing
    status: unknown
    description: null
    claim_refs: []
  - id: term-exact-transport-and-reuse
    kind: completion
    status: unknown
    description: null
    claim_refs: []
  performance_hypotheses:
  - id: term-task-overlap
    description: Overlapping nonconflicting task traversals may hide memory latency while partition exclusion
      protects conflicts and the ROB restores result order.
    workload_conditions:
    - Legal partition assignment and correct local/global synchronization
