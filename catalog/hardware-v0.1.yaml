  - Paper specification only; no device or simulator validation.
  - Conventional random-base pointer chasing unsupported in §4.1; array-based chained indices are distinct.
  internal_mechanisms:
  - id: dx100-paper-ready-window
    kind: dependency_tracking
    status: described
    description: 'ISCA2025 author edition: tile size/ready bits coordinate host synchronization; per-element finish
      bits allow index producers and consumers to pipeline. A potential tile window is bounded by producer readiness
      and finite tables.'
    claim_refs:
    - dx-internal-p7
  - id: dx100-paper-physical-tables
    kind: buffering
    status: described
    description: 'ISCA2025 author edition: translated physical CH/RA/BG/BA select a row slice. Fig.4 depicts 64
      associative row slots and up to 8 column slots per row, with validity/sent and cache-status H bits; the Word
      Table has one offset and backward Previous i link per original element. These are depicted choices, not universal
      capacities.'
    claim_refs:
    - dx-internal-p2
    - dx-internal-p3
  - id: dx100-paper-line-consumers
    kind: coalescing
    status: described
    description: 'ISCA2025 author edition: one column/line fetch serves a linked list of original word consumers,
      retaining word offsets and iteration identities, including duplicate words.'
    claim_refs:
    - dx-internal-p2
    - dx-internal-p3
    - dx-internal-p5
  - id: dx100-paper-slice-cycle
    kind: issue_policy
    status: described
    description: 'ISCA2025 author edition: row completion or table capacity starts Request; sequential slice scans
      feed predetermined channel/bank-group interleaving. The precise row-complete detector and fairness bounds
      are unspecified.'
    claim_refs:
    - dx-internal-p4
  - id: dx100-paper-result-placement
    kind: reordering
    status: described
    description: 'ISCA2025 author edition: response address selects row/column and word list; offsets select payload
      words placed into TD at original iteration positions despite changed request order.'
    claim_refs:
    - dx-internal-p5
  - id: dx100-paper-cache-route
    kind: other
    status: described
    description: 'ISCA2025 author edition: first insertion of a column queries cache status during Fill and retains
      H for LLC versus memory routing. Public e4fc4af packet-creation snooping is a different implementation observation.'
    claim_refs:
    - dx-internal-p8
