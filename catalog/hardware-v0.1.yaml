    status: described
    description: Time-multiplexed filtering retains value/position context, packs matching fetched values/positions
      and preserves stream termination markers; this packs results rather than coalescing arbitrary requests.
    claim_refs:
    - omi-term-filter
  - id: term-core-partition-handoff
    kind: completion
    status: described
    description: Defer retains the task partition; CPU response can resume an individual primitive or the
      handler can finish core-side and release. Asynchronous acquire grants ownership only after running
      users drain and notification arrives. CPU/shared-memory synchronization remains distinct.
    claim_refs:
    - omi-term-host
  - id: term-target-coalescing
    kind: coalescing
    status: unknown
    description: null
    claim_refs: []
  - id: term-exact-transport-and-reuse
    kind: completion
    status: unknown
    description: null
    claim_refs: []
  - id: term-deferred-atomics-and-hash
    kind: dependency_tracking
    status: described
    description: In this configuration atomic and multiplication/hash primitives go to CPU handlers; partition/ROB
      mechanisms still apply, and engine CAS is not inferred.
    claim_refs:
    - omi-term-variant
    - omi-term-host
  performance_hypotheses:
  - id: term-task-overlap
    description: Overlapping nonconflicting task traversals may hide memory latency while partition exclusion
      protects conflicts and the ROB restores result order.
    workload_conditions:
    - Legal partition assignment and correct local/global synchronization
    - Enough independent tasks and ROB/partition capacity
    limiting_factors:
    - False conflicts and update-heavy small-partition serialization
    - Ordered-result head blocking; CPU handlers and shared-memory locks may add latency
    - Source capacity sweeps are workload-specific, not legal tuning domains
    claim_refs:
    - omi-term-capacity
    - omi-term-partition
    - omi-term-rob
  - id: term-deferred-cost
    description: Removing atomic/multiplier engine support trades implementation cost for CPU execution;
      traversal-dominated ycsb and hashing-dominated hashjoin respond differently in the source study.
    workload_conditions:
    - Legal CPU handlers preserve synchronization and return values
    - Mapping can tolerate handler frequency
    limiting_factors:
    - CPU execution and handoff costs; hashing dominates hashjoin in the cited experiment
    - No engine CAS capability in this configuration
    claim_refs:
    - omi-term-variant
- id: prodigy-hpca2021
  name: Prodigy
  revision: HPCA2021-peer-reviewed-manuscript
  record_kind: design_version
  mechanism_refs:
  - semantic-prefetch
  source_refs:
  - prodigy-paper
  summary: Per-core nonbinding prefetcher guided by software-described data structures and single-valued/ranged
    traversal edges.
  operations:
  - id: prod-prefetch
    operation: read
    subtype: prefetch
    execution_role: assist
    address_patterns:
    - indirect
    - ranged_indirect
    - chained_indirect
    support: paper_specified
    claim_refs:
    - prod-dig
    - prod-prefetch
    result:
      form: cache_fill_hint
      old_value: not_applicable
      validity: CPU demand access remains authoritative; sequences may be dropped.
      claim_refs:
      - prod-dig
      - prod-prefetch
    ordering:
      scope: nonbinding cache requests
      description: No program-operation ordering or required-value delivery supplied by prefetch sequence
        order.
      claim_refs:
      - prod-dig
      - prod-prefetch
    completion:
      event: Prefetch fill may trigger another traversal; no software operation-completion event.
      visibility: Cache residency only; no update completion or immutable-memory guarantee.
      claim_refs:
      - prod-dig
      - prod-prefetch
    datatype_notes: Node data_size and address interpretation configured in DIG; no universal width domain
      asserted.
    limitations:
    - This cannot substitute for an architectural load executor or CPU CAS.
    realization:
      kind: documented_sequence
      description: Hardware follows software DIG edges over multiple nonbinding prefetch requests; this
        is a prefetch algorithm, not a demand-gather instruction.
      claim_refs:
      - prod-dig
      - prod-prefetch
  requirements:
  - id: prod-description
    description: Register valid nodes, bounds, sizes, traversal edges and trigger edges for the actual
      workload.
    scope: DIG and each participating array
    claim_refs:
    - prod-dig
    verification: required
  - id: prod-context
    description: Preserve the correct per-thread prefetcher context; establish trigger partitioning for
      parallel use.
    scope: Private per-core prefetcher and context switches
    claim_refs:
    - prod-prefetch
    verification: required
  parameters:
  - id: pfhr_entries
    unit: entries
    state: fixed_reference
    value: 16
    domain: null
    claim_refs:
    - prod-config
    notes: Chosen reference; evaluated alternatives 4, 8 and 32 are sensitivity experiments, not a runtime
      knob domain.
  interface:
    software_supplies: Data Indirection Graph with array layout, dependency edges and triggers; no accelerator
      instruction stream.
    invocation: Runtime stores configure memory-mapped tables; demand accesses and fills drive prefetching.
    outputs: Nonbinding cache fills; CPU still executes the program and its updates.
    claim_refs:
    - prod-dig
    - prod-prefetch
  limitations:
  - No performance ranking against other catalog records.
  - No global ban on CPU writes is imposed on this read-assistance mechanism.
  internal_mechanisms:
  - id: prod-dig-and-pfhr
    kind: dependency_tracking
    status: described
    description: Node, edge-index and edge tables encode dependency traversal. PFHR free/node/trigger/physical-line/offset-bitmap
      state tracks speculative outstanding work and associates fills by line-address CAM lookup.
    claim_refs:
    - omi-prod-tables
    - omi-prod-advance
  - id: prod-trigger-and-advance
    kind: issue_policy
    status: described
    description: Trigger-region demand loads initialize lookahead sequences; prefetch fills drive DIG single-valued/ranged
      traversal toward leaves, with PFHRs allocated only for non-leaf requests. This is optional prefetch,
      with no required-value output.
    claim_refs:
    - omi-prod-advance
  - id: prod-lookahead-and-drop
    kind: issue_policy
    status: described
    description: Trigger direction/bounds and DIG-depth lookahead guide speculative runahead; demand of
      a live trigger address drops its sequence. Busy PFHRs drop prefetches, and a general throttler is
      unimplemented.
    claim_refs:
    - omi-prod-lookahead
    - omi-prod-finite
  - id: prod-finite-tracking
    kind: buffering
    status: described
    description: Reference design selects 16 PFHRs after 4/8/16/32 sensitivity experiments; 16-entry DIG
      tables are separately an area-estimation assumption. Full tracking drops optional work rather than
      blocking required CPU loads.
    claim_refs:
    - omi-prod-finite
  - id: prod-required-result-order
    kind: reordering
    status: unknown
    description: null
    claim_refs: []
  - id: prod-exact-cancel-and-pfhr-reuse
    kind: completion
    status: unknown
    description: null
    claim_refs: []
  - id: prod-general-target-coalescing
    kind: coalescing
    status: unknown
    description: null
    claim_refs: []
  performance_hypotheses:
  - id: prod-timely-useful-prefetch
    description: DIG-guided lookahead may hide demand latency when predicted dependencies are useful and
      fills are timely.
    workload_conditions:
    - Valid DIG and trigger ranges for actual traversal
    - Enough PFHR/table resources and useful runahead
    limiting_factors:
    - Untimely fills and cache pollution; cc degrades above eight PFHRs in the cited experiment
    - Unrepresented control-flow or priority information
    - Full PFHR drops and absent general throttling
    claim_refs:
    - omi-prod-negative
    - omi-prod-lookahead
    - omi-prod-finite
- id: spzip-isca2021-push
  name: SpZip Push graph mapping
  revision: ISCA2021-Push
  record_kind: mapping
  mechanism_refs:
  - compressed-stream
  source_refs:
  - spzip-paper
  summary: DCL fetcher supplies compressed traversal streams but only prefetches shared destination data;
    CPU performs destination atomics.
  operations:
  - id: spzip-neighbors
    operation: read
    subtype: gather
    execution_role: execute
    address_patterns:
    - ranged_indirect
    - chained_indirect
    support: paper_specified
    claim_refs:
    - spzip-fetch
    result:
      form: queue_value_stream_and_markers
      old_value: not_applicable
      validity: Values from declared traversal/decompression pipeline; respect markers and phases.
      claim_refs:
      - spzip-fetch
    ordering:
      scope: Push neighbor traversal and configured queues
      description: Queue-connected traversal provides streams; no destination-update order is established
        by fetched-neighbor order.
      claim_refs:
      - spzip-fetch
      - spzip-cpu-update
    completion:
      event: Output queue values and termination markers.
      visibility: Authoritative traversal values under source/phase contract; shared destination values
        use separate prefetch path.
      claim_refs:
      - spzip-fetch
      - spzip-cpu-update
    datatype_notes: No universal datatype contract asserted.
    limitations: []
    realization:
      kind: mapping_role
      description: Push neighbor/frontier traversal role in the DCL pipeline, with optional decompression.
      claim_refs:
      - spzip-fetch
  - id: spzip-destination-prefetch
    operation: read
    subtype: prefetch
    execution_role: assist
    address_patterns:
    - indirect
    support: paper_specified
    claim_refs:
    - spzip-cpu-update
    - spzip-fetch
    result:
      form: cache_fill_hint
      old_value: not_applicable
      validity: Not authoritative shared destination data.
      claim_refs:
      - spzip-cpu-update
      - spzip-fetch
    ordering:
      scope: Shared destination vertex data in Push
      description: CPU retains update synchronization.
      claim_refs:
      - spzip-cpu-update
      - spzip-fetch
    completion:
      event: Prefetch issuance/fill; no task update-completion result.
      visibility: Coherent cache assistance; CPU performs required atomic access.
      claim_refs:
      - spzip-cpu-update
      - spzip-fetch
    datatype_notes: No universal datatype contract asserted.
    limitations: []
    realization:
      kind: mapping_role
      description: Only the shared destination-vertex data role in the cited Push mapping; not a generic
        substitute for every indirect stream.
      claim_refs:
      - spzip-cpu-update
      - spzip-fetch
  - id: spzip-destination-update
    operation: read_modify_write
    subtype: destination_atomic_update
    execution_role: assist
    address_patterns: []
    support: paper_specified
    claim_refs:
    - spzip-cpu-update
    result:
      form: CPU_operation_result
      old_value: unknown
      validity: Active inputs only.
      claim_refs:
      - spzip-cpu-update
    ordering:
      scope: unknown
      description: unknown
      claim_refs:
      - spzip-cpu-update
    completion:
      event: CPU update completion; not a fetcher event.
      visibility: Determined by CPU atomic operation and application synchronization.
      claim_refs:
      - spzip-cpu-update
    datatype_notes: No universal datatype contract asserted.
    limitations:
    - No fetcher add/CAS/min/max executor inferred from the application operation.
    realization:
      kind: mapping_role
      description: CPU atomic-update responsibility in the cited Push mapping; the fetcher only assists
        with destination prefetch.
      claim_refs:
      - spzip-cpu-update
  requirements:
  - id: spzip-layout
    description: Provide DCL contexts and a compatible data layout/compression format.
    scope: Mapped traversal streams and queues
    claim_refs:
    - spzip-fetch
    verification: required
  - id: spzip-phases
    description: Respect queue synchronization and producer/consumer phases for read/write streams.
    scope: Mapped mutable streams, frontier and bins
    claim_refs:
    - spzip-cpu-update
    verification: required
  - id: spzip-destinations
    description: Keep authoritative shared destination atomic accesses on CPU in this mapping.
    scope: Push destination vertex array only
    claim_refs:
    - spzip-cpu-update
    verification: required
  parameters:
  - id: queue_scratchpad_bytes
    unit: bytes
    state: fixed_reference
    value: 2048
    domain: null
    claim_refs:
    - spzip-config
    notes: Per-engine reference queue scratchpad; does not imply 2048 bytes per operator.
  interface:
    software_supplies: DCL queue/operator contexts describing data traversal and optional compression,
      plus stream inputs.
    invocation: Configure contexts through memory-mapped I/O; enqueue input ranges/values and dequeue
      output streams.
    outputs: Fetched/decompressed streams and markers; destination prefetches.
    claim_refs:
    - spzip-fetch
    - spzip-cpu-update
  limitations:
  - SpZip is ISCA 2021 despite the old cached filename saying MICRO.
  - Compressor/memory-queue writes are real but outside the selected Push destination-update mapping.
  - No fabricated internal ports or whole-design CPU-only rule.
  internal_mechanisms:
  - id: spzip-ready-operator-round-robin
    kind: issue_policy
    status: described
    description: Input availability, output queue free space and FU availability gate operator firing; ready
      contexts share access/decompression units round-robin, retaining range progress in context state.
    claim_refs:
    - omi-spzip-scheduler
  - id: spzip-finite-queues-and-access
    kind: buffering
    status: described
    description: Circular queues share a 2 KB engine scratchpad; AU address generation and response handling
      decouple up to eight outstanding cache lines. Queue or FU pressure prevents further operator firing.
    claim_refs:
    - omi-spzip-scheduler
    - omi-spzip-access
  - id: spzip-stream-identity
    kind: completion
    status: described
    description: Range markers and marker pass-through delimit required adjacency/source streams for CPU
      interpretation. Destination-prefetch indirection has no output queue and supplies no authoritative
      shared destination value.
    claim_refs:
    - omi-spzip-markers
    - omi-spzip-cpu
  - id: spzip-push-decompression
    kind: other
    status: described
    description: Push evaluation compresses adjacency using delta encoding. Fetcher decompression and queue
      decoupling hide traversal/decompression latency; BPC exists but its longer-chunk benefits do not establish
      a Push destination compression path.
    claim_refs:
    - omi-spzip-compression
  - id: spzip-cpu-update-boundary
    kind: completion
    status: described
    description: CPU executes shared destination atomics; fetcher issues coherent destination prefetch.
      Queue stream completion remains separate from CPU update completion; context switching needs quiescence
      and context save/restore.
    claim_refs:
    - omi-spzip-cpu
  - id: spzip-exact-response-association
    kind: reordering
    status: unknown
    description: null
    claim_refs: []
  - id: spzip-exact-slot-and-context-reuse
    kind: completion
    status: unknown
    description: null
    claim_refs: []
  - id: spzip-general-target-coalescing
    kind: coalescing
    status: unknown
    description: null
    claim_refs: []
  performance_hypotheses:
  - id: spzip-push-traversal
    description: Required-stream decoupling and destination prefetch may accelerate Push traversal; adjacency
      compression benefit depends on neighbor-ID compressibility and remaining traffic bottlenecks.
    workload_conditions:
    - Correct DCL queue layout, markers and phase ownership
    - CPU retains destination atomics
    - Enough queue space and available FUs for useful runahead
    limiting_factors:
    - Scattered neighbor IDs compress poorly
    - Scatter destination updates remain uncompressed and may dominate bandwidth
    - PHI/UB compression and queue-size ablations do not establish Push gains
    claim_refs:
    - omi-spzip-push-negative
    - omi-spzip-compression
    - omi-spzip-scheduler
