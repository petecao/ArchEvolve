    - maple-lima
  - id: maple-completion
    scope: Fetch acceptance, queue value readiness, drain and memory observers
    description: Distinguish pointer-produce acknowledgement from available fetched data, consuming a
      value, draining a loop and any required observer barrier.
    verification: required
    claim_refs:
    - maple-acknowledgement
    - maple-queue-order
