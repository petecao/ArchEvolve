  - id: index-parallelism
    kind: dependency_tracking
    status: described
    description: Wide index fetches feed N parallel index queues and dependent narrow element request generation.
    claim_refs:
    - axi24-index
  - id: window-warp
    kind: coalescing
    status: described
    description: W oldest narrow requests form a parallel comparison window; N,W powers of two, W>=N; single CSHR
      aggregates same-block hits.
    claim_refs:
    - axi24-window
  - id: return-order
    kind: reordering
    status: described
    description: Hitmap and per-position offset queues associate wide responses with narrow consumers; W element
      queues and downsizer enforce original order before packing.
    claim_refs:
    - axi24-association
  - id: partial-progress
    kind: completion
    status: described
    description: Regulator timeout forwards an incomplete window; separate watcher watchdog issues a pending coalesced
      wide request.
    claim_refs:
    - axi24-progress
  - id: staged-tiles
    kind: buffering
    status: described
    description: Six L2 arrays hold slice pointers, results, double-buffered nonzeros and indexed vectors; execution
      interrupts on pointer depletion or full result array and signals refresh.
    claim_refs:
    - axi24-tiles
  - id: host-ready-drain-abi
    kind: completion
    status: unknown
    description: null
    claim_refs: []
  - id: single-cshr-wide-request-issue
    kind: issue_policy
    status: described
    description: The single active CSHR accepts matching valid window entries and retains tag/hitmap/offset metadata.
      Pending misses cause its current wide block to issue and metadata to enqueue, while misses select the next
      tag. Completion of a window allows another window; a separate watchdog issues a pending block if no new window
      arrives. Metadata backpressure and exact transaction/ID reuse need concrete implementation binding.
    claim_refs:
    - axi24-issue-decision
    - axi24-window
    - axi24-progress
  limitations:
  - Only the DATE2024 paper-scoped mapping; not DATE2023 direct vector-register integration.
  - Parameter domains, translations/coherence, final partial/drain, faults and result lifetime remain open.
  - No implementation or performance certificate.
  performance_hypotheses:
  - id: bounded-block-coalescing
    description: Requests sharing a DRAM block within the finite W window may reduce transferred blocks while L2
      staging overlaps vector computation. This is a mechanism hypothesis, not a cross-design ranking.
    workload_conditions:
    - Published tiled SELL SpMV operand staging; configured L2 arrays and source lifetime must hold.
    - Enough same-block requests inside W and overlap opportunity for subsequent tile staging.
    limiting_factors:
    - Window/FIFO capacity, request diversity, partial-window progress and payload-transfer costs.
    - Unresolved first/final tile readiness, reuse and result-drain interface.
    claim_refs:
    - axi24-window
    - axi24-association
    - axi24-staging
    - axi24-tiles
    - axi24-scope-unknown

