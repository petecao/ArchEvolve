    - dxc-mask
    verification: required
  - id: dxc-byte-offset
    description: Prove byte-offset product and base-address addition representability for every active indirect
      index. On the examined 32-bit int/uint32 ABI require word_size * index < 2^32 before adding the base; 32-bit
      index encoding alone is insufficient.
    scope: All selected indirect loads, scalar/vector stores and RMW, including generated indices in ranged/chained
      sequences
    claim_refs:
    - dxc-byte-offset-domain
    - dxc-gather
    verification: required
  - id: dxc-capacity
    description: Bind effective simulator/API tile configuration and prove every produced tile size fits its bookkeeping,
      alongside index/offset arithmetic and storage allocation. Do not infer a broad legal capacity range from Unsigned
      knobs.
    scope: Configured tile capacity, produced lengths, uint16 size bookkeeping and callers consuming those lengths
    claim_refs:
    - dxc-config
    - dxc-range
    verification: required
  parameters:
  - id: tile_elements
    unit: elements
