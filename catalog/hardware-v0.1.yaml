    completion:
      event: Instruction retirement sets tile ready; software waits before consumption.
      visibility: Paper requires wait before scratchpad consumption or accessing memory updated by DX100;
        not independently verified here.
      claim_refs:
      - dxp-interface
    datatype_notes: u32/i32/f32/u64/i64/f64 payloads (§3.1); index/range ABI widths not established by
      this table.
    limitations:
    - ILD consumes an existing index tile; producing indices is a separate operation.
    realization:
      kind: native_primitive
      description: Single ILD on an existing index tile, with optional condition tile; no range expansion
        inside ILD.
      claim_refs:
      - dxp-read
      - dxp-interface
    type_constraints:
      payload_types:
