    claim_refs:
    - cobra-init
    - cobra-memory-bins
    - cobra-flush
    notes: Precomputed software storage and offsets; ABI unit binding unresolved.
  - id: consumer-release-event
    unit: event
    state: unknown
    value: null
    domain: null
    claim_refs:
    - cobra-init
    - cobra-memory-bins
    - cobra-flush
    notes: Software-visible done/ack/fence binding not specified.
  interface:
    software_supplies: Index/value tuples, per-level configuration, precomputed per-thread bin capacities/base/offsets,
      ownership and assumed OS address support.
    invocation: Paper instructions bininit, binupdate, binflush plus unnamed LLC offset initializer. No C ABI or
      encoded ISA specification is proposed.
    outputs: Materialized tuple bins for software Accumulate. Software applies destination updates and supplies
      application-specific synchronization and numeric legality.
    claim_refs:
    - cobra-init
    - cobra-insert
    - cobra-memory-bins
    - cobra-flush
    - cobra-phase-boundary
  limitations:
  - Production admission is pending parent review; this file is only an in-memory proposal.
  - C-Buffers are outside shared-memory address space; final bin-write acknowledgment and consumer fence are unresolved.
  - Base COBRA only; COBRA-COMM and non-partitioned variant excluded.
  - Paper specifications and model reports do not certify runnable hardware, mapping legality, numeric correctness
    or performance.
  internal_mechanisms:
  - id: hierarchical-repartition
    kind: reordering
    status: described
    description: Hardware-managed per-level cacheline C-Buffers collect tuples over progressively narrower index
      ranges; full L1/L2 buffers are unpacked and repartitioned into next-level C-Buffers; full LLC buffers go to
      per-thread memory bins. This combines inexpensive small-buffer-set Binning with many bins for Accumulate.
    claim_refs:
    - cobra-hierarchy
  - id: fifo-eviction
    kind: buffering
    status: described
    description: A full C-Buffer transfers as a cacheline to a FIFO eviction buffer; the binning engine later sequentially
      extracts and serially inserts tuples into next-level buffers using that level’s range. Buffer sizing uses
      Little’s Law then a burst-aware DES model; full eviction buffers can stall Binning.
    claim_refs:
    - cobra-drain
  - id: rob-retirement
    kind: issue_policy
    status: described
    description: The modified Sniper model makes binupdate retire only at the ROB head because it writes data caches
      like a store; operand-selected C-Buffers avoid the usual address-generation port. CACTI supplies cache timings;
      a custom Pin cache simulator models selected studies.
    claim_refs:
    - cobra-issue
  - id: residual-drain
    kind: completion
    status: described
    description: binflush marks end of Binning. Each core walks nonempty C-Buffers serially, L1 then L2 then its
      LLC bank, writing residual tuples to memory; eviction buffers, binning engines and offset logic must handle
      partial lines using tuple counters. All remaining tuples must reach bins before Accumulate.
    claim_refs:
    - cobra-flush
  - id: bin-phase-initialization-dependencies
    kind: dependency_tracking
    status: described
    description: bininit establishes per-level reserved/used ways, unique-index domain, tuple size and bin range
      before binupdate selects a C-Buffer. Per-thread bin counts/starting offsets and an unnamed LLC offset initialization
      instruction supply memory destinations. Full-buffer offset advances and residual binflush must complete before
      software Accumulate consumes bins; no destination-update executor or generic FP reorder permission is implied.
    claim_refs:
    - cobra-init
    - cobra-insert
    - cobra-memory-bins
    - cobra-flush
    - cobra-phase-boundary
  - id: memory-request-duplicate-coalescing
    kind: coalescing
    status: unknown
    description: null
    claim_refs: []
  performance_hypotheses:
  - id: software-binning-bottleneck
    description: Hardware buffering may lower tuple-materialization latency when software buffer locality and management
      instructions dominate.
    workload_conditions:
    - Reordering is legal and tuple materialization is required.
    - Accumulate locality benefits from enough bins.
    limiting_factors:
    - Eviction-buffer bursts/backpressure
    - Preprocessing counts/offsets and bin memory traffic
    - Prefetched-data capacity and CPU Accumulate time
    - OS and consumer-release costs
    claim_refs:
    - cobra-bottleneck
    - cobra-drain
