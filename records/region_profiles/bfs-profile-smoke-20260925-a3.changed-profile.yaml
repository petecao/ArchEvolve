  kind: function
  name: TDStep2
  path: benchmarks/gapbs/src/bfs.cc
  lines: [260, 281]
  byte_range: [11655, 12409]
  insertion_range: [11742, 12409]
  source_sha256: cd1ef9d28c8c62ca8a2c340177951a7dbaa740ce3e9302ea3b9ce763851a50a1
  text: |-
    int64_t TDStep2(const Graph &g, pvector<NodeID> &parent, SlidingQueue<NodeID> &queue) {
        int64_t scout_count = 0;
    #pragma omp parallel
        {
            QueueBuffer<NodeID> lqueue(queue);
    #pragma omp for reduction(+ : scout_count) nowait
            for (auto q_iter = queue.begin(); q_iter < queue.end(); q_iter++) {
                NodeID u = *q_iter;
                for (NodeID v : g.out_neigh(u)) {
                    NodeID curr_val = parent[v];
                    if (curr_val < 0) {
                        if (compare_and_swap(parent[v], curr_val, u)) {
                            lqueue.push_back(v);
                            scout_count += -curr_val;
                        }
                    }
                }
            }
            lqueue.flush();
        }
        return scout_count;
    }
