  text: |-
    void QueueToBitmap(const SlidingQueue<NodeID> &queue, Bitmap &bm) {
      #pragma omp parallel for
      for (auto q_iter = queue.begin(); q_iter < queue.end(); q_iter++) {
        NodeID u = *q_iter;
        bm.set_bit_atomic(u);
      }
    }
