                tiles0[tid] = get_new_tile<int>();
                tiles1[tid] = get_new_tile<int>();
                tiles2[tid] = get_new_tile<int>();
                tiles3[tid] = get_new_tile<int>();
                tiles4[tid] = get_new_tile<int>();
