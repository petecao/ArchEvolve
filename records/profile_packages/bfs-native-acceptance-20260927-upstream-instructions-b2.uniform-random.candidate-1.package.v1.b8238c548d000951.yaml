  text: |-
    void BitmapToQueue(const Graph &g, const Bitmap &bm,
                       SlidingQueue<NodeID> &queue) {
      #pragma omp parallel
      {
        QueueBuffer<NodeID> lqueue(queue);
        #pragma omp for nowait
        for (NodeID n=0; n < g.num_nodes(); n++)
          if (bm.get_bit(n))
            lqueue.push_back(n);
        lqueue.flush();
      }
      queue.slide_window();
    }
