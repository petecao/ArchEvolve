name: uniform random graph, scale 22, requested degree 16 (gapbs -u 22 -k 16)
generator:
  application: gapbs
  tool: gapbs built-in generator and Builder (inside every gapbs kernel binary)
  arguments: -u 22 -k 16
properties:
  scale:
    value: 22
    basis: code_reading
    evidence_refs: [src-gapbs-generator]
  requested_degree:
    value: 16
    basis: code_reading
    evidence_refs: [src-gapbs-generator]
  num_nodes:
    value: null
    basis: unknown
    evidence_refs: []
    note: gapbs's Builder sets the vertex count to the largest vertex ID in the generated edge list +
      1 (apps/gapbs/src/builder.h:322-323), so it is at most 2^scale and can be smaller when the top IDs
      get no edge (the scale-22 Kronecker graph has 4194302). Filled in by profiling.
  num_edges_undirected:
    value: null
    basis: unknown
    evidence_refs: []
    note: The generator draws 67108864 edges; building removes self loops and duplicates, so the count
      is known only after a run.
  num_edges_directed:
    value: null
    basis: unknown
    evidence_refs: []
    note: Twice the undirected count (both directions stored); filled in by profiling.
  directed:
    value: false
    basis: code_reading
    evidence_refs: [src-gapbs-generator]
    note: CLBase::ParseArgs sets symmetrize for generated graphs, so the graph is undirected.
  weighted:
    value: false
    basis: code_reading
    evidence_refs: [src-gapbs-generator]
    note: Unweighted as generated; sssp's WeightedBuilder adds its own weights to the same edges.
  degree_distribution:
    value: binomial
    basis: inferred
    evidence_refs: [src-gapbs-generator]
    note: Each endpoint is drawn uniformly, so degrees are binomial around the mean; the profile's degree_skew
      measures it.
  index_locality:
    value: random
    basis: inferred
    evidence_refs: [src-gapbs-generator]
    note: Endpoints are uniform over all IDs.
  input_density:
    value: sparse_scattered
    basis: inferred
    evidence_refs: [src-gapbs-generator]
    note: About 32 of 4194304 possible neighbors per vertex in the stored CSR, spread over the ID range.
notes:
- Index data far exceeds the 24 MiB L3 of one mbit10 socket (spec pilot input).
