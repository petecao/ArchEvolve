# Draft strategy content, not a live prompt or a promoted policy.
# The coordinator wraps this editable content in the pinned strategy envelope.
search_focus: >-
  Explore a small, explainable memory-access work partition that preserves the
  supplied program semantics and makes transfer, ownership and finite resource
  obligations visible.
mutation_preferences:
  - Change one stage's placement before changing several mechanisms at once.
  - Compare serial and bounded-overlap schedules under the same source contract.
  - Tune a parameter only when its legal coupled domain and model coverage are supplied.
reasoning_guidance:
  - Identify the source of an expected benefit and the cost that may erase it.
  - Trace values and their identities from producer admission through final consumption.
  - Keep absent information separate from a completed refutation.
  - Return a targeted information request when evidence does not support the next step.
example_refs:
  - docs/designs/bfs-maple-dx100-hybrid/partition.yaml
  - docs/designs/bfs-maple-dx100-hybrid/bfs_hybrid.pseudo.cpp
