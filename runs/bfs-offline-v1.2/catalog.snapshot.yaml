heuristic_policy:
  large_jump_threshold_elements: 16
  max_candidates_default: 3
notes:
- Family index seeded from Eric drafts 2 and 3. This is not his delivered machine-readable
  catalog.
- Source claims and reference implementations still require verification. No numeric
  cost or speedup estimates are provided.
- Priority rules are transparent prototype ordering rules, not a learned policy or
  performance ranking.
- Add records with stable IDs/revisions; candidate trials do not automatically become
  trusted catalog facts.
