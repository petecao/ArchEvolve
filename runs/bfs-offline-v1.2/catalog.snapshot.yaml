        payload: Original buffers and code
        type: null
        element_bytes: null
        endpoint_role: host-facing
      outputs:
      - id: memory-traffic
        payload: Original demand reads and updates
        type: null
        element_bytes: null
        endpoint_role: memory-facing
      behavior:
        ordering: null
        completion: null
        visibility: null
      parameters: &id001 []
    connections: []
