hardware_hypotheses:
- field: indirect_access_distances.VertexOffsets.hardware_implication
  text: Extremely high spatial locality. Standard L1 hardware stream prefetchers track
    this unit-stride pattern trivially with zero cache misses.
  use: hypothesis_not_constraint
- field: indirect_access_distances.parent.hardware_implication
  text: Transforms from a random gather (in sparse graphs) into a pure linear streaming
    read. Because N is relatively small compared to sparse graphs for the same edge
    count (e.g., N=25,000 -> parent array is only 100 KB), the entire parent array
    fits comfortably in the on-chip L2/L3 cache (1 MB L2 per core).
  use: hypothesis_not_constraint
