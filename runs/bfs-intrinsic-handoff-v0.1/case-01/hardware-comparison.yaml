          effective capacity for every operator arrangement.
      spzip-cpu-update:
        source_refs:
        - spzip-paper
        locator: PDF p.4 §II-C, Listing 2; pp.8–9 §III-D Coherence and consistency
        statement: SpZip uses coherent accesses and queue synchronization. For shared
          destination data requiring parallel atomic RMW, the fetcher prefetches but
          does not supply the authoritative data; the CPU performs atomics.
        evidence_kind: paper_specification
        limitations:
        - This is a mapping-specific destination rule, not an assertion that SpZip
          has no writes or cannot handle phase-separated read/write arrays.
      spzip-fetch:
        source_refs:
        - spzip-paper
        locator: PDF pp.2–4 §§II-A–C, Figs.1–6; p.6 §III-B
        statement: DCL specifies queue-connected indirection, range fetch and compression/decompression
          operators. The Push mapping fetches neighbor streams, while a destination
          prefetch indirection has no output queue.
        evidence_kind: paper_specification
        limitations:
        - This record describes the Push graph mapping, not every application or the
          compressor engine.
