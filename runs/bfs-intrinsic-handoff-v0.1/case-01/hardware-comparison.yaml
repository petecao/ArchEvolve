- design_id: spzip-isca2021-push
  revision: ISCA2021-Push
  record_kind: mapping
  summary: DCL fetcher supplies compressed traversal streams but only prefetches shared
    destination data; CPU performs destination atomics.
  interface:
    software_supplies: DCL queue/operator contexts describing data traversal and optional
      compression, plus stream inputs.
    invocation: Configure contexts through memory-mapped I/O; enqueue input ranges/values
      and dequeue output streams.
    outputs: Fetched/decompressed streams and markers; destination prefetches.
    claim_refs:
    - spzip-fetch
    - spzip-cpu-update
  conditionally_matched_read_requests: []
  assisted_read_requests:
  - access-02-read
  - access-04-read
