  excluded:
  - design_id: prodigy-hpca2021
    design_revision: HPCA2021-peer-reviewed-manuscript
    record_kind: design_version
    operation_id: prod-prefetch
    operation:
      id: prod-prefetch
      operation: read
      subtype: prefetch
      execution_role: assist
      address_patterns:
      - indirect
      - ranged_indirect
      - chained_indirect
      support: paper_specified
      claim_refs:
      - prod-dig
      - prod-prefetch
      result:
        form: cache_fill_hint
        old_value: not_applicable
        validity: CPU demand access remains authoritative; sequences may be dropped.
        claim_refs:
        - prod-dig
        - prod-prefetch
      ordering:
        scope: nonbinding cache requests
        description: No program-operation ordering or required-value delivery supplied
          by prefetch sequence order.
        claim_refs:
        - prod-dig
        - prod-prefetch
      completion:
        event: Prefetch fill may trigger another traversal; no software operation-completion
          event.
        visibility: Cache residency only; no update completion or immutable-memory
          guarantee.
        claim_refs:
        - prod-dig
        - prod-prefetch
      datatype_notes: Node data_size and address interpretation configured in DIG;
        no universal width domain asserted.
      limitations:
      - This cannot substitute for an architectural load executor or CPU CAS.
      realization:
        kind: documented_sequence
        description: Hardware follows software DIG edges over multiple nonbinding
          prefetch requests; this is a prefetch algorithm, not a demand-gather instruction.
        claim_refs:
        - prod-dig
        - prod-prefetch
    requirement_status: not_discharged_by_retrieval
    requirements:
    - id: prod-description
      description: Register valid nodes, bounds, sizes, traversal edges and trigger
        edges for the actual workload.
      scope: DIG and each participating array
      claim_refs:
      - prod-dig
      verification: required
    - id: prod-context
      description: Preserve the correct per-thread prefetcher context; establish trigger
        partitioning for parallel use.
      scope: Private per-core prefetcher and context switches
      claim_refs:
      - prod-prefetch
      verification: required
    design_limitations:
    - No performance ranking against other catalog records.
    - No global ban on CPU writes is imposed on this read-assistance mechanism.
    status: not_covered
    reason: Requested address pattern is not in this record; absence is not a universal
      hardware impossibility claim.
  - design_id: spzip-isca2021-push
    design_revision: ISCA2021-Push
    record_kind: mapping
    operation_id: spzip-destination-prefetch
    operation:
      id: spzip-destination-prefetch
      operation: read
      subtype: prefetch
      execution_role: assist
      address_patterns:
      - indirect
      support: paper_specified
      claim_refs:
      - spzip-cpu-update
      - spzip-fetch
      result:
        form: cache_fill_hint
        old_value: not_applicable
        validity: Not authoritative shared destination data.
        claim_refs:
        - spzip-cpu-update
        - spzip-fetch
      ordering:
        scope: Shared destination vertex data in Push
        description: CPU retains update synchronization.
        claim_refs:
        - spzip-cpu-update
        - spzip-fetch
      completion:
        event: Prefetch issuance/fill; no task update-completion result.
        visibility: Coherent cache assistance; CPU performs required atomic access.
        claim_refs:
        - spzip-cpu-update
        - spzip-fetch
      datatype_notes: No universal datatype contract asserted.
      limitations: []
      realization:
        kind: mapping_role
        description: Only the shared destination-vertex data role in the cited Push
          mapping; not a generic substitute for every indirect stream.
        claim_refs:
        - spzip-cpu-update
        - spzip-fetch
    requirement_status: not_discharged_by_retrieval
    requirements:
    - id: spzip-layout
      description: Provide DCL contexts and a compatible data layout/compression format.
      scope: Mapped traversal streams and queues
      claim_refs:
      - spzip-fetch
      verification: required
    - id: spzip-phases
      description: Respect queue synchronization and producer/consumer phases for
        read/write streams.
      scope: Mapped mutable streams, frontier and bins
      claim_refs:
      - spzip-cpu-update
      verification: required
    - id: spzip-destinations
      description: Keep authoritative shared destination atomic accesses on CPU in
        this mapping.
      scope: Push destination vertex array only
      claim_refs:
      - spzip-cpu-update
      verification: required
    design_limitations:
    - SpZip is ISCA 2021 despite the old cached filename saying MICRO.
    - Compressor/memory-queue writes are real but outside the selected Push destination-update
      mapping.
    - No fabricated internal ports or whole-design CPU-only rule.
    status: not_covered
    reason: Requested address pattern is not in this record; absence is not a universal
      hardware impossibility claim.
