review_questions:
- id: placement
  owner: Peter
  question: Confirm the matching source statements, region, phase and allowable replacement
    scope. Manual bindings are proposals; profiling placement is not confirmed.
- id: abi
  owner: Peter/Eric
  question: Specify exact operands, index arithmetic, masks/produced lengths, concrete
    types, invocation and completion API for each chosen operation or sequence.
- id: legality
  owner: Peter/Eric
  question: Discharge ownership, numeric domains, mutable-load freshness, ordering,
    repeated-target/concurrency and result validity requirements. Preserve CAS success
    and queue side effects.
- id: mechanisms
  owner: Eric
  question: Add located internal buffering/coalescing/reordering/issue/dependency/completion
    details and conditions limiting performance.
- id: composition
  owner: Josh/Eric
  question: Establish whether related requests can share one legal mapping; the workload
    group and interface view do not prove combined execution.
- id: implementation
  owner: Yan-Ru
  question: After Peter's spec is agreed, choose or synthesize an implementation and
    verify the rewritten kernel against the frozen correctness oracle.
