hardware_hypotheses:
- field: indirect_access_distances.VertexOffsets.hardware_implication
  text: Average stride (~75 KB) significantly exceeds L1 data cache capacity (32-48
    KB). Sequential frontier processing results in low L1 hit rate without  frontier
    sorting or a Decoupled Access-Execute (DAE) prefetch queue.
  use: hypothesis_not_constraint
- field: indirect_access_distances.parent.hardware_implication
  text: Average stride (~28 KB) causes severe L1 cache thrashing (only 6.8% hits the
    same cache line). However, 63.9% of consecutive accesses fall within the same
    4KB page, indicating that TLB misses are moderate, but cache line fill buffers
    are overwhelmed. A hardware coalescing/reordering buffer (MSHR/binning buffer)
    is mandatory.
  use: hypothesis_not_constraint
excluded_from_selection:
- field: indirect_access_distances.VertexOffsets.statistics.spatial_locality_distribution
  reported_value:
    within_same_64B_cacheline: 6.32%
    within_same_4KB_page: 51.23%
    cross_page_jump: 48.77%
  reason: A distance threshold does not establish same cache-line/page membership
    or cache-hit rate. Excluded from selection rules.
- field: indirect_access_distances.parent.statistics.spatial_locality_distribution
