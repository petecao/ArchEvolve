  - id: bfs-td-parent-read
    location:
      file: benchmarks/gapbs/src/bfs.cc
      start_line: 243
      end_line: 243
    code: NodeID curr_val = parent[v];
    operation: read
    access_expression: parent[v]
    data_type: NodeID = int32_t
    array_element_bits: 32
    related_statement_ids:
    - bfs-td-neighbor
