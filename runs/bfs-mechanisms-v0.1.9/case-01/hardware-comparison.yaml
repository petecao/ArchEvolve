      description: Queue-backed asynchronous fetches may hide long memory latency
        when useful runahead and concurrent requests exceed producer/consumer communication
        costs.
      workload_conditions:
      - Stable source arrays and a legal producer/consumer split
      - Enough independent requests and queue space for runahead
      - Useful lookahead and compatible pointer/index/queue formats
      limiting_factors:
