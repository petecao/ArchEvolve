        statement: Fill advances my_i in original order only after success or a masked
          element; waits for condition/index element finish (4-byte accesses), reads
          uint32 index, forms base+word_size*idx, checks declared virtual range, aligns
          to block_size, translates aligned address, and stores word-index offset
          (vaddr-block_vaddr)/word_size. Masked ILD uses setFakeData, not an actual
          memory request; its exact value semantics are not established here.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c10:
        source_refs:
        - dx100-port
        locator: 'dx100-port: 31–178 sendPacket; 562–581 recvTimingResp'
        statement: New Port packet snoops synchronously at packet creation unless
          global or per-instruction force-cache is set; isBlockCached selects LLC
          versus direct memory. Address-keyed outstanding packet map coalesces compatible
          reads across units with waiter unit IDs and response fanout; same-unit duplicate
          outstanding reads are rejected. This is separate from within-unit word-list
          coalescing. Write forwarding/replacement exists under same-unit assertions
          and is outside required-gather scope.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c11:
        source_refs:
        - dx100-indirect
        - dx100-tables
        - dx100-maa
        - dx100-if
        locator: 'dx100-indirect: 330–398 checks/latency; 725–809 Request/Response;
          1158–1165 ILD receive; dx100-tables: 170–217 OffsetTable; 330–336 row all
          received; 472–495 slice recv; dx100-maa: 605–621 finishInstructionCompute;
          dx100-if: 303–336 finishInstructionCompute'
        statement: ILD completion needs all queued per-unit packets sent, all expected
          line responses received and modeled scratchpad/table latencies elapsed,
          with source tiles ready and histories empty. Responses invalidate OffsetTable
          entries and line slots; a row record becomes reusable only after all its
          lines return, resetting cursor/sent/valid. Final check_reset verifies table
          state; Decode resets for next instruction. MAA publishes destination Finished/Ready
          and IF clears instruction valid and updates dependent source status. Local
          completion is not proof of systemwide coherence, fences or liveness.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c12:
        source_refs:
        - dx100-config
        - dx100-indirect
        locator: 'dx100-config: 13–39 parameters; dx100-indirect: 113–186 allocate;
          243–329 config selection'
        statement: 'Public defaults: tile 16384 elements; 64 row records/slice; 8
          line slots/subslice-row; 32 initial slices; row-table latency 1 cycle; reorder
          enabled (no_reorder false); reconfigure false; force-cache false. Merged-bank
          configurations trade row-record totals against line slots per record. Optional
          enabled reconfiguration caches choice by base address and selects using
          previously observed unique row count; it is disabled by default and not
          invented adaptive intelligence. Config-cache replacement implementation
          is not assumed to be correct LRU.'
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c13:
        source_refs:
        - dx100-if
        locator: 'dx100-if: 185–231 pushInstruction; 250–300 getReady'
        statement: IF rejects admission on instruction-file full, destination tile
          conflicts with existing sources/destinations, and specified same-range read/write
          conflicts within maa_id; getReady begins scan at rand() offset, permits
          source Service/Finished with element-level checks downstream and optional
          region permit for multiple units. These local tests do not establish all
          writers/aliases or global ordering.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c3:
        source_refs:
        - dx100-maa
        - dx100-indirect
        locator: 'dx100-maa: 257–337 addRamulator/map_addr; dx100-indirect: 113–241
          allocate/getRowTableIdx/getGrowAddr'
        statement: MAA obtains mapping geometry from Ramulator2; map_addr discards
          transaction offset bits, extracts channel bits, then column bits, then levels
          1 through row (rank, bank-group, bank, row in this organization). Slice
          index is mixed-radix modulo CH/RA/BG/BA slice organization; grow key retains
          quotient BG/BA plus row for merged-bank configurations. Physical mapping
          is configuration-dependent; no fixed bit positions asserted.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c4:
        source_refs:
        - dx100-tables-header
        - dx100-tables
        - dx100-port
        locator: 'dx100-tables-header: 44–169 OffsetTable/RowTableEntry/RowTableSlice;
          dx100-tables: 142–194 OffsetTable; 253–281 RowTableEntry::insert; dx100-port:
          102–147 sendPacket'
        statement: RowTableSlice has valid/sent row records; each RowTableEntry stores
          physical aligned line addr and first_itr/last_itr plus valid bits and send
          cursor. OffsetTable is tile-sized indexed by original iteration, with wid
          and next_itr. Code appends a forward list, whereas paper describes a backward
          Previous i list with a tail pointer. Code has no per-column H field; cache
          decision is in Port.cc.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c5:
        source_refs:
        - dx100-tables
        locator: 'dx100-tables: 347–399 RowTableSlice::insert; 253–281 RowTableEntry::insert'
        statement: Insertion first matches an unsent row+line, then tries another
          unsent record with same grow key, then allocates first free row record.
          When one row record exhausts its line slots another record may represent
          the same DRAM row. Only absence of a usable/free row record causes insert=false.
          Matching line appends another original-element association without another
          line slot.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c6:
        source_refs:
        - dx100-indirect
        - dx100-tables
        locator: 'dx100-indirect: 188–210 slice order; 621–724 Fill/Build; dx100-tables:
          433–470 find_next_grow_addr/get_send_grow_rowid/get_entry_send'
        statement: With reorder enabled, Fill enters Build on final fill or insertion
          failure; waits for producer element/tile readiness do not by themselves
          trigger Build. Build walks unique slice order constructed by bank outermost,
          bank-group, rank, channel innermost; repeatedly selects at most one line
          per active slice per pass until every slice exhausted. Slice selects first
          valid unsent record from cursor, emits line slots in allocated-slot order,
          then scans other records of same grow before another grow. No address sort
          or DRAM-open-row feedback drives selection. get_entry_send drain argument
          is unused.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c7:
        source_refs:
        - dx100-indirect
        - dx100-tables
        locator: 'dx100-indirect: 506–514 failed insert; 725–764 Request; 1166–1173
          recvData; dx100-tables: 347–399 insert; 472–500 recv/is_full'
        statement: On failure my_i stays at failed element. Build generates currently
          admitted batch, marks exhausted row records sent; Request can continue fill
          as responses free records, but sent records cannot absorb additions. Request
          waits for all per-unit packets sent and cumulative received==expected, then
          returns Fill if fill not final, otherwise Response. Opportunistic fill flags
          in Request are local outputs not promoted to my_fill_finished; finalization
          is re-evaluated via Fill. Full-to-nonfull change of failed slice schedules
          execution. This is partial-batch progress, not proof of starvation freedom.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c8:
        source_refs:
        - dx100-indirect
        - dx100-tables
        locator: 'dx100-indirect: 868–927 recvData; dx100-tables: 170–194 OffsetTable::get_entry_recv;
          313–336 RowTableEntry::recv; 472–498 RowTableSlice::recv'
        statement: Receive decodes physical line back to slice/grow, matches valid
          row and (when reorder enabled) sent row, consumes line association list,
          sorts returned entries by itr, copies response bytes and writes each ILD
          destination itr using wid. Duplicate words fan out to all recorded itr values.
          This sort restores within-response association order; it does not sort outgoing
          requests or impose global response order.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dx-internal-c9:
        source_refs:
        - dx100-port
        - dx100-maa-header
        - dx100-cache-port
        - dx100-memory-port
        locator: 'dx100-port: 180–279 schedules; 301–560 send loops; dx100-maa-header:
          655–695 OutstandingPacket/CompareByTick; dx100-cache-port: 84–133 retry/send/capacity;
          dx100-memory-port: 80–92 retry/send'
        statement: Port queues are multisets compared only by eligibility tick, grouped
          by memory channel or cache bus. Memory sends eligible writes before reads
          per channel; cache does indirect writes, indirect reads, stream writes,
          stream reads, then stream misses only if indirect memory queues empty. A
          failed send blocks that channel/bus until retry/capacity release; unsent
          requests remain queued. Generated slice order is not a proof of final DRAM
          command order or fairness.
        evidence_kind: code_inspection
        limitations:
        - Required-gather (ILD) mechanism scope; does not extend existing operation
          contracts, infer physical interfaces, or establish fairness, global coherence
          or performance.
        - Public e4fc4af model only; static inspection is not simulator execution
          or hardware validation.
      dxc-bfs-composition:
        source_refs:
        - dx100-bfs
        - dx100-api
        - dx100-range
        - dx100-indirect
        locator: bfs.cc L146–183 and L201–220; MAA_gem5.hpp L270–383; RangeFuser.cc
          L186–239; IndirectAccess.cc L491–527 and L898–924
        statement: TDStepMAA composes frontier loads, gathered bounds, range generation
          and dependent neighbor/parent gathers. Its accelerated parent-update sequence
          is enclosed in an OpenMP critical region and uses masked store with old
          results; a separate small-frontier fallback uses CPU CAS.
        evidence_kind: code_inspection
        limitations:
        - This is a source example of instruction composition, not an equivalence
          proof or a supplied mapping for the received profiles.
        - Do not relabel the masked store as engine CAS or silently transfer its synchronization
          to arbitrary callers.
      dxc-byte-offset-domain:
        source_refs:
        - dx100-indirect-header
        - dx100-indirect
        locator: IndirectAccess.hh L113–116; IndirectAccess.cc L491–495
        statement: my_word_size is int and idx is uint32_t. On the examined ABI with
          32-bit int and uint32_t as unsigned int, their product is 32-bit unsigned
          before addition to the wider base address. A 32-bit index representation
          therefore does not imply the full uint32 index domain produces the intended
          byte offset.
        evidence_kind: research_inference
        limitations:
        - Source-expression inference under the stated ABI, supported by an isolated
          C++ expression example; no gem5 or accelerator execution was performed.
        - 'Require word_size * index to be representable before base addition: for
          positive 4/8-byte elements on this ABI, index must be at most floor((2^32-1)/word_size),
          plus normal base/range/alias obligations.'
        - This is an unresolved mapping limitation, not a runtime-validated hardware
          bug or proposed code fix.
        - The range check applies after address computation; it does not by itself
          prove that a wrapped product still denotes the intended element.
      dxc-completion:
        source_refs:
        - dx100-port
        - dx100-indirect
        - dx100-maa
        - dx100-api
        - dx100-cpuport
        - dx100-spd-code
        locator: Port.cc L313–328 and L387–402; IndirectAccess.cc L742–791 and L843–866;
          MAA.cc L605–623; MAA_gem5.hpp L98–101; CpuSidePort.cc L295–315; SPD.cc L120–138;
          MAA.cc L652–676
        statement: No-response write acceptance/replacement feeds write accounting.
          Pending packet counts, response counts and modeled latency gate finish;
          finishInstructionCompute updates tile readiness. wait_ready performs a mapped
          load held until its ready counter clears, then mfence.
        evidence_kind: code_inspection
        limitations:
        - Accounting callbacks are not global visibility acknowledgements. Direct
          Ramulator2 backing mutation is separately scoped in dxc-direct-backing.
        - The held status-read path is established; end-to-end CPU/compiler/coherence
          sequencing and safe reuse remain separate obligations.
      dxc-config:
        source_refs:
        - dx100-config
        - dx100-spd
        - dx100-spd-code
        - dx100-api
        locator: MAA.py L13–25; SPD.hh L30–34 and L93–94; SPD.cc L188–197; MAA_gem5.hpp
          L102–107
        statement: The pinned SimObject declares 16384 elements per tile, 64 row-table
          rows per slice, 8 entries per subslice row, 128 request-table addresses
          and 16 entries per address; booleans permit no_reorder and force_cache_access.
          Configuration capacity is separate from uint16 tile-size storage, getSize/setSize
          arguments, and the API size read.
        evidence_kind: code_inspection
        limitations:
        - Defaults are not the effective configuration of every run; declaration alone
          does not establish a supported tuning domain.
        - An Unsigned configuration declaration does not establish arbitrary legal
          tile capacities; produced sizes must be representable in the independent
          bookkeeping paths.
      dxc-float-order:
        source_refs:
        - dx100-indirect
        locator: IndirectAccess.cc L975–984, L1019–1029, L1071–1081 and L1116–1126
        statement: The floating MIN/MAX comparison-and-select branches choose the
          incoming operand when the comparison is false. Operand order can therefore
          affect NaN and signed-zero results, so operator names alone do not prove
          bitwise commutative reductions.
        evidence_kind: research_inference
        limitations:
        - Inference from the inspected C++ expressions; no hardware execution or language-wide
          numerical contract is claimed.
        - Finite addition also requires an application-appropriate reordering tolerance.
      dxc-gather:
        source_refs:
        - dx100-api
        - dx100-indirect
        locator: MAA_gem5.hpp L270–287; IndirectAccess.cc L491–527 and L898–924
        statement: Indirect load API supplies array base, index tile, result tile
          and optional mask. Execution reads uint32 indices, calculates base + word_size
          * index, range-checks addresses and writes response words into original
          iteration slots.
        evidence_kind: code_inspection
        limitations:
        - 'Element width and index width are different: 64-bit payloads do not establish
          64-bit indices.'
      dxc-local-order:
        source_refs:
        - dx100-tables
        - dx100-indirect
        - dx100-port
        locator: Tables.cc L156–184; IndirectAccess.cc L898–1165; Port.cc L29–66
        statement: Offset entries append to a linked list and are consumed in that
          list order against a mutable line copy. Same-unit/same-MAA pending writeback
          data can be forwarded to a subsequent exclusive read, and pending write
          payloads can be replaced.
        evidence_kind: code_inspection
        limitations:
        - Scope is a collected response group and the specific pending same-line path.
          Not a global duplicate-index or inter-core order proof.
      dxc-mask:
        source_refs:
        - dx100-indirect
        - dx100-spd
        - dx100-stream
        locator: IndirectAccess.cc L491–527; SPD.hh L73–78; StreamAccess.cc L242–280
        statement: An inactive condition bypasses target access. setFakeData marks
          element completion without changing its stored payload; a ready/finished
          masked slot is not a valid newly returned value.
        evidence_kind: code_inspection
        limitations: []
      dxc-old:
        source_refs:
        - dx100-api
        - dx100-indirect
        locator: MAA_gem5.hpp L289–362; IndirectAccess.cc L898–1165
        statement: Scalar/vector indirect stores and RMW APIs accept an optional destination
          tile. recvData copies the current word to that tile before assignment or
          arithmetic; RMW execution has ADD/MIN/MAX branches for uint32, int32, float,
          uint64, int64 and double.
        evidence_kind: code_inspection
        limitations:
        - No CAS comparison-and-update branch exists in the inspected indirect operation
          path.
        - No independent runtime correctness or CPU-interoperable atomicity is established.
        - Floating NaNs, signed zero, overflow and reordering require explicit workload
          numerical contracts.
      dxc-payload-types:
        source_refs:
        - dx100-api
        - dx100-indirect
        - dx100-stream
        locator: MAA_gem5.hpp L164–172 and L232–362; IndirectAccess.cc L491–527 and
          L898–1150; StreamAccess.cc L139–161 and L394–415
        statement: API get_data_type maps uint32_t, int32_t, float, uint64_t, int64_t
          and double. Read/store execution moves 32/64-bit words; RMW has six corresponding
          typed branches. Indirect index and condition reads remain uint32.
        evidence_kind: code_inspection
        limitations:
        - This supports type encodings and inspected execution paths, not a certified
          numerical or compiler ABI contract.
        - A supported 64-bit payload does not widen index, mask, range or continuation
          operands.
      dxc-range:
        source_refs:
        - dx100-api
        - dx100-range
        locator: MAA_gem5.hpp L364–383; RangeFuser.cc L86–94, L159–239
        statement: Range execution reads uint32 lower/upper bounds and mask, uses
          signed int continuation/stride registers, emits outer and inner indices
          while j < upper, and resumes after filling a finite tile.
        evidence_kind: code_inspection
        limitations:
        - The API template does not widen the implementation range-bound path.
        - Callers must establish positive stride, representable continuation values,
          matching tile lengths and bounded output consumption.
      dxc-ready-response:
        source_refs:
        - dx100-cpuport
        - dx100-maa
        - dx100-spd-code
        - dx100-api
        locator: CpuSidePort.cc L295–315; MAA.cc L652–676; SPD.cc L120–138; MAA_gem5.hpp
          L98–101
        statement: The artifact ready-range read returns constant 1 only when the
          tile-ready counter is zero; otherwise the response is retained. setTileReady
          later releases retained responses. The API performs one mapped read followed
          by mfence.
        evidence_kind: code_inspection
        limitations:
        - Core-0 status interface in this inspected path; no instruction generation
          tag is returned.
        - This is a held-read implementation, distinct from the paper polling description.
        - This local status-response chain does not prove the entire CPU/compiler/cache
          visibility composition.
      dxc-region:
        source_refs:
        - dx100-if
        - dx100-invalidator
        locator: IF.cc L185–219 and L280–296; Invalidator.cc L133–195 and L249–264
        statement: Issue checks conflicting accesses to the same region within an
          MAA ID; multi-MAA admission consults region ownership states and modeled
          transitions.
        evidence_kind: code_inspection
        limitations:
        - Declared-region checks do not prove coverage of physical aliases, arbitrary
          overlapping registrations or CPU atomics.
      dxc-reuse-scope:
        source_refs:
        - dx100-maa
        - dx100-spd
        - dx100-spd-code
        - dx100-if
        locator: MAA.cc L556–582 and L605–623; SPD.hh L30–34; SPD.cc L120–138; IF.cc
          L193–220
        statement: Dispatch/completion update ready counts for dst1/dst2/src1/src2
          tile operands. condSpdID participates in scoreboard conflicts but is absent
          from those ready-count updates; ready is equality to zero in uint8 storage.
        evidence_kind: code_inspection
        limitations:
        - A condition-only tile wait is not established as a safe host reuse barrier.
        - 'No reachable counter-overflow defect is alleged: actual instruction admission
          and dependency bounds must be checked.'
        disposition: research_only_unresolved_mapping_obligation
      dxc-stream:
        source_refs:
        - dx100-api
        - dx100-stream
        locator: MAA_gem5.hpp L232–249; StreamAccess.cc L139–170, L222–280, L321–343
          and L394–403
        statement: Stream load uses min/max/stride registers and optional condition
          tile. Execution emits bounded strided accesses and writes fetched words
          to result slots; false conditions use setFakeData.
        evidence_kind: code_inspection
        limitations:
        - Nonpositive strides and overflow are not validated by this study.
