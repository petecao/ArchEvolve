- design_id: maple-isca2022
  revision: ISCA2022-paper+public-742a22d-inspection
  record_kind: design_version
  summary: NoC-connected MMIO engine provides asynchronous pointer/loop fetches into
    ordered queues, or speculative LLC hints. Pipelining and runahead hide latency;
    CPU performs computation and updates.
  interface:
    software_supplies: Queue identities and lifecycle/binding, virtual pointers for
      individual fetches, or configured A/B bases plus begin/end bounds for LIMA.
      Software establishes producer/consumer schedule, stable arrays and memory route.
    invocation: User-mode MMIO stores issue produces/configuration and MMIO loads
      consume queue values, using ordinary core load/store instructions. INIT, OPEN/CLOSE,
      PRODUCE_PTR/CONSUME and LIMA_PRODUCE/LIMA are paper API names, not generated
      C declarations.
    outputs: FIFO-delivered fetched values for queue mode, or nonbinding shared-LLC
      fills for speculative prefetch mode. CPU remains responsible for computation
      and updates.
    claim_refs:
    - maple-api
    - maple-queue-order
    - maple-acknowledgement
    - maple-stable-data
  conditionally_matched_read_requests: []
  assisted_read_requests:
  - access-01-read
  - access-02-read
  - access-03-read
  - access-04-read
  read_requests_needing_evidence:
  - access-01-read
  - access-02-read
  - access-03-read
  - access-04-read
  queries:
  - request_id: access-01-read
    workload_request:
      id: access-01-read
      access_id: access-01
      array: queue.shared
      purpose: read
      operation: read
      subtype: stream_load
      address_pattern: sequential
      payload_type: int32
      index_width_bits: null
      require_old_value: false
      mapping_basis: Reported sequential stream; actual bounds/stride and source binding
        remain requirements.
      mapping_status: proposed_from_reported_pattern
      missing_workload_evidence: []
      statement_ids:
      - bfs-td-frontier
      source_locations:
      - file: benchmarks/gapbs/src/bfs.cc
        start_line: 240
        end_line: 240
      statement_binding_status: manual_source_proposal
      mutable_target: false
    catalog_id: archevolve-hardware
    revision: 0.1.9
    query:
      operation: read
      subtype: stream_load
      address_pattern: sequential
      require_old_value: false
      execution_role: null
      design_id: maple-isca2022
      payload_type: int32
      index_width_bits: null
    matches:
    - design_id: maple-isca2022
      design_revision: ISCA2022-paper+public-742a22d-inspection
      record_kind: design_version
      operation_id: maple-lima-prefetch
      operation:
        id: maple-lima-prefetch
        operation: read
        subtype: prefetch
        execution_role: assist
        address_patterns:
        - indirect
        - ranged_indirect
        - sequential
        support: paper_specified
        claim_refs:
        - maple-api
        - maple-lima
        result:
          form: nonbinding_LLC_fill_hint
          old_value: not_applicable
          validity: CPU demand loads obtain the program result; a prefetched line
            may be replaced before use.
          claim_refs:
          - maple-api
          - maple-lima
          - maple-stable-data
        ordering:
          scope: Within a configured queue for queue mode; no program-result order
            for LLC hints
          description: LLC hints do not replace demand-load order or CPU update synchronization.
          claim_refs:
          - maple-queue-order
          - maple-stable-data
        completion:
          event: Prefetch command/fill has no authoritative program-result completion;
            demand accesses remain on the core.
          visibility: Shared-cache assistance only; CPU demand accesses determine
            program values.
          claim_refs:
          - maple-acknowledgement
          - maple-stable-data
        datatype_notes: Paper discusses 32-bit evaluation words and a RISCV64 system,
          but the complete payload/sign, index/bounds and pointer-width API domains
          are not established.
        type_constraints:
          payload_types: []
          index_width_bits: []
          notes: Empty domains are unknown. Do not infer 64-bit indices from the core
            ISA or complete int32/uint32 support from a four-byte evaluation element.
          claim_refs: []
        realization:
          kind: native_primitive
          description: LIMA requests speculative LLC fills for the supplied A[B[i]]
            or A=0 B[i] interval; it does not deliver queue values.
          claim_refs:
          - maple-api
          - maple-lima
        limitations:
        - Concrete API types, queue packing, numeric bounds and memory-route semantics
          need confirmation.
      requirement_status: not_discharged_by_retrieval
      requirements:
      - id: maple-stable-target
        scope: All queue-fetched target arrays and any index data used for address
          generation
        description: Establish stable data and ownership from fetch through consumption;
          a coherent request cannot refresh an already queued value after a CPU write.
        verification: required
        claim_refs:
        - maple-stable-data
      - id: maple-queue-lifecycle
        scope: Per queue and participating software threads
        description: Bind/init/open/close queues exclusively as required and establish
          producer/consumer counts, ordering, storage reuse and a nondeadlocking runahead
          schedule.
        verification: required
        claim_refs:
        - maple-api
        - maple-backpressure
      - id: maple-typed-abi
        scope: Pointers, A/B element formats, bounds, packed queue values and API
          operands
        description: Resolve concrete payload/index/pointer types, element scaling,
          valid ranges, result packing and counts; paper-level operation names are
          not complete C signatures.
        verification: required
        claim_refs:
        - maple-api
        - maple-lima
        - maple-reference-config
      - id: maple-source-binding
        scope: Per BFS statement and ROI
        description: Choose pointer-produce or LIMA mode and demonstrate source operand/interval
          correspondence; supplied bounds do not offload the full queue-to-CSR dependency
          chain.
        verification: required
        claim_refs:
        - maple-api
        - maple-lima
      - id: maple-completion
        scope: Fetch acceptance, queue value readiness, drain and memory observers
        description: Distinguish pointer-produce acknowledgement from available fetched
          data, consuming a value, draining a loop and any required observer barrier.
        verification: required
        claim_refs:
        - maple-acknowledgement
        - maple-queue-order
      - id: maple-platform
        scope: MMIO resource allocation, virtual address translation and memory path
        description: Provide compatible NoC/MMIO integration, driver/MMU/shootdown
          support and chosen coherent LLC or noncoherent memory route.
        verification: required
        claim_refs:
        - maple-translation
        - maple-stable-data
      - id: maple-cpu-updates
        scope: Current BFS parent CAS, parent store and queue append
        description: Retain CPU updates and success-controlled side effects unless
          separate evidence establishes a supported atomic engine and equivalent mapping.
        verification: required
        claim_refs:
        - maple-future-atomics
        - maple-stable-data
      design_limitations:
      - Operation capabilities remain paper-scoped. Supplemental pinned RTL clarifies
        head readiness and dequeue custody; its evaluated-configuration binding and
        full typed API domains remain unknown.
      - No universal numeric speedup, legal queue range or memory-service model is
        inferred.
      - No native CAS or arbitrary nested gather support inferred from extensibility.
      - Queue scratchpad is not kept coherent after fetching mutable data.
      missing_capability_evidence:
      - payload_types
      status: needs_evidence
