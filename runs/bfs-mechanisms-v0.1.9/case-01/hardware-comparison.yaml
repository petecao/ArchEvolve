designs:
- design_id: dx100-artifact-e4fc4af
  revision: e4fc4afdf894f295442cef3604667a469fab8e62
  record_kind: design_version
  summary: Pinned gem5/API implementation with observed reads, masks, range continuation
    and optional pre-update result tiles.
  interface:
    software_supplies: Memory-mapped instruction stream, bases, typed scalar/vector
      tiles, optional mask and old-value destination. Range continuation registers
      and lower/upper bound tiles for range composition.
    invocation: Pinned MAA_gem5.hpp calls encode instructions and issue fences; wait_ready
      is a held mapped status read followed by mfence in the inspected core-0 interface.
    outputs: Input-associated fetched/old values in scratchpad tiles; range indices;
      memory writes.
    claim_refs:
    - dxc-gather
    - dxc-stream
    - dxc-range
    - dxc-old
    - dxc-completion
    - dxc-ready-response
  conditionally_matched_read_requests:
  - access-01-read
  - access-02-read
  - access-03-read
  - access-04-read
  assisted_read_requests: []
  read_requests_needing_evidence: []
  queries:
  - request_id: access-01-read
    workload_request:
      id: access-01-read
      access_id: access-01
      array: queue.shared
      purpose: read
      operation: read
      subtype: stream_load
      address_pattern: sequential
      payload_type: int32
      index_width_bits: null
      require_old_value: false
      mapping_basis: Reported sequential stream; actual bounds/stride and source binding
        remain requirements.
      mapping_status: proposed_from_reported_pattern
      missing_workload_evidence: []
      statement_ids:
      - bfs-td-frontier
      source_locations:
      - file: benchmarks/gapbs/src/bfs.cc
        start_line: 240
        end_line: 240
      statement_binding_status: manual_source_proposal
      mutable_target: false
    catalog_id: archevolve-hardware
    revision: 0.1.9
    query:
      operation: read
      subtype: stream_load
      address_pattern: sequential
      require_old_value: false
      execution_role: null
      design_id: dx100-artifact-e4fc4af
      payload_type: int32
      index_width_bits: null
    matches:
    - design_id: dx100-artifact-e4fc4af
      design_revision: e4fc4afdf894f295442cef3604667a469fab8e62
      record_kind: design_version
      operation_id: dxc-stream_load
      operation:
        id: dxc-stream_load
        operation: read
        subtype: stream_load
        execution_role: execute
        address_patterns:
        - sequential
        - constant_stride
        support: code_observed
        claim_refs:
        - dxc-stream
        - dxc-mask
        result:
          form: scratchpad_tile
          old_value: not_applicable
          validity: Only active lanes below produced tile size have fresh payloads;
            masked finished slots retain prior storage.
          claim_refs:
          - dxc-stream
          - dxc-mask
        ordering:
          scope: stream instruction and result-slot association
          description: Page/line requests may overlap; response words are placed in
            iteration-indexed destination slots. Indirect duplicate-list behavior
            is not claimed for this read operation.
          claim_refs:
          - dxc-stream
          - dxc-region
        completion:
          event: Stream Response/Finish path calls finishInstructionCompute after
            its own request and latency checks; ready read responds when counter clears.
          visibility: Scratchpad payload is written before tile ready; end-to-end
            CPU read visibility still requires integration proof.
          claim_refs:
          - dxc-stream
          - dxc-ready-response
        datatype_notes: 32/64-bit payload paths; indirect indices are uint32; stream
          min/max/stride use int.
        limitations: []
        realization:
          kind: native_primitive
          description: STREAM_LD implementation consumes min/max/stride registers
            and optional mask.
          claim_refs:
          - dxc-stream
          - dxc-mask
        type_constraints:
          payload_types:
          - uint32
          - int32
          - float32
          - uint64
          - int64
          - float64
          index_width_bits: []
          claim_refs:
          - dxc-payload-types
          - dxc-stream
          notes: Observed API and execution type domain only. Index width is 32 for
            indirect operations, independent of payload width. Conditions read uint32;
            stream min/max/stride use int. Numerical equivalence, layout, signedness/range
            safety and tile allocation still need proof. Empty index_width_bits means
            not applicable to this direct stream primitive, not arbitrary-width indirect
            indexing.
      requirement_status: not_discharged_by_retrieval
      requirements:
      - id: dxc-region-binding
        description: Bind actual bases, registered regions, aliases and permitted
          writers before mapping.
        scope: Addresses touched by selected operations; not all CPU memory
        claim_refs:
        - dxc-gather
        - dxc-region
        - dxc-completion
        verification: required
      - id: dxc-widths
        description: Prove payload, uint32 index and range bounds, signed continuation/stride
          and sizes fit without truncation.
        scope: Each mapped input tile and range composition
        claim_refs:
        - dxc-gather
        - dxc-range
        - dxc-stream
        verification: required
      - id: dxc-validity
        description: Propagate masks and produced sizes; never consume inactive old-value
          slots as fresh values.
        scope: Output lanes of masked reads/stores/RMW
        claim_refs:
        - dxc-mask
        - dxc-old
        verification: required
      - id: dxc-observer
        description: Establish required observer visibility and safe tile/region reuse
          separately from instruction finish.
        scope: CPU consumption, memory updates and storage reuse
        claim_refs:
        - dxc-completion
        verification: required
      - id: dxc-numerical
        description: Check duplicates and numerical equivalence for the requested
          result contract.
        scope: RMW operator, datatype and returned old values
        claim_refs:
        - dxc-old
        - dxc-local-order
        - dxc-float-order
        verification: required
      - id: dxc-reuse
        description: Before host overwrites tiles, establish which live operands consume
          them and a completion barrier covering those consumers; condition-only ready
          state is insufficient evidence.
        scope: Tile reuse, especially masks and aliased/wide tile storage
        claim_refs:
        - dxc-reuse-scope
        - dxc-ready-response
        verification: required
      - id: dxc-old-destination
        description: When old values are required, allocate and supply the optional
          destination tile and preserve it until all active results are consumed.
        scope: Scalar/vector stores and RMW operations requesting old values
        claim_refs:
        - dxc-old
        - dxc-mask
        verification: required
      - id: dxc-byte-offset
        description: Prove byte-offset product and base-address addition representability
          for every active indirect index. On the examined 32-bit int/uint32 ABI require
          word_size * index < 2^32 before adding the base; 32-bit index encoding alone
          is insufficient.
        scope: All selected indirect loads, scalar/vector stores and RMW, including
          generated indices in ranged/chained sequences
        claim_refs:
        - dxc-byte-offset-domain
        - dxc-gather
        verification: required
      - id: dxc-capacity
        description: Bind effective simulator/API tile configuration and prove every
          produced tile size fits its bookkeeping, alongside index/offset arithmetic
          and storage allocation. Do not infer a broad legal capacity range from Unsigned
          knobs.
        scope: Configured tile capacity, produced lengths, uint16 size bookkeeping
          and callers consuming those lengths
        claim_refs:
        - dxc-config
        - dxc-range
        verification: required
      design_limitations:
      - Static code observation, not a runtime test.
      - Do not inherit paper guarantees or private/virtualized extensions into this
        pinned public artifact.
      - Array range width is narrower than a generic 64-bit payload capability.
      missing_capability_evidence: []
      status: conditional_executor
    excluded: []
    ordering: Stable design/operation IDs, not performance rank.
