    operation_id: dxp-ranged-gather
    operation:
      id: dxp-ranged-gather
      operation: read
      subtype: gather
      execution_role: execute
      address_patterns:
      - ranged_indirect
      support: paper_specified
      claim_refs:
      - dxp-read
      - dxp-interface
      result:
        form: scratchpad_tile
        old_value: not_applicable
        validity: Active inputs only.
        claim_refs:
        - dxp-read
        - dxp-interface
      ordering:
        scope: one instruction and legally transformed ROI
        description: Memory requests may reorder; gathered responses populate input-indexed
          scratchpad slots. Update legality restricts conflicting accesses.
        claim_refs:
        - dxp-read
        - dxp-legality
      completion:
        event: Instruction retirement sets tile ready; software waits before consumption.
        visibility: Paper requires wait before scratchpad consumption or accessing
          memory updated by DX100; not independently verified here.
        claim_refs:
        - dxp-interface
      datatype_notes: u32/i32/f32/u64/i64/f64 payloads (§3.1); index/range ABI widths
        not established by this table.
      limitations:
      - Load range bounds, execute RNG to emit index pairs, then ILD consumes the
        inner indices; this is a documented instruction sequence.
      realization:
        kind: documented_sequence
        description: Bound-producing loads, RNG range expansion and ILD; each instruction
          has its own operands and completion.
        claim_refs:
        - dxp-read
        - dxp-interface
      type_constraints:
        payload_types: []
        index_width_bits: []
        claim_refs:
        - dxp-read
        notes: Paper §3.1 lists six ISA payload types. Exact index/range widths are
          unknown in this edition; empty index_width_bits denotes unknown. Composed
          sequence payload domains are left unknown rather than inferred from primitive
          types.
    requirement_status: not_discharged_by_retrieval
    requirements:
    - id: dxp-writers
      description: Establish no core stores to DX100-accessed regions inside the offloaded
        loop and exclusive DX100 writes to indirect arrays during the ROI.
      scope: Only mapped arrays/regions and the offloaded ROI
      claim_refs:
      - dxp-legality
      verification: required
    - id: dxp-dependence
      description: Prove legal loop transformation and permissible reduction/reordering
        behavior.
      scope: Offloaded iterations and duplicate destinations
      claim_refs:
      - dxp-legality
      - dxp-update
      verification: required
    - id: dxp-wait
      description: Insert required waits before CPU consumption and memory accesses
        dependent on DX100 updates.
      scope: CPU/accelerator producer-consumer boundary
      claim_refs:
      - dxp-interface
      verification: required
    - id: dxp-address
      description: Establish huge-page mapping and stable transferred PTEs.
      scope: Registered stream and indirect regions
      claim_refs:
      - dxp-translation
      verification: required
    design_limitations:
    - Paper specification only; no device or simulator validation.
    - Conventional random-base pointer chasing unsupported in §4.1; array-based chained
      indices are distinct.
    missing_capability_evidence:
    - payload_types
    - index_width_bits
    status: needs_evidence
