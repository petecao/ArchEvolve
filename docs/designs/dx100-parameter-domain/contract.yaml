coupling_constraints:
- id: software_hardware_layout
  evidence_status: required
  rule: TILE_SIZE=N; NUM_CORES=C; NUM_TILES=C*T; NUM_SCALAR_REGS=C*G. Match simulator and rebuilt binary; MMIO start
    must match configured memory size.
  source: configs/common/MAAConfig.py:75-108; benchmarks/API/MAA.hpp:15-24; MAA_gem5.hpp:12-25,70-90
- id: payload_and_offsets
  evidence_status: source_derived
  rule: Scratchpad payload=4*C*T*N bytes; scalar payload=4*C*G bytes; size and ready MMIO regions each2*C*T bytes.
    Two data mappings alias the same scratchpad; count payload once. OffsetTable allocation follows N automatically;
    row/request geometry has separate knobs.
  source: src/mem/MAA/SPD.cc:214-229; Tables.cc:139-149; configs/common/MAAConfig.py:81-105
- id: length_width
  evidence_status: necessary_not_sufficient
  rule: Tile sizes are uint16_t in simulator/API. Reject configurations that can produce unrepresentable lengths.
    Larger N requires widening/auditing API, model and callers. This does not validate every N<=65535.
  source: src/mem/MAA/SPD.hh:34; benchmarks/API/MAA_gem5.hpp:23,102-106
- id: operand_id_encoding
  evidence_status: source_derived_necessary
  rule: Instruction tile/register fields occupy8bits and0xff denotes absent. Keep encoded IDs0..254; making all
    global slots addressable implies C*T<=255 and C*G<=255. Larger namespaces require encoder/decoder changes; this
    is not a complete admitted geometry.
  source: benchmarks/API/MAA_gem5.hpp:161-189; src/mem/MAA/CpuSidePort.cc:186-234
- id: wide_values
  evidence_status: source_derived
  rule: 64-bit values consume two adjacent32-bit physical tile/register slots. Reserve both; for wide tiles id+1<num_tiles.
    A universal even-ID rule has not been established.
  source: benchmarks/API/MAA_gem5.hpp:117-145; src/mem/MAA/SPD.hh:47-59
- id: bfs_worker_limits
  evidence_status: pinned_kernel
  rule: Pinned BFS allocates8int32tiles and8int32scalar slots per worker. Require workers<=NUM_CORES and aggregate
    allocations fit C*T/C*G; preserve exclusive lifetimes. The separate five-tile hybrid sketch is a different kernel/mapping.
  source: benchmarks/gapbs/src/bfs.cc:63-86,377-403
- id: core_instance_geometry
  evidence_status: source_guard_and_inference
  rule: C>0,M>0,C%M==0; cores_per_instance=C/M; instruction slots_per_instance=I*C/M. Retain power-of-two C for
    the pinned floor-log2 address decoder/interleaving, with stock API C in{4,8,16}; other core counts require API/routing
    changes and validation.
  source: src/mem/MAA/MAA.cc:30-38,79-89,144-152; benchmarks/API/MAA_gem5.hpp:12-21
- id: row_table_slice_family
  evidence_status: source_derived_topology_coupling
  rule: Let B=channels*ranks*bankgroups*banks and Smin=2*channels*ranks. Bind positive topology dimensions, require
    B/Smin to be an integral power of two for the doubling/halving enumeration; S in{Smin*2^i<=B}. With reconfiguration
    disabled, initial_slices must equal an enumerated S. Preserve bank-factor divisibility guards and slice-index
    coverage.
  source: src/mem/MAA/IndirectAccess.cc:116-121,142-175,203-214
- id: row_table_capacity
  evidence_status: source_derived
  rule: At S slices, subslices=B/S, rows_total=S*R, burst_entries_per_row=E*B/S, nominal total burst entries=R*E*B.
    R,E positive and geometry integral. No source requirement R*E*B=N was established. Reconfiguration keeps this
    nominal capacity constant across its slice family. Simulator allocation of all alternative configurations is
    not physical area to sum blindly.
  source: src/mem/MAA/IndirectAccess.cc:142-164,206-210
- id: request_table_capacity
  evidence_status: required_workload_bound
  rule: 'Request table has Q address slots and W entries/address. Positive Q,W are necessary; bound insertion multiplicity/address:
    exhausting entries for an existing address asserts. Do not assume every table-full case stalls safely or set
    Q*W=N without evidence.'
  source: src/mem/MAA/Tables.cc:17-33,65-101,125-132
- id: ports_lanes_latency
  evidence_status: planning_guard
  rule: Keep port/lane counts positive; ALU latency uses ceil(work/lanes)*lane_latency. Require positive cycles
    in the initial explorer as an explicit modeling policy; zero-cycle behavior and arbitrary counts remain unresolved.
    Total SPD read/write ports scale as per_instance_ports*M.
  source: src/mem/MAA/MAA.cc:83; ALU.cc:25-31,55
- id: area_model_scope
  evidence_status: cost_guard
  rule: Published DX100 area anchor4.061mm2 at28nm with32tiles of16384elements. Existing0.495+3.566*N/16384 proxy
    assumes32tiles; other tile counts/control/ports/tables need additional area characterization. Cost-CLI arithmetic
    bounds do not establish kernel legality or measured area accuracy.
  source: docs/hardware-cost-model.md; docs/cost-rigor-2026-10-15/README.md
unresolved:
- Full legal hardware domains for row/request sizes, ports, lanes, latencies, instruction capacity and instance
  count.
- General tile-size legality beyond the pinned BFS enumeration; a universal tile-size power-of-two requirement is
  not established.
- Physical area/timing effects of table, port, lane and multiplicity changes.
- A jointly target-validated parameter tuple and corresponding API/kernel configuration.
