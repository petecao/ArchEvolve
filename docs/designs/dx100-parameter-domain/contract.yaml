    num_tile_elements:
    - 1024
    - 2048
    - 4096
    - 8192
    - 16384
    - 32768
  freeze_other_parameters_to_reference: true
  required_preflight:
  - Bind actual DRAM topology and validate initial slice membership before accepting reference32.
  - Rebuild each binary with matching TILE_SIZE and record effective config.ini/binary/source hashes.
  - Check BFS correctness, intended path and resource/length/address bounds on each selected configuration.
