# Proposed discussion supplement only. Not an agreed schema, not measurements,
# and not accepted by the current normalizer as a replacement feature input.
format: feature-audit-supplement-draft-0.1
record_kind: unfilled_template
ready_for_estimation: false
binds_feature_report:
  path: null
  sha256: null
source_and_run:
  source_revision: null
  source_file: benchmarks/gapbs/src/bfs.cc
