  unattributed_cost: 0.70
  denominator_scope: "100.0% of TDStep execution cycles in dense complete clique"
  regions:
    - id: frontier_load
      statement_ids: [bfs-td-frontier]
      source_anchor: "bfs.cc:240 (NodeID u = queue.shared[i])"
      baseline_ir_refs: ["%u = load i32, i32* %queue_shared_elem"]
      cost_value: 0.15
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.15
      actor_in_hybrid: CPU
      notes: "Sequential unit-stride read of frontier queue elements."

    - id: row_bound_loads
      statement_ids: [bfs-td-row-bounds]
      source_anchor: "bfs.cc:241 (VertexOffsets[u], VertexOffsets[u+1])"
      baseline_ir_refs: ["%row_start = load i32, i32* %offsets_u", "%row_end = load i32, i32* %offsets_u_next"]
      cost_value: 4.10
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 4.10
      actor_in_hybrid: MAPLE
      notes: >-
        Offloaded to MAPLE pointer FIFOs in hybrid sketch (M1).
        In complete graph K_N, row bounds are strictly equidistant: VertexOffsets[u] = u * (N - 1).
        Unit-stride pattern allows hardware stream prefetchers to achieve 0 miss rate.

    - id: inner_loop_index_control
      statement_ids: [bfs-td-row-bounds]
      source_anchor: "bfs.cc:241 (for int j = VertexOffsets[u]; j < VertexOffsets[u + 1]; j++)"
      baseline_ir_refs: ["%j_next = add i32 %j, 1", "%cmp = icmp slt i32 %j_next, %row_end"]
      cost_value: 6.90
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 6.90
      actor_in_hybrid: DX100
      notes: >-
        Offloaded to DX100 range expansion in hybrid sketch (D2).
        Represents tight inner loop iteration over uniform row width N - 1 = 24,999.
        Separated from row bound loading for discrete accounting.

    - id: neighbor_load
      statement_ids: [bfs-td-neighbor]
      source_anchor: "bfs.cc:242 (NodeID v = g.out_neighbors_[j])"
      baseline_ir_refs: ["%v = load i32, i32* %neighbors_j"]
      cost_value: 44.80
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 44.80
      actor_in_hybrid: DX100
      notes: >-
        Offloaded to DX100 ranged gather in hybrid sketch (D3).
        Dominant streaming throughput component: 624.95M directed edges * 4 bytes = 2.38 GB
        streamed linearly from memory. Saturates memory bus.

    - id: parent_load
      statement_ids: [bfs-td-parent-read]
      source_anchor: "bfs.cc:243 (NodeID curr_val = parent[v])"
      baseline_ir_refs: ["%curr_val = load i32, i32* %parent_v"]
      cost_value: 38.45
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 38.45
      actor_in_hybrid: CPU
      notes: >-
        Retained on host CPU (C1). Because N = 25,000, the parent array is only 100 KB,
        fitting entirely in the 1 MB L2 cache per core. Repeated linear scan exhibits
        near 100% L2 cache hit rate, raising IPC to 2.68.

    - id: parent_CAS
      statement_ids: [bfs-td-parent-cas]
      source_anchor: "bfs.cc:247 (compare_and_swap(parent[v], curr_val, u))"
      baseline_ir_refs: ["cmpxchg i32* %parent_v, i32 %curr_val, i32 %u seq_cst"]
      cost_value: 0.00
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.00
      actor_in_hybrid: CPU
      notes: >-
        Zero CAS executions across Level 2 (which represents 99.996% of edges).
        All parent[v] >= 0 after Level 1; the if (curr_val < 0) condition is uniformly
        false throughout Level 2, completely bypassing the atomic instruction.

    - id: retained_parent_store
      statement_ids: [bfs-td-parent-store]
      source_anchor: "bfs.cc:248 (parent[v] = u)"
      baseline_ir_refs: ["store i32 %u, i32* %parent_v"]
      cost_value: 0.00
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.00
      actor_in_hybrid: CPU
      notes: "Zero stores executed in Level 2; no unvisited nodes remain."

    - id: queue_push_and_flush
      statement_ids: [bfs-td-queue-append]
      source_anchor: "bfs.cc:249, 254 (lqueue.push_back(v); lqueue.flush())"
      baseline_ir_refs: ["call QueueBuffer::push_back", "call QueueBuffer::flush"]
      cost_value: 0.00
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.00
      actor_in_hybrid: CPU
      notes: "Zero queue insertions in Level 2; queue is empty at termination."

    - id: remaining_CPU_work
      statement_ids: []
      source_anchor: "bfs.cc:235-255 (OpenMP loop framing, condition evaluations)"
      baseline_ir_refs: ["omp_loop_dispatch", "condition_tests", "branch_evaluations"]
      cost_value: 4.90
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 4.90
      actor_in_hybrid: CPU
      notes: >-
        Comprises if (curr_val < 0) evaluation (predicts false with 99.99% accuracy),
        OpenMP chunk scheduling, and thread barrier synchronization.

