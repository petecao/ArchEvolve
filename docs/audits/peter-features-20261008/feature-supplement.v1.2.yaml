region_cost_partition:
  status: bound_to_profile_and_source_statements
  coverage: exclusive_full_kernel_accounting
  unattributed_cost: 0.79
  denominator_scope: "100.0% of TDStep execution cycles"
  regions:
    - id: frontier_load
      statement_ids: [bfs-td-frontier]
      source_anchor: "bfs.cc:240 (NodeID u = queue.shared[i])"
      baseline_ir_refs: ["%u = load i32, i32* %queue_shared_elem"]
      cost_value: 0.14
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.14
      actor_in_hybrid: CPU
      notes: "Frontier vertex lookup into active traversal queue."

    - id: row_bound_loads
      statement_ids: [bfs-td-row-bounds]
      source_anchor: "bfs.cc:241 (VertexOffsets[u], VertexOffsets[u+1])"
      baseline_ir_refs: ["%row_start = load i32, i32* %offsets_u", "%row_end = load i32, i32* %offsets_u_next"]
      cost_value: 5.36
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 5.36
      actor_in_hybrid: MAPLE
      notes: >-
        Offloaded to MAPLE pointer FIFOs in hybrid sketch (M1).
        Disassembles to 5.07% for start offset (movslq (%r9,%rdx,4),%rbp)
        and 0.29% for end offset (mov 0x4(%r9,%rax,1),%r10d).

    - id: inner_loop_index_control
      statement_ids: [bfs-td-row-bounds]
      source_anchor: "bfs.cc:241 (for int j = VertexOffsets[u]; j < VertexOffsets[u + 1]; j++)"
      baseline_ir_refs: ["%j_next = add i32 %j, 1", "%cmp = icmp slt i32 %j_next, %row_end"]
      cost_value: 0.29
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.29
      actor_in_hybrid: DX100
      notes: >-
        Offloaded to DX100 range expansion in hybrid sketch (D2).
        Separates row bound loading from range enumeration on line 241
        (add $0x1,%ebx at 0.19%, cmp %r10d,%ebx at 0.10%).

    - id: neighbor_load
      statement_ids: [bfs-td-neighbor]
      source_anchor: "bfs.cc:242 (NodeID v = g.out_neighbors_[j])"
      baseline_ir_refs: ["%v = load i32, i32* %neighbors_j"]
      cost_value: 6.87
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 6.87
      actor_in_hybrid: DX100
      notes: >-
        Offloaded to DX100 ranged gather in hybrid sketch (D3).
        Assembly anchor: movslq (%rax,%rbp,1),%rsi.

    - id: parent_load
      statement_ids: [bfs-td-parent-read]
      source_anchor: "bfs.cc:243 (NodeID curr_val = parent[v])"
      baseline_ir_refs: ["%curr_val = load i32, i32* %parent_v"]
      cost_value: 59.85
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 59.85
      actor_in_hybrid: CPU
      notes: >-
        Retained on host CPU (C1). Dominant application stall bottleneck
        (mov (%rdx),%eax). Stalls on LLC misses when probing unvisited parent entries.

    - id: parent_CAS
      statement_ids: [bfs-td-parent-cas]
      source_anchor: "bfs.cc:247 (compare_and_swap(parent[v], curr_val, u))"
      baseline_ir_refs: ["cmpxchg i32* %parent_v, i32 %curr_val, i32 %u seq_cst"]
      cost_value: 15.88
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 15.88
      actor_in_hybrid: CPU
      notes: >-
        Retained on host CPU (C1). Cache-line bouncing and coherence lock
        stall (lock cmpxchg %r14d,(%rdx)) under concurrent edge discovery.

    - id: retained_parent_store
      statement_ids: [bfs-td-parent-store]
      source_anchor: "bfs.cc:248 (parent[v] = u)"
      baseline_ir_refs: ["store i32 %u, i32* %parent_v"]
      cost_value: 1.18
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 1.18
      actor_in_hybrid: CPU
      notes: "Executed inside CAS success path (mov 0x10(%r12),%rax)."

    - id: queue_push_and_flush
      statement_ids: [bfs-td-queue-append]
      source_anchor: "bfs.cc:249, 254 (lqueue.push_back(v); lqueue.flush())"
      baseline_ir_refs: ["call QueueBuffer::push_back", "call QueueBuffer::flush"]
      cost_value: 0.14
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 0.14
      actor_in_hybrid: CPU
      notes: "Thread-local buffer push and level-boundary reduction into master queue."

    - id: remaining_CPU_work
      statement_ids: []
      source_anchor: "bfs.cc:235-255 (OpenMP loop framing, condition tests, pointer setups)"
      baseline_ir_refs: ["omp_loop_dispatch", "condition_tests", "address_arithmetic"]
      cost_value: 9.50
      cost_unit: percent_of_roi_cycles
      share_pct_of_named_denominator: 9.50
      actor_in_hybrid: CPU
      notes: >-
        Comprises 1.97% curr_val < 0 branch evaluation (jns 5790), 3.96% array pointer
        indirections, 1.76% base register setups, OpenMP chunk iteration dispatch,
        and thread synchronization.

