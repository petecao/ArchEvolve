format: dx100-reference-run-plan-v0.1
workflow_sha256: 0a3a384d9111d0674a82b589d22381ccd208129b71644745a6e285c2af838fec
execute: false
sequence:
- Bind environment/source/build provenance
- Build and pin converter/functional/target artifacts
- Generate and hash each .sg once
- Run functional baseline and functional DX100 on identical graphs
- Resolve target topology/config and verifier exit handling
- Run target baseline and target DX100 separately
- Collect raw evidence and compare frontiers
- Request independent timing review before performance claims
guest_environment:
  OMP_NUM_THREADS: '4'
  OMP_DYNAMIC: 'FALSE'
  OMP_PROC_BIND: 'false'
workloads:
- id: kronecker18-root0
  generator_argv:
  - '{converter}'
  - -g
  - '18'
  - -k
  - '16'
  - -b
  - '{graph}'
  generator_seed: 27491095
  root: 0
  trials: 1
  benchmark_options:
  - -f
  - '{graph}'
  - -r
  - '0'
  - -n
  - '1'
  - -v
  - -l
  - -a
  input_binding: Generate once, hash the serialized .sg, and use the identical file
    in baseline and DX100 runs.
- id: uniform18-root0
  generator_argv:
  - '{converter}'
  - -u
  - '18'
  - -k
  - '16'
  - -b
  - '{graph}'
  generator_seed: 27491095
  root: 0
  trials: 1
  benchmark_options:
  - -f
  - '{graph}'
  - -r
  - '0'
  - -n
  - '1'
  - -v
  - -l
  - -a
  input_binding: Generate once, hash the serialized .sg, and use the identical file
    in baseline and DX100 runs.
target_argv: null
target_argv_status: Pinned Eric launcher templates supplied; actual site paths and
  verification budget remain unbound.
