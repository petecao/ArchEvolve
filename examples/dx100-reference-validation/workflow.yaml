- system.maa.numInst_RANGE
stats_policy: Select one complete ROI stats block explicitly; never silently use the
  final block or divide ticks by 313.
verifier_exit_issue: Both GEM5 kernels call m5_exit before returning to BenchmarkKernel/BFSVerifier.
  Stock benchCheckpoints stops on non-checkpoint exit. A separately reviewed continuation/verification
  method is required for target correctness.
baseline_issue: Stock DOBFS also allocates/initializes MAA before ROI. Use the agreed
  MAA-enabled idle control with zero read/range counters. These calls alone do not
  prove a no-MAA baseline impossible; that alternative requires separate configuration
  and correctness review.
timing_validation: Independent timing/model validation remains outstanding even if
  correctness and intended-path checks pass.
