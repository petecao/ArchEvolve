semantic_scope: Observable contract for the selected source-scoped operations, conditional
  on mapping requirements; not a new ABI or whole-accelerator composition.
software_interface:
  software_supplies: Queue identities and lifecycle/binding, virtual pointers for
    individual fetches, or configured A/B bases plus begin/end bounds for LIMA. Software
    establishes producer/consumer schedule, stable arrays and memory route.
  invocation: User-mode MMIO stores issue produces/configuration and MMIO loads consume
    queue values, using ordinary core load/store instructions. INIT, OPEN/CLOSE, PRODUCE_PTR/CONSUME
    and LIMA_PRODUCE/LIMA are paper API names, not generated C declarations.
  outputs: FIFO-delivered fetched values for queue mode, or nonbinding shared-LLC
    fills for speculative prefetch mode. CPU remains responsible for computation and
    updates.
  claim_refs:
  - maple-api
  - maple-queue-order
  - maple-acknowledgement
  - maple-stable-data
desired_observable_semantics:
- operation_id: maple-lima-prefetch
  operation: read
  subtype: prefetch
  execution_role: assist
  support: paper_specified
  realization:
    kind: native_primitive
    description: LIMA requests speculative LLC fills for the supplied A[B[i]] or A=0
      B[i] interval; it does not deliver queue values.
    claim_refs:
    - maple-api
    - maple-lima
  requests:
  - id: access-01-read
    array: queue.shared
    address_pattern: sequential
    payload_type: int32
    index_width_bits: null
    mutable_target: false
    statement_ids:
    - bfs-td-frontier
  - id: access-02-read
    array: VertexOffsets
    address_pattern: indirect
    payload_type: int32
    index_width_bits: 32
    mutable_target: false
    statement_ids:
    - bfs-td-row-bounds
  - id: access-03-read
    array: g.out_neighbors_
    address_pattern: ranged_indirect
    payload_type: int32
    index_width_bits: 32
    mutable_target: false
    statement_ids:
    - bfs-td-neighbor
  - id: access-04-read
    array: parent
    address_pattern: indirect
    payload_type: int32
    index_width_bits: 32
    mutable_target: true
    statement_ids:
    - bfs-td-parent-read
  result:
    form: nonbinding_LLC_fill_hint
    old_value: not_applicable
    validity: CPU demand loads obtain the program result; a prefetched line may be
      replaced before use.
    claim_refs:
    - maple-api
    - maple-lima
    - maple-stable-data
  ordering:
    scope: Within a configured queue for queue mode; no program-result order for LLC
      hints
    description: LLC hints do not replace demand-load order or CPU update synchronization.
    claim_refs:
    - maple-queue-order
    - maple-stable-data
  completion:
    event: Prefetch command/fill has no authoritative program-result completion; demand
      accesses remain on the core.
    visibility: Shared-cache assistance only; CPU demand accesses determine program
      values.
    claim_refs:
    - maple-acknowledgement
    - maple-stable-data
  type_constraints:
    payload_types: []
    index_width_bits: []
    notes: Empty domains are unknown. Do not infer 64-bit indices from the core ISA
      or complete int32/uint32 support from a four-byte evaluation element.
    claim_refs: []
  missing_capability_evidence:
  - index_width_bits
  - payload_types
  claim_refs:
  - maple-api
  - maple-lima
  limitations:
  - Concrete API types, queue packing, numeric bounds and memory-route semantics need
    confirmation.
