requested_model_observations:
- Logical read count, eligible grouping count and distinct memory request count, with
  exact scope
- Producer readiness, admission stalls, occupancy and independent requests outstanding
- Request issue, transport retry, response arrival, result placement and storage release
  as separate events
- Cache/memory route, service latency/bandwidth and address distribution under the
  actual configuration
- Host submission, waits, consumption and required CPU effect completion costs
