semantic_scope: Observable contract for the selected source-scoped operations, conditional
  on mapping requirements; not a new ABI or whole-accelerator composition.
software_interface:
  software_supplies: Memory-mapped instruction stream, bases, typed scalar/vector
    tiles, optional mask and old-value destination. Range continuation registers and
    lower/upper bound tiles for range composition.
  invocation: Pinned MAA_gem5.hpp calls encode instructions and issue fences; wait_ready
    is a held mapped status read followed by mfence in the inspected core-0 interface.
  outputs: Input-associated fetched/old values in scratchpad tiles; range indices;
    memory writes.
  claim_refs:
  - dxc-gather
  - dxc-stream
  - dxc-range
  - dxc-old
  - dxc-completion
  - dxc-ready-response
