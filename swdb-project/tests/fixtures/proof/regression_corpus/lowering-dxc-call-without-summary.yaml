id: lowering-dxc-call-without-summary
adapter: c_lowering
input:
  source: tests/fixtures/proof/lowering/summaries.cc
  function: swdb_dxc_unit
failure_class: unsupported_construct
construct: call to __dxc_tile_size with no summary
cause: >-
