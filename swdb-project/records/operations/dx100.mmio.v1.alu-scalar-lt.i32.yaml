types:
- int32_t
memory_effects: Compares signed int32 source-tile values to a scalar register and
  writes a Boolean result tile.
masks: Optional condition tile; -1 disables masking.
repeated_indices: Not applicable to application memory.
ordering: Instruction descriptor writes end with mfence; descriptor issue does not
  imply completion. Dependencies use allocated register/tile identities; preserve
  the author BFS critical section for competing parent updates.
completion: Wait on the appropriate completed tile before CPU consumption and obtain
  its actual size; scalar-register access uses get_reg. No unsupported global memory-ordering
  guarantee is implied.
resources:
  tiles: 3
  scalar_registers: 1
  allocation: Counts are the maximum distinct operand slots for this call, including
    optional mask/result slots. Allocate valid nonoverlapping slots; 4-core default
    has 32 32-bit tiles and 32 scalar registers shared across the call sequence.
build:
