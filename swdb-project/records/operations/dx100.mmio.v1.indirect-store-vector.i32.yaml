interface:
  id: dx100-mmio
  version: 1.0-e4fc4af
model:
  id: dx100-gem5
  revision: e4fc4afdf894f295442cef3604667a469fab8e62
backend: dx100-gem5-se
support: source_supported
signature: maa_indirect_store_vector<int32_t>(int32_t *base, int idx_tile, int src_tile,
  int cond_tile=-1, int dst_tile=-1)
types:
- int32_t
memory_effects: Stores source-tile values to masked indirect application-memory locations;
  optional destination tile returns old values before each update.
masks: Optional condition tile; -1 disables masking; masked entries do not access
  application memory.
repeated_indices: Entries for a returned cache line update a shared local buffer sequentially,
  so repeated addresses return successively updated old values in model processing
  order. No global winner order or CPU-atomic CAS semantics are established.
ordering: Instruction descriptor writes end with mfence; descriptor issue does not
  imply completion. Dependencies use allocated register/tile identities; preserve
  the author BFS critical section for competing parent updates.
completion: Wait on the appropriate completed tile before CPU consumption and obtain
  its actual size; scalar-register access uses get_reg. No unsupported global memory-ordering
  guarantee is implied.
resources:
  tiles: 4
  scalar_registers: 0
  allocation: Counts are the maximum distinct operand slots for this call, including
    optional mask/result slots. Allocate valid nonoverlapping slots; 4-core default
    has 32 32-bit tiles and 32 scalar registers shared across the call sequence.
build:
  headers:
  - benchmarks/API/MAA_gem5.hpp
  - benchmarks/API/MAA.hpp
  - gem5/m5ops.h
  defines:
  - GEM5
  - NUM_CORES=4
  - TILE_SIZE=16384 (or matching supported tile size)
  dependencies:
  - x86 m5ops
  - DX100 memory-mapped model at matching revision
  - 16 GB guest memory and matching scratchpad/MMIO map
semantics:
  masked:
    state: supported
    value: true
    basis: code_reading
    description: The API encodes an optional condition tile.
  returns_old_value:
    state: supported
    value: true
    basis: code_reading
    description: IndirectAccess writes the old local-buffer value before updating
      it.
  cpu_atomic:
    state: unknown
    value: null
    basis: unknown
    description: The author BFS retains a CPU critical section; global CPU/accelerator
      atomicity is not established.
  deterministic_duplicate_winner:
    state: unknown
    value: null
    basis: unknown
    description: A globally deterministic repeated-index winner is not specified.
