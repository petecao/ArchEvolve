- strategy: vertex_reordering
  outcome: undetermined
  reasons: []
  unknown_fields: [current_region_semantics]
  check_by_hand:
  - The kernel's result does not depend on vertex IDs, or it is mapped back to the original IDs before
    the correctness check compares it.
  - The input graph is skewed (a few hub vertices hold many edges) and its hubs are not already packed
    together.
  - The reordering cost is paid back over the runs that use the reordered graph.
  benefits_when:
  - condition: The graph's degree distribution is skewed and its hubs are not already packed together
      (Balaji and Lucia predict no significant speedup when the hubs' Packing Factor is below 4).
    terms: [degree_distribution, index_locality, degree_skew]
    basis: reported
    source: balaji-2018
