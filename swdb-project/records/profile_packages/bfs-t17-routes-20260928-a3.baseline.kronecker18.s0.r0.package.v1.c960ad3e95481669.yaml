- id: function:bfs.cc:18047:546ec83dfdeaf3fe
  kind: function
  name: BFSVerifier
  path: benchmarks/gapbs/src/bfs.cc
  lines: [463, 509]
  byte_range: [18047, 19648]
  insertion_range: [18144, 19648]
  source_sha256: 546ec83dfdeaf3fec444ebfcc1c70b72588f13dd21194e0d19146a5d6f5f5d96
  text: |-
    bool BFSVerifier(const Graph &g, NodeID source,
                     const pvector<NodeID> &parent) {
        pvector<int> depth(g.num_nodes(), -1);
        depth[source] = 0;
        vector<NodeID> to_visit;
        to_visit.reserve(g.num_nodes());
        to_visit.push_back(source);
        for (auto it = to_visit.begin(); it != to_visit.end(); it++) {
            NodeID u = *it;
            for (NodeID v : g.out_neigh(u)) {
                if (depth[v] == -1) {
                    depth[v] = depth[u] + 1;
                    to_visit.push_back(v);
                }
            }
        }
        for (NodeID u : g.vertices()) {
            if ((depth[u] != -1) && (parent[u] != -1)) {
                if (u == source) {
                    if (!((parent[u] == u) && (depth[u] == 0))) {
                        cout << "Source wrong" << endl;
                        return false;
                    }
                    continue;
                }
                bool parent_found = false;
                for (NodeID v : g.in_neigh(u)) {
                    if (v == parent[u]) {
                        if (depth[v] != depth[u] - 1) {
                            cout << "Wrong depths for " << u << " & " << v << endl;
                            return false;
                        }
                        parent_found = true;
                        break;
                    }
                }
                if (!parent_found) {
                    cout << "Couldn't find edge from " << parent[u] << " to " << u << endl;
                    return false;
                }
            } else if (depth[u] != parent[u]) {
                cout << "Reachability mismatch" << endl;
                return false;
            }
        }
        return true;
    }
