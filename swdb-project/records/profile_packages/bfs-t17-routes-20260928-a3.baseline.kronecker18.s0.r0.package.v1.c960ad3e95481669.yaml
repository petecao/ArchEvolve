- id: function:bfs.cc:13304:76a956649bfe9705
  kind: function
  name: DOBFS
  path: benchmarks/gapbs/src/bfs.cc
  lines: [314, 364]
  byte_range: [13304, 14855]
  insertion_range: [13440, 14855]
  source_sha256: 76a956649bfe97051a02af951fec5f4bc552440d0fb952c642fa4a5968d9cae5
  text: |-
    pvector<NodeID> DOBFS(const Graph &g, NodeID source, bool logging_enabled = false,
                          int alpha = 1, int beta = 18) {
        int num_nodes = g.num_nodes();
        int num_edges = g.num_edges_directed();
        if (logging_enabled)
            PrintStep("Source", static_cast<int64_t>(source));
        pvector<SGOffset> VertexOffsetsOut = g.VertexOffsets();
        Timer t;
        alloc_MAA();
        init_MAA();
        t.Start();
        pvector<NodeID> parent = InitParent(g);
        t.Stop();
        if (logging_enabled)
            PrintStep("i", t.Seconds());
        parent[source] = source;
        SlidingQueue<NodeID> queue(g.num_nodes());
        queue.push_back(source);
        queue.slide_window();
        Bitmap curr(g.num_nodes());
        curr.reset();
        Bitmap front(g.num_nodes());
        front.reset();

    #ifdef GEM5
        std::cout << "ROI started: " << omp_get_num_threads() << " threads" << std::endl;
        m5_work_begin(0, 0);
        m5_reset_stats(0, 0);
    #endif
        while (!queue.empty()) {
            std::cout << "Starting TDStep: " << queue.size() << " elements" << std::endl;
            t.Start();
            TDStep(g, VertexOffsetsOut, parent, queue, num_nodes, num_edges);
            queue.slide_window();
            t.Stop();
            if (logging_enabled) {
                PrintStep("td", t.Seconds());
            }
        }
    #pragma omp parallel for
        for (NodeID n = 0; n < g.num_nodes(); n++)
            if (parent[n] < -1)
                parent[n] = -1;
    #ifdef GEM5
        m5_dump_stats(0, 0);
        m5_work_end(0, 0);
        std::cout << "ROI End!!!" << std::endl;
        m5_exit(0);
    #endif
        return parent;
    }
