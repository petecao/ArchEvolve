notes:
- PBFS (forward pass, lines 69-128) is the region the derived BC read-offload contract targets; the dependency
  pass stays scalar.
- The DX100 source declares CountT as float (upstream GAPBS uses double); its own BCVerifier uses the
  same types.
- The full source needs -DNUM_CORES for the authors tile/register arrays; the scalar-only snapshot removes
  them.
- No -DMAA flag is passed; native functional API setup is not accelerated performance evidence.
- Duplicate depth destinations may occur across frontier vertices; the depth read/CAS and path-count patterns
  record this possibility, not a measured rate.
