notes:
- NodeID is int32_t and ScoreT is float (src/benchmark.h, src/pr.cc).
- gapbs CSR index arrays hold pointers (DestID_**), 8 bytes per element on 64-bit hosts.
- The scalar error is an OpenMP reduction, not an array access, so it has no access pattern.
