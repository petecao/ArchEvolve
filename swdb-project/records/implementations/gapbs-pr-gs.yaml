    note: reads in_index_[u] and in_index_[u+1], the bounds of u's in-neighbor range
  - array:
      name: g.in_neighbors_
      role: index
      element_type: NodeID (int32_t)
      element_bytes: 4
      element_count: num_edges_directed
      layout: contiguous
    address_shape: ranged_indirect
    note: walks in_neighbors_[in_index_[u] .. in_index_[u+1])
  - array:
      name: outgoing_contrib
      role: target
      element_type: ScoreT (float)
      element_bytes: 4
      element_count: num_nodes
      layout: contiguous
    address_shape: single_valued_indirect
    index_transform: identity
    note: reads outgoing_contrib[v] for each in-neighbor v
  update_kind: read
  update:
    pseudocode: incoming_total += outgoing_contrib[v]
    side_effects: null
  semantics:
    duplicate_target_indices:
      value: true
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: Each vertex v is read once per out-edge in a sweep; any vertex with out-degree above 1 repeats.
        The profile's duplicate_ratio measures how much, per input.
    index_modified_during_loop:
      value: false
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: The graph is passed as const Graph&; in_index_ and in_neighbors_ are never written by the
        kernel.
    loop_carried_dependencies:
      value: true
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: 'Gauss-Seidel: iteration u writes outgoing_contrib[u] (line 53) in the same sweep in which
        later iterations read it through their in-neighbor lists (line 49), so an iteration can depend
        on an earlier one.'
    shared_target_between_threads:
      value: true
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: All threads read outgoing_contrib while other threads write their own vertices' entries in
        the same parallel loop.
    atomic_updates_required:
      value: false
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: Plain float loads and stores; gapbs tolerates the race (a reader sees the old or the new value)
        and the result still passes the verifier.
    ordering:
      value: schedule_dependent
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: Which new values a reader sees depends on the schedule (dynamic, 16384) and thread timing;
        every order converges and passes the verifier.
    numerical_requirement:
      value: fp_reassociation_allowed
      basis: code_reading
      evidence_refs: [src-gapbs-pr]
      note: incoming_total is a float sum in neighbor order; any order that passes the verifier tolerance
        is acceptable.
  evidence_refs: [src-gapbs-pr]
