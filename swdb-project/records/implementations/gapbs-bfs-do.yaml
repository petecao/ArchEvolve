notes:
- NodeID is int32_t (src/benchmark.h line 31); CSR index arrays hold pointers (DestID_**), 8 bytes per
  element on 64-bit hosts.
- Bitmap words are uint64_t, (n + 63) / 64 words for n bits (bitmap.h lines 25-29); front and curr each
  cover num_nodes bits and swap after every bottom-up step (line 154).
- SlidingQueue<NodeID> queue(g.num_nodes()) (line 133) holds every vertex added in the call; each QueueBuffer
  adds a thread-local buffer of 16384 NodeIDs (64 KiB per thread, not graph-sized, not recorded as an
  array).
- 'sweep_log_flag is null: with -l DOBFS prints labeled lines through PrintStep ("Source", "i", "e", "bu",
  "c", "td"; lines 125, 131, 147, 157, 162, 171), which do not have the <integer> <number> form the profiler
  counts, and a step is not a sweep of a fixed-point loop.'
- 'index_stream is null: the traversal visits neighbor lists in frontier order, which depends on the source
  and (for the parallel steps) on the thread schedule, so the extractor''s CSR order (in_neighbors_by_vertex
  / out_neighbors_by_vertex) is not the kernel''s order.'
- TDStep reads out_index_/out_neighbors_ and BUStep reads in_index_/in_neighbors_; the pilot inputs are
  symmetrized, so the in_ arrays carry undirected_alias to the out_ arrays and footprints count them once.
- front.reset() and curr.reset() (lines 137, 139) and the scalar updates parent[source] = source and scout_count
  are done once per call outside the loops and have no access pattern.
- kernel_symbols lists the six kernel functions; the helpers Bitmap::get_bit/set_bit/set_bit_atomic, QueueBuffer::push_back/flush
  and compare_and_swap are expected to be inlined at -O3 (not checked); if they are not, their simulated
  misses are not counted as the kernel.
