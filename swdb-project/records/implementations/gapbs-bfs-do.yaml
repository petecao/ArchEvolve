- id: td-parent-claim
  expression: compare_and_swap(parent[v], curr_val, u) for v in g.out_neigh(u)
  loop: td-edge
  steps:
  - array:
      name: queue.shared
      role: index
      element_type: NodeID (int32_t), SlidingQueue<NodeID> storage
      element_bytes: 4
      element_count: num_nodes
      layout: contiguous
    address_shape: stream
    stride: 1
    note: u = *q_iter walks the current frontier window of the queue
  - array:
      name: g.out_index_
      role: offsets
      element_type: NodeID* (pointer into out_neighbors_)
      element_bytes: 8
      element_count: num_nodes + 1
      layout: array_of_pointers
    address_shape: single_valued_indirect
    index_transform: identity
    note: reads out_index_[u] and out_index_[u+1], the bounds of u's out-neighbor range
  - array:
      name: g.out_neighbors_
      role: index
      element_type: NodeID (int32_t)
      element_bytes: 4
      element_count: num_edges_directed
      layout: contiguous
    address_shape: ranged_indirect
    note: walks out_neighbors_[out_index_[u] .. out_index_[u+1])
  - array:
      name: parent
      role: target
      element_type: NodeID (int32_t)
      element_bytes: 4
      element_count: num_nodes
      layout: contiguous
    address_shape: single_valued_indirect
    index_transform: identity
    note: reads parent[v]; if negative (unvisited), tries to claim it with a CAS
  update_kind: compare_and_swap
  update:
    pseudocode: 'curr = parent[v]; if curr < 0 and CAS(parent[v], curr, u): lqueue.push_back(v); scout_count
      += -curr'
    side_effects: appends v to the thread's QueueBuffer; adds v's out-degree (encoded as -parent[v]) to
      scout_count (an OpenMP + reduction)
  semantics:
    duplicate_target_indices:
      value: true
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: Many frontier vertices u can share an out-neighbor v, so several iterations read and try to
        claim the same parent[v] in one step (lines 76-79).
    index_modified_during_loop:
      value: false
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: The graph is passed as const; its index and neighbor arrays are never written by the kernel.
        The queue window is not modified during the step.
    loop_carried_dependencies:
      value: false
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: 'Level-synchronous: within one top-down step iterations only race to claim; the CAS decides
        one winner and any winner is valid. Parents set in this step are read as the frontier only after
        slide_window (line 168).'
    shared_target_between_threads:
      value: true
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: Any thread can claim any v.
    atomic_updates_required:
      value: true
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: compare_and_swap(parent[v], curr_val, u) (line 79) is __sync_bool_compare_and_swap on int32_t
        (platform_atomics.h lines 29-32); without it two threads could both push v.
    ordering:
      value: level_synchronous
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: Levels must complete in order (one step per level); order within a level is free.
    numerical_requirement:
      value: any_valid_result
      basis: code_reading
      evidence_refs: [src-gapbs-bfs-do]
      note: Whichever frontier vertex wins parent[v] is a valid BFS parent; BFSVerifier accepts any of
        them.
  evidence_refs: [src-gapbs-bfs-do]
  note: parent[v] < 0 encodes an unvisited vertex's negated out-degree (InitParent), so the read also
    supplies the degree.
