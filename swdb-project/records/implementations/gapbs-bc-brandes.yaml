notes:
- NodeID is int32_t, ScoreT is float, CountT is double (src/benchmark.h line 31; bc.cc lines 47-48).
- gapbs CSR index arrays hold pointers (DestID_**), 8 bytes per element on 64-bit hosts.
- Only out_index_/out_neighbors_ are read (out_neigh), so no array needs undirected_alias; the successor
  bitmap succ has one bit per CSR edge, (num_edges_directed + 63) / 64 uint64_t words (bc.cc line 101,
  bitmap.h lines 25-29).
- SlidingQueue<NodeID> queue(g.num_nodes()) (line 103) keeps every reached vertex in level order for the
  back-propagation; each QueueBuffer adds a thread-local buffer of 16384 NodeIDs (not graph-sized, not
  recorded). depth_index holds one iterator per level (not graph-sized).
- The per-source arrays depths and deltas are allocated and filled inside the source loop (lines 54, 121);
  the fills are pvector::fill (pvector.h lines 132-136).
- 'sweep_log_flag is null: with -l Brandes prints labeled lines through PrintStep ("a", "Source", "b",
  "p"; lines 106, 111, 120, 139), which do not have the <integer> <number> form the profiler counts.'
- 'index_stream is null: the traversal visits neighbor lists in frontier order, which depends on the source
  and (for the parallel steps) on the thread schedule, so the extractor''s CSR order (in_neighbors_by_vertex
  / out_neighbors_by_vertex) is not the kernel''s order.'
- kernel_symbols are Brandes and PBFS. pvector::fill runs as its own OpenMP outlined function (pvector<T>::fill._omp_fn.N),
  which the symbol match does not include, so the fills' simulated misses are not counted as the kernel;
  Bitmap and QueueBuffer helpers are expected to be inlined at -O3 (not checked).
