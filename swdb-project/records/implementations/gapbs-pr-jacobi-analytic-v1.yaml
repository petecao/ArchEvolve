code:
- root: application
  path: src/pr_spmv.cc
  lines:
  - 35
  - 61
  excerpt: "pvector<ScoreT> PageRankPull(const Graph &g, int max_iters, double epsilon\
    \ = 0,\n                             bool logging_enabled = false) {\n  const\
    \ ScoreT init_score = 1.0f / g.num_nodes();\n  const ScoreT base_score = (1.0f\
    \ - kDamp) / g.num_nodes();\n  pvector<ScoreT> scores(g.num_nodes(), init_score);\n\
    \  pvector<ScoreT> outgoing_contrib(g.num_nodes());\n  for (int iter=0; iter <\
    \ max_iters; iter++) {\n    double error = 0;\n    #pragma omp parallel for\n\
    \    for (NodeID n=0; n < g.num_nodes(); n++)\n      outgoing_contrib[n] = scores[n]\
    \ / g.out_degree(n);\n    #pragma omp parallel for reduction(+ : error) schedule(dynamic,\
    \ 16384)\n    for (NodeID u=0; u < g.num_nodes(); u++) {\n      ScoreT incoming_total\
    \ = 0;\n      for (NodeID v : g.in_neigh(u))\n        incoming_total += outgoing_contrib[v];\n\
    \      ScoreT old_score = scores[u];\n      scores[u] = base_score + kDamp * incoming_total;\n\
    \      error += fabs(scores[u] - old_score);\n    }\n    if (logging_enabled)\n\
    \      PrintStep(iter, error);\n    if (error < epsilon)\n      break;\n  }\n\
    \  return scores;\n}"
  sha256: ea1e58b6957b0bcc1e76f4fde54131aa52bdefd2014dae604a9b7d9d1a5dae70
