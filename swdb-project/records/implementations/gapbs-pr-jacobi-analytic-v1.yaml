access_patterns:
- id: gather-contrib
  expression: outgoing_contrib[v] for v in g.in_neigh(u)
  loop: edge
  steps:
  - array:
      name: g.in_index_
      role: offsets
      element_type: NodeID* (pointer into in_neighbors_)
      element_bytes: 8
      element_count: num_nodes + 1
      layout: array_of_pointers
    address_shape: stream
    stride: 1
    note: reads in_index_[u] and in_index_[u+1], the bounds of u's in-neighbor range
  - array:
      name: g.in_neighbors_
      role: index
      element_type: NodeID (int32_t)
      element_bytes: 4
      element_count: num_edges_directed
      layout: contiguous
    address_shape: ranged_indirect
    note: walks in_neighbors_[in_index_[u] .. in_index_[u+1])
  - array:
      name: outgoing_contrib
      role: target
      element_type: ScoreT (float)
      element_bytes: 4
      element_count: num_nodes
      layout: contiguous
    address_shape: single_valued_indirect
    index_transform: identity
    note: reads outgoing_contrib[v] for each in-neighbor v
  update_kind: read
  update:
    pseudocode: incoming_total += outgoing_contrib[v]
    side_effects: null
  semantics:
    duplicate_target_indices:
      value: true
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
      note: Each vertex v is read once per out-edge in a sweep; any vertex with out-degree
        above 1 repeats. The profile's duplicate_ratio measures how much, per input.
    index_modified_during_loop:
      value: false
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
      note: The graph is passed as const Graph&; in_index_ and in_neighbors_ are never
        written by the kernel.
    loop_carried_dependencies:
      value: false
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
      note: 'Jacobi: outgoing_contrib is written only in the separate contrib loop
        before the vertex loop, so no iteration of the vertex loop depends on another.'
    shared_target_between_threads:
      value: true
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
      note: All threads read outgoing_contrib; nobody writes it during this loop.
    atomic_updates_required:
      value: false
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
    ordering:
      value: any_order
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
      note: Reads see only the previous sweep's values, so the vertex order does not
        change the result beyond float summation order.
    numerical_requirement:
      value: fp_reassociation_allowed
      basis: code_reading
      evidence_refs:
      - src-gapbs-pr-spmv
      note: incoming_total is a float sum in neighbor order; any order that passes
        the verifier tolerance is acceptable.
  evidence_refs:
  - src-gapbs-pr-spmv
