notes:
- 'Build uses the application''s headers: -I apps/gapbs/src.'
- Compared with the baseline, the contribution update moves out of the vertex loop
  into its own loop, which removes the loop-carried dependency and adds one extra
  stream pass over scores, out_index_, and outgoing_contrib per sweep.
- 'Data-only modern context: original Jacobi source, flags, timed lambda, and defaults
  remain unchanged. Whole timed-call registered-functional ROI has no SourcePicker;
  trial sources are empty, not fabricated. Include-template spelling is equivalent
  to the original separated -I path.'
