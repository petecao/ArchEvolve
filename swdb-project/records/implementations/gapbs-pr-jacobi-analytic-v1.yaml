evaluator:
  backend: native
  command: '{binary} {input_args} -n 1 -v'
  pass_regex: Verification:\s+PASS
  verifier:
    description: 'PRVerifier: from the returned scores, one serial push-direction
      PageRank iteration; the L1 distance between its result and the scores must be
      below the tolerance.'
    code:
      root: application
      path: src/pr_spmv.cc
      lines:
      - 76
      - 94
      excerpt: "// Verifies by asserting a single serial iteration in push direction\
        \ has\n//   error < target_error\nbool PRVerifier(const Graph &g, const pvector<ScoreT>\
        \ &scores,\n                        double target_error) {\n  const ScoreT\
        \ base_score = (1.0f - kDamp) / g.num_nodes();\n  pvector<ScoreT> incoming_sums(g.num_nodes(),\
        \ 0);\n  double error = 0;\n  for (NodeID u : g.vertices()) {\n    ScoreT\
        \ outgoing_contrib = scores[u] / g.out_degree(u);\n    for (NodeID v : g.out_neigh(u))\n\
        \      incoming_sums[v] += outgoing_contrib;\n  }\n  for (NodeID n : g.vertices())\
        \ {\n    error += fabs(base_score + kDamp * incoming_sums[n] - scores[n]);\n\
        \    incoming_sums[n] = 0;\n  }\n  PrintTime(\"Total Error\", error);\n  return\
        \ error < target_error;\n}"
      sha256: ea1e58b6957b0bcc1e76f4fde54131aa52bdefd2014dae604a9b7d9d1a5dae70
verification:
  status: unchecked
  evidence: []
  scope: Source-only Jacobi registration; no new workload, target or counted execution
    is certified.
