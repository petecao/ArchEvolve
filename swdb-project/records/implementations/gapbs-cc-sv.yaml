  excerpt: |-
    pvector<NodeID> ShiloachVishkin(const Graph &g) {
      pvector<NodeID> comp(g.num_nodes());
      #pragma omp parallel for
      for (NodeID n=0; n < g.num_nodes(); n++)
        comp[n] = n;
      bool change = true;
      int num_iter = 0;
      while (change) {
        change = false;
        num_iter++;
        #pragma omp parallel for
        for (NodeID u=0; u < g.num_nodes(); u++) {
          for (NodeID v : g.out_neigh(u)) {
            NodeID comp_u = comp[u];
            NodeID comp_v = comp[v];
            if (comp_u == comp_v) continue;
            // Hooking condition so lower component ID wins independent of direction
            NodeID high_comp = comp_u > comp_v ? comp_u : comp_v;
            NodeID low_comp = comp_u + (comp_v - high_comp);
            if (high_comp == comp[high_comp]) {
              change = true;
              comp[high_comp] = low_comp;
            }
          }
        }
        #pragma omp parallel for
        for (NodeID n=0; n < g.num_nodes(); n++) {
          while (comp[n] != comp[comp[n]]) {
            comp[n] = comp[comp[n]];
          }
        }
      }
      cout << "Shiloach-Vishkin took " << num_iter << " iterations" << endl;
      return comp;
    }
  sha256: f239bd71cee27cba37f3824ae7b2520c291b116ccc83a329d09484b631c599ee
