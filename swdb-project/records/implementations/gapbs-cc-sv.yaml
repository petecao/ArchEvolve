notes:
- 'Build uses the application''s headers: -I apps/gapbs/src.'
- NodeID is int32_t (src/benchmark.h line 31); comp is pvector<NodeID>, one 4-byte label per vertex.
- gapbs CSR index arrays hold pointers (DestID_**), 8 bytes per element on 64-bit hosts.
- The three omp parallel for loops (lines 51, 59, 74) have no schedule clause (the OpenMP runtime's default
  applies).
- 'run.sweep_log_flag is null: ShiloachVishkin never calls PrintStep and ignores -l; it prints its sweep
  count once as "Shiloach-Vishkin took N iterations" (line 81), which the profiler''s step-log parser
  does not read.'
- 'Compared with the baseline (Afforest): every sweep visits all edges and hooks with plain stores repaired
  by further sweeps, instead of one sampled pass plus one pass over the remaining edges with compare-and-swap
  hooks.'
- Sweeps per call come from the line 'Shiloach-Vishkin took N iterations' (cc_sv.cc line 81) through run.sweep_count_regex.
