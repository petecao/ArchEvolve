notes:
- TDStep statement annotation covers the frontier, CSR row bounds and neighbors, parent read/CAS/store,
  and local queue append; code reading only, not dynamic profiling.
- Despite its retained direction-optimizing header, scalar DOBFS calls TDStep only.
- The pinned graph representation uses int32_t SGOffset; upstream GAPBS serialization must not be assumed
  equivalent.
- No -DMAA flag is passed; native functional API setup is not accelerated performance evidence.
- Duplicate parent destinations may occur across frontier vertices; the three parent patterns record this
  possibility, not a measured duplicate rate.
