  excerpt: |-
    pvector<WeightT> DeltaStep(const WGraph &g, NodeID source, WeightT delta,
                               bool logging_enabled = false) {
      Timer t;
      pvector<WeightT> dist(g.num_nodes(), kDistInf);
      dist[source] = 0;
      pvector<NodeID> frontier(g.num_edges_directed());
      // two element arrays for double buffering curr=iter&1, next=(iter+1)&1
      size_t shared_indexes[2] = {0, kMaxBin};
      size_t frontier_tails[2] = {1, 0};
      frontier[0] = source;
      t.Start();
      #pragma omp parallel
      {
        vector<vector<NodeID> > local_bins(0);
        size_t iter = 0;
        while (shared_indexes[iter&1] != kMaxBin) {
          size_t &curr_bin_index = shared_indexes[iter&1];
          size_t &next_bin_index = shared_indexes[(iter+1)&1];
          size_t &curr_frontier_tail = frontier_tails[iter&1];
          size_t &next_frontier_tail = frontier_tails[(iter+1)&1];
          #pragma omp for nowait schedule(dynamic, 64)
          for (size_t i=0; i < curr_frontier_tail; i++) {
            NodeID u = frontier[i];
            if (dist[u] >= delta * static_cast<WeightT>(curr_bin_index))
              RelaxEdges(g, u, delta, dist, local_bins);
          }
          while (curr_bin_index < local_bins.size() &&
                 !local_bins[curr_bin_index].empty() &&
                 local_bins[curr_bin_index].size() < kBinSizeThreshold) {
            vector<NodeID> curr_bin_copy = local_bins[curr_bin_index];
            local_bins[curr_bin_index].resize(0);
            for (NodeID u : curr_bin_copy)
              RelaxEdges(g, u, delta, dist, local_bins);
          }
          for (size_t i=curr_bin_index; i < local_bins.size(); i++) {
            if (!local_bins[i].empty()) {
              #pragma omp critical
              next_bin_index = min(next_bin_index, i);
              break;
            }
          }
          #pragma omp barrier
          #pragma omp single nowait
          {
            t.Stop();
            if (logging_enabled)
              PrintStep(curr_bin_index, t.Millisecs(), curr_frontier_tail);
            t.Start();
            curr_bin_index = kMaxBin;
            curr_frontier_tail = 0;
          }
          if (next_bin_index < local_bins.size()) {
            size_t copy_start = fetch_and_add(next_frontier_tail,
                                              local_bins[next_bin_index].size());
            copy(local_bins[next_bin_index].begin(),
                 local_bins[next_bin_index].end(), frontier.data() + copy_start);
            local_bins[next_bin_index].resize(0);
          }
          iter++;
          #pragma omp barrier
        }
        #pragma omp single
        if (logging_enabled)
          cout << "took " << iter << " iterations" << endl;
      }
      return dist;
    }
  sha256: null
- root: application
  path: src/sssp.cc
  lines: [68, 85]
  excerpt: |-
    inline
    void RelaxEdges(const WGraph &g, NodeID u, WeightT delta,
                    pvector<WeightT> &dist, vector <vector<NodeID>> &local_bins) {
      for (WNode wn : g.out_neigh(u)) {
        WeightT old_dist = dist[wn.v];
        WeightT new_dist = dist[u] + wn.w;
        while (new_dist < old_dist) {
          if (compare_and_swap(dist[wn.v], old_dist, new_dist)) {
            size_t dest_bin = new_dist/delta;
            if (dest_bin >= local_bins.size())
              local_bins.resize(dest_bin+1);
            local_bins[dest_bin].push_back(wn.v);
            break;
          }
          old_dist = dist[wn.v];      // swap failed, recheck dist update & retry
        }
      }
    }
