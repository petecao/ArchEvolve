notes:
- NodeID and WeightT are int32_t; WNode = NodeWeight<int32_t, int32_t> is {v, w}, 8 bytes (src/benchmark.h
  lines 31-33, src/graph.h lines 30-36); CSR index arrays hold WNode* pointers, 8 bytes per element.
- frontier is pvector<NodeID>(g.num_edges_directed()) (line 92), allocated but not filled; local_bins
  are thread-local std::vector<std::vector<NodeID>> (line 100).
- The fused path copies a thread-local bin of fewer than 1000 IDs (curr_bin_copy, line 116) and the bin
  vote (lines 121-127) scans thread-local bin headers; neither is graph-sized, so neither has an access
  pattern.
- 'sweep_log_flag is null: with -l DeltaStep prints PrintStep(curr_bin_index, t.Millisecs(), curr_frontier_tail)
  (line 133), a line of three fields (bin index, frontier size, milliseconds) through util.h lines 37-46,
  not the <integer> <number> form, and its first field is a bucket index, not an iteration count.'
- 'index_stream is null: the traversal visits neighbor lists in frontier order, which depends on the source
  and (for the parallel steps) on the thread schedule, so the extractor''s CSR order (in_neighbors_by_vertex
  / out_neighbors_by_vertex) is not the kernel''s order.'
- Only out_index_/out_neighbors_ are read, so no array needs undirected_alias.
- kernel_symbols are DeltaStep and RelaxEdges (declared inline, likely inlined at -O3 into DeltaStep's
  outlined body, which DeltaStep matches). The dist fill runs in pvector<int>::fill's own outlined function
  and is not counted as the kernel.
- 'local_bins has element_count null: its size depends on the data at run time, so footprints of this
  implementation are lower bounds.'
