notes:
- This is the unchanged author reference for the artifact and controlled reference pairs, not a generated candidate from either required proposal route.
- The original bfs_maa binary selects DOBFSMAA through -DMAA. A trusted complete-call wrapper must explicitly select DOBFSMAA and disclose its different wrapper, flags, and ROI.
- The author artifact ROI is bfs.dx100.traversal.v1; its duration is sealed simulated ROI time, not the guest Trial Time line or simulator host runtime.
- The application uses signed 32-bit SG offsets. Equivalent upstream SG64 adjacency requires registered representation validation.
- The original source waits on tile3 after its masked indirect store. This reference preserves that source; the evaluator must establish actual correctness independently rather than silently repairing the author baseline.
- Guest build and m5op.o require the complete pinned model checkout. The imported local source subset alone is not an executable simulator build.
