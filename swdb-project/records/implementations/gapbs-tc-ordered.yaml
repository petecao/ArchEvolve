notes:
- 'Relabeling is inside the timed kernel: BenchmarkKernel times Hybrid (benchmark.h lines 107-109), and
  Hybrid calls WorthRelabelling and, if it returns true, Builder::RelabelByDegree before OrderedCount
  (tc.cc lines 95-100). WorthRelabelling returns true when the average degree is at least 10 and the sampled
  mean degree / 1.3 exceeds the sampled median (lines 75-91), so the decision depends on the input''s
  degree distribution: expected true for power-law (Kronecker) inputs with enough edges, false for uniform-random
  ones; the profile''s run log shows a "Relabel" time line (builder.h line 400) when it happened.'
- The loops and patterns of RelabelByDegree run only when relabeling happens; their trip counts are basis
  unknown for that reason. Footprints sum all arrays of all patterns, so they include the relabeled copy
  (relabeled index, relabeled neighs), new_ids, degrees, offsets, and degree_id_pairs even on inputs that
  are not relabeled. On relabeled inputs OrderedCount's g.out_index_/g.out_neighbors_ are the relabeled
  copy, which has the same sizes.
- 'Not recorded as access patterns: the std::sort of degree_id_pairs (builder.h lines 381-382) and of
  each new list (line 397), which are library code (tc.cc defines _GLIBCXX_PARALLEL, lines 4-7, so the
  pair sort may run in parallel); ParallelPrefixSum and GenIndex (lines 390-392); and the WorthRelabelling
  samples, whose vertex IDs come from a random generator (SourcePicker, benchmark.h lines 45-68), which
  no address shape describes. Their functions are also not in kernel_symbols, so simulated misses leave
  them out.'
- The count total is an OpenMP + reduction over size_t, not an array access, so it has no access pattern.
- 'run.index_stream is null: the extractor walks every full list g.out_neigh(u) of the graph as built,
  while OrderedCount reads only the prefix of each list below u (break at line 58), walks neighbor lists
  through the merge in a data-dependent order, and on inputs that are relabeled works on a graph with
  different IDs and list order. The extractor''s out_neighbors_by_vertex order is exact for none of these.'
- 'run.sweep_log_flag is null: tc has no outer iterative loop and never calls PrintStep.'
- NodeID is int32_t (src/benchmark.h line 31); gapbs CSR index arrays hold pointers (DestID_**), 8 bytes
  per element on 64-bit hosts. tc requires an undirected graph (lines 137-140), for which out_index_ and
  in_index_ are the same array; OrderedCount reads only the out_ side.
