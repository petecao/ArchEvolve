      element_bytes: 4
      element_count: num_nodes
      layout: contiguous
    address_shape: single_valued_indirect
    index_transform: identity
    note: p2 = comp[v] (line 43); on retries p1 and p2 come from the climb at lines 52-53
  - array:
      name: comp
