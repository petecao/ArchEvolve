      lookup comp[high] (line 47), then the compare-and-swap on the same element (line 50)
  update_kind: compare_and_swap
  update:
    pseudocode: high = max(p1, p2); low = min(p1, p2); p_high = comp[high]; if (p_high == low || (p_high
      == high && CAS(comp[high], high, low))) done
    side_effects: null
