notes:
- NodeID is int32_t (src/benchmark.h line 31); comp is pvector<NodeID>, one 4-byte label per vertex.
- gapbs CSR index arrays hold pointers (DestID_**), 8 bytes per element on 64-bit hosts; on an undirected
  graph in_index_/in_neighbors_ are the same memory as out_index_/out_neighbors_ (graph.h lines 138-143).
- 'run.index_stream is null: the sampling rounds read only the neighbor at offset r of each list (lines
  109-113), and the final pass skips the first two neighbors of every vertex and every vertex in the sampled
  largest component (lines 127-130); no single pass visits out_neighbors_ in full CSR order, so the extractor''s
  out_neighbors_by_vertex order is not this kernel''s order.'
- 'run.sweep_log_flag is null: with -l, Afforest prints only one line from SampleFrequentElement ("Skipping
  largest intermediate component ...", lines 86-90), never PrintStep lines, so there is no per-round <step>
  <value> log.'
- SampleFrequentElement (lines 69-92) reads comp at 1024 positions drawn from a default-seeded std::mt19937
  (lines 75-79) and counts them in a std::unordered_map; it has no access pattern because no address shape
  describes addresses drawn from a random generator (every chain must start with a stream or pointer_chase),
  and the hash map is not an array. It is 1024 reads per call.
- The omp parallel for at line 100 has no schedule clause (the OpenMP runtime's default applies).
- 'Link is not inlined into one loop: it is called from sample-edge (line 111), final-edge (lines 131,
  140), and final-in-edge (line 144); loop link records its retry loop (lines 44-54) once, with parent
  null.'
