    __builtin_ia32_gathersiv16sf with mask 0xFFFF (16 lanes); immintrin.h includes it.'
  uri: https://github.com/gcc-mirror/gcc/blob/master/gcc/config/i386/avx512fintrin.h
- id: rust-core-arch
  kind: vendor_reference
  description: 'Rust core::arch::x86_64::_mm512_i32gather_ps documentation, which reproduces Intel''s
    description ("32-bit elements are loaded from addresses starting at base_addr and offset by each
    32-bit element in vindex (each index is scaled by the factor in scale)") under target feature avx512f.'
  uri: https://doc.rust-lang.org/core/arch/x86_64/fn._mm512_i32gather_ps.html
name: _mm512_i32gather_ps
isa_family: x86
isa_extensions:
- avx512f
header: immintrin.h
memory_kind: gather
address_shape: single_valued_indirect
element_bits: 32
lanes: 16
notes:
- scale must be 1, 2, 4, or 8. Each lane's address is base + index[lane] * scale, one
  single_valued_indirect access per lane; all 16 lanes are active (the masked form is
  _mm512_mask_i32gather_ps).
