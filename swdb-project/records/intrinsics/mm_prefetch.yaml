notes:
- address_shape is null because the instruction takes one address the caller computed; the
  access pattern that calls it records the shape (update kind prefetch).
- PREFETCHh (T0, T1, T2, NTA) moves one cache line; it returns no data and never faults.
- GCC declares _mm_prefetch outside its target("sse") block, so GCC accepts it without -msse;
  SSE is part of the x86-64 baseline in any case.
