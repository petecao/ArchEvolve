      mechanisms:
      - model: compute_throughput
        parameters:
          integer_ops_per_s:
            value: 6000000000
            basis: estimated
            source: Trials contain about 6.67 million integer operations and use up to four workers. Assuming
              a conservative 3 GHz core rate with one useful integer operation per two cycles per worker
              gives 6.0e9 operations/s. [Frozen estimation output ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983,
              mechanisms[0].parameters.integer_ops_per_s]
            unit: operations/s
          floating_point_ops_per_s:
            value: null
            basis: unknown
            source: Required target service premise is not established by source configuration.
            unit: operations/s
          branch_ops_per_s:
            value: 3000000000
            basis: estimated
            source: Trials contain about 8.0 million branches and use up to four workers. A conservative
              branch-heavy CPU estimate of four 3 GHz workers retiring one useful branch per four cycles
              gives 3.0e9 operations/s. [Frozen estimation output ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983,
              mechanisms[0].parameters.branch_ops_per_s]
            unit: operations/s
          atomic_ops_per_s:
            value: 53333333.33
            basis: estimated
            source: Four active workers are present in atomic regions. Approximating a coherence-sensitive
              atomic as two 37.5 ns row-miss service intervals gives 4/(75 ns), or about 5.33e7 operations/s.
              [Frozen estimation output ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983,
              mechanisms[0].parameters.atomic_ops_per_s]
            unit: operations/s
      - model: reorder_window_rows
        selector:
          domain: offload
        parameters:
          row_miss_service_s:
            value: 3.75e-08
            basis: inferred
            source: DDR4_3200W nRP+nRCD+nCL at625ps; serialized closed-row service scenario.
            unit: seconds/request
          row_hit_service_s:
            value: 1.25e-08
            basis: inferred
            source: DDR4_3200W nCL20 at625ps; declared latency scenario, not physical row-hit measurement.
            unit: seconds/request
          effective_memory_parallelism:
            value: 8
            basis: estimated
            source: With four workers, two independent outstanding requests per worker gives eight effective
              requests, while remaining safely below the known 32-entry fetch-queue capacity. [Frozen
              estimation output ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983, mechanisms[1].parameters.effective_memory_parallelism]
            unit: requests
      - model: fetch_queue
        selector:
          domain: offload
        parameters:
          queue_entries:
            value: 32
            basis: code_reading
            source: Pinned example controller queue_size32; an ideal capacity bound only.
            unit: entries
          fetch_latency_s:
            value: 7.5e-08
            basis: estimated
            source: An end-to-end fetch is estimated as two phases at the supplied 37.5 ns row-miss service
              scale—request/service and return—giving 75 ns per request. [Frozen estimation output ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983,
              mechanisms[2].parameters.fetch_latency_s]
            unit: seconds/request
          admission_requests_per_s:
            value: 106666666.67
            basis: estimated
            source: Using eight effective in-flight requests and the estimated 75 ns end-to-end fetch
              latency, Little's law gives 8/(75 ns), or about 1.07e8 requests/s. [Frozen estimation output
              ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983, mechanisms[2].parameters.admission_requests_per_s]
            unit: requests/s
      - model: tile_staging
        selector:
          domain: offload
        parameters:
          staging_bytes_per_s:
            value: 4110000000
            basis: estimated
            source: Across the five trials, 111735336 staged bytes accompany 2901676 line requests, averaging
              38.51 bytes/request. Multiplying by the estimated 1.0667e8-request/s admission rate gives
              about 4.11e9 bytes/s. [Frozen estimation output ce788640fb533ddc3ff7b4c897f2c9089015980562245bb3aee994b0a1a72983,
              mechanisms[3].parameters.staging_bytes_per_s]
            unit: bytes/s
      - model: offload_setup
        accounting: additive_overhead
        selector:
          event_ids:
          - dx100.functional.session_begin
          - dx100.functional.thread_context
          - dx100.functional.const_i32
          - dx100.functional.wait
          - dx100.functional.gather
          - dx100.functional.stream_load
          - dx100.functional.range_loop
          - dx100.functional.tile_size
          - dx100.functional.tile_pointer
        parameters:
          seconds_per_event:
            value: null
            basis: unknown
            source: Required target service premise is not established by source configuration.
            unit: seconds/event
