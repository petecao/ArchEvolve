  - get_cacheable_tile_pointer
  - maa_stream_load
  - maa_indirect_load
  - maa_range_loop
  - wait_ready
  - get_tile_size
  - data
  - maa_alu_scalar
  - maa_indirect_store_vector
  - operator[]
  - compare_and_swap
  - push_back
  - flush
  callers: [DOBFSMAA]
  referenced_types:
