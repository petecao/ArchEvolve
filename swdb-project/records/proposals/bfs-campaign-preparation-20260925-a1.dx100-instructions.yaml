  intent: 'Within the original scalar DOBFS, initialize the same per-thread MAA tiles and registers used
    by DOBFSMAA, inside the complete-call ROI, and route its frontier expansion through the existing TDStepMAA.
    Preserve the original DOBFS signature, BFSVerifier, m5 event locations, graph representation, parent
    initialization, level transitions, and normalization. Preserve existing adaptive full/tail handling
    and serialized parent updates. In TDStepMAA, wait for tile5, the destination holding returned old
    parent values, after the masked indirect store before CPU consumption or leaving the critical section.
    Do not merely select the existing DOBFSMAA entry point or add a comment: the evaluated DOBFS body
    must actually change. Use only the pinned supported operations. This is a representative selected
    offload strategy; no tuning or alternative strategy search is authorized.'
