      \ queue.endp());\n+ add_mem_region(VertexOffsets.beginp(), VertexOffsets.endp());\n+ add_mem_region(g.out_neighbors_,\
      \ &g.out_neighbors_[num_edges]);\n+ add_mem_region(parent.beginp(), parent.endp());\n #endif\n #pragma\
      \ omp parallel\n-    {\n-        QueueBuffer<NodeID> lqueue(queue);\n+ {\n+  QueueBuffer<NodeID>\
      \ lqueue(queue);\n+  const bool accelerate=swdb_acceleration_enabled&&queue.size()>=SWDB_FRONTIER_THRESHOLD;\n\
      +  if(accelerate){\n+   dxc_context c=swdb_contexts[omp_get_thread_num()];\n+   __dxc_const_i32(1,c.reg[2]);__dxc_const_i32(0,c.reg[3]);\n\
      +#pragma omp for schedule(dynamic,1)\n+   for(size_t begin=queue.shared_out_start;begin<queue.shared_out_end;begin+=SWDB_CHUNK_SIZE){\n\
      +    const size_t end=std::min(begin+size_t(SWDB_CHUNK_SIZE),size_t(queue.shared_out_end));\n+ \
      \   __dxc_const_i32(begin,c.reg[0]);__dxc_const_i32(end,c.reg[1]);\n+    __dxc_stream_load(queue.shared,c.reg[0],c.reg[1],c.reg[2],c.tile[0]);\n\
      +    __dxc_gather(VertexOffsets.data(),c.tile[0],c.tile[1]);\n+    __dxc_gather(VertexOffsets.data()+1,c.tile[0],c.tile[2]);\n\
      +    __dxc_const_i32(0,c.reg[4]);__dxc_const_i32(-1,c.reg[5]);\n+    __dxc_accelerated_chunk();\n\
      +    for(;;){\n+     __dxc_range_loop(c.reg[4],c.reg[5],c.tile[1],c.tile[2],c.reg[2],c.tile[6],c.tile[7]);\n\
      +     __dxc_wait(c.tile[7]);\n+     const unsigned count=__dxc_tile_size(c.tile[7]);if(count==0)break;\n\
      +     __dxc_gather(g.out_neighbors_,c.tile[7],c.tile[0]);\n+     __dxc_gather(queue.shared+begin,c.tile[6],c.tile[3]);\n\
      +     __dxc_gather(parent.data(),c.tile[0],c.tile[5]);\n+     __dxc_wait(c.tile[3]);__dxc_wait(c.tile[5]);\n\
      +     int*vertices=__dxc_tile_pointer<int>(c.tile[0]);int*frontier=__dxc_tile_pointer<int>(c.tile[3]);\n\
      +     int*hints=__dxc_tile_pointer<int>(c.tile[5]);\n+     for(unsigned k=0;k<count;++k){\n+   \
      \   const NodeID v=vertices[k],u=frontier[k];const NodeID hint=hints[k];\n+      const bool claimed=hint<0&&compare_and_swap(parent[v],hint,u);\n\
      +#ifdef SWDB_DXC_DIAGNOSTIC\n+       const int fresh=__atomic_load_n(&parent[v],__ATOMIC_RELAXED);\n\
      +       const int degree=g.out_degree(v);\n+       __dxc_cas_probe(v,hint,claimed,degree?-degree:-1,fresh,num_nodes);\n\
      +#endif\n+      if(claimed){parent[v]=u;lqueue.push_back(v);}\n+     }\n+    }\n+   }\n+  }else{\n\
      \ #pragma omp for nowait\n-        for (size_t i = queue.shared_out_start; i < queue.shared_out_end;\
      \ i++) {\n-            NodeID u = queue.shared[i];\n-            for (int j = VertexOffsets[u];\
      \ j < VertexOffsets[u + 1]; j++) {\n-                NodeID v = g.out_neighbors_[j];\n-        \
      \        NodeID curr_val = parent[v];\n-                if (curr_val < 0) {\n-                 \
      \   // indirect write (parent, v_tile, u_tile)\n-                    // core fetch v tile\n-   \
      \                 if (compare_and_swap(parent[v], curr_val, u)) {\n-                        parent[v]\
      \ = u;\n-                        lqueue.push_back(v);\n-                    }\n-               \
      \ }\n-            }\n-        }\n-        lqueue.flush();\n-    }\n-#ifdef GEM5\n-    clear_mem_region();\n\
      +   for(size_t i=queue.shared_out_start;i<queue.shared_out_end;++i){\n+    const NodeID u=queue.shared[i];\n\
      +    for(int j=VertexOffsets[u];j<VertexOffsets[u+1];++j){\n+     const NodeID v=g.out_neighbors_[j],value=__atomic_load_n(&parent[v],__ATOMIC_RELAXED);\n\
      +     if(value<0&&compare_and_swap(parent[v],value,u)){parent[v]=u;lqueue.push_back(v);}\n+    }\n\
      +   }\n+  }\n+  lqueue.flush();\n+ }\n+#ifdef GEM5\n+ clear_mem_region();\n #endif\n }\n \n@@ -158,6\
      \ +198,15 @@\n     Timer t;\n     alloc_MAA();\n     init_MAA();\n+    // E3: guards and setup run\
      \ once per BFS call after the existing allocation.\n+    swdb_dxc::chunks() = 0; swdb_dxc::races()\
      \ = 0; swdb_dxc::violations() = 0;\n+    swdb_acceleration_enabled = uint64_t(g.num_nodes()) <=\
      \ UINT64_C(1073741823) &&\n+        uint64_t(g.num_edges_directed()) <= UINT64_C(1073741823) &&\
      \ omp_get_max_threads() <= NUM_CORES;\n+    if (swdb_acceleration_enabled) {\n+        __dxc_session_begin();\n\
      +#pragma omp parallel\n+        { swdb_contexts[omp_get_thread_num()] = __dxc_thread_context();\
      \ }\n+    }\n     t.Start();\n     pvector<NodeID> parent = InitParent(g);\n     t.Stop();\n@@ -197,6\
      \ +246,7 @@\n     std::cout << \"ROI End!!!\" << std::endl;\n     m5_exit(0);\n #endif\n+    __dxc_report();\n\
      \     return parent;\n }\n \n--- /dev/null\n+++ b/benchmarks/gapbs/src/swdb_dxc_lowering.hpp\n@@\
      \ -0,0 +1,65 @@\n+// DX100 intrinsic lowerings, hardware interface 1.0-e4fc4af. Updated: 2026-10-03\
      \ ET.\n+#pragma once\n+#include <atomic>\n+#include <cassert>\n+#include <cstdint>\n+#include <cstdio>\n\
      +#include <omp.h>\n+#if defined(FUNC)\n+#include <MAA_functional.hpp>\n+#else\n+#include <MAA_gem5.hpp>\n\
      +#endif\n+static_assert(TILE_SIZE > 0 && TILE_SIZE <= 65535, \"DX100 uint16 tile-size field\");\n\
      +struct dxc_context { int tile[8], reg[8]; };\n+namespace swdb_dxc {\n+inline bool &session(){static\
      \ bool value=false;return value;}\n+inline std::atomic<uint64_t>&chunks(){static std::atomic<uint64_t>v(0);return\
      \ v;}\n+inline std::atomic<uint64_t>&races(){static std::atomic<uint64_t>v(0);return v;}\n+inline\
      \ std::atomic<uint64_t>&violations(){static std::atomic<uint64_t>v(0);return v;}\n+}\n+inline void\
      \ __dxc_session_begin(){\n+#ifdef SWDB_STRICT\n+ swdb_strict::session_begin();\n+#endif\n+ swdb_dxc::session()=true;swdb_dxc::chunks()=0;swdb_dxc::races()=0;swdb_dxc::violations()=0;\n\
      +}\n+inline dxc_context __dxc_thread_context(){\n+#ifdef SWDB_STRICT\n+ swdb_strict::check(swdb_dxc::session(),\"\
      session_required\");\n+ swdb_strict::check(omp_get_num_threads()<=NUM_CORES,\"thread_count\");\n\
      +#else\n+ assert(swdb_dxc::session()&&omp_get_num_threads()<=NUM_CORES);\n+#endif\n+ dxc_context\
      \ c;\n+#pragma omp critical(swdb_dxc_allocate)\n+ {for(int i=0;i<8;++i)c.tile[i]=get_new_tile<int>();for(int\
      \ i=0;i<8;++i)c.reg[i]=get_new_reg<int>();}\n+ return c;\n+}\n+inline void __dxc_const_i32(int32_t\
      \ value,int reg){maa_const<int>(value,reg);}\n+inline void __dxc_wait(int tile){wait_ready(tile);std::atomic_thread_fence(std::memory_order_seq_cst);asm\
      \ volatile(\"\" ::: \"memory\");}\n+template<class T>inline void __dxc_gather(T*base,int index,int\
      \ dst){maa_indirect_load<T>(base,index,dst);}\n+template<class T>inline void __dxc_stream_load(T*base,int\
      \ minimum,int maximum,int stride,int dst){maa_stream_load<T>(base,minimum,maximum,stride,dst);}\n\
      +inline void __dxc_range_loop(int last_i,int last_j,int lower,int upper,int stride,int rows,int\
      \ columns){maa_range_loop<int>(last_i,last_j,lower,upper,stride,rows,columns);}\n+inline uint16_t\
      \ __dxc_tile_size(int tile){return get_tile_size(tile);}\n+template<class T>inline T*__dxc_tile_pointer(int\
      \ tile){\n+#ifdef SWDB_STRICT\n+ swdb_strict::check(get_tile_ready(tile)!=0,\"read_before_wait\"\
      );\n+#endif\n+ return get_cacheable_tile_pointer<T>(tile);\n+}\n+inline void __dxc_alu_scalar(int\
      \ src,int reg,int dst,Operation_t op){maa_alu_scalar<int>(src,reg,dst,op);}\n+inline void __dxc_accelerated_chunk(){++swdb_dxc::chunks();}\n\
      +inline void __dxc_cas_probe(int vertex,int hint,bool success,int initial,int fresh,int vertex_count=INT32_MAX){\n\
      +#ifdef SWDB_DXC_DIAGNOSTIC\n+ if(!success&&hint<0)++swdb_dxc::races();\n+ if((hint<0&&hint!=initial&&hint!=-1)||(hint>=0&&(hint>=vertex_count||fresh<0)))++swdb_dxc::violations();\n\
      +#else\n+ (void)vertex;(void)hint;(void)success;(void)initial;(void)fresh;(void)vertex_count;\n\
      +#endif\n+}\n+inline void __dxc_report(){std::printf(\"SWDB accelerated_chunks=%llu\\n\",(unsigned\
      \ long long)swdb_dxc::chunks().load());\n+#ifdef SWDB_DXC_DIAGNOSTIC\n+ std::printf(\"SWDB cas_fail_negative_hint=%llu\
      \ l3_violations=%llu\\n\",(unsigned long long)swdb_dxc::races().load(),(unsigned long long)swdb_dxc::violations().load());\n\
      +#endif\n+}\n"
