    content: "--- a/benchmarks/gapbs/src/bfs.cc\n+++ b/benchmarks/gapbs/src/bfs.cc\n@@ -32,6 +32,7 @@\n\
      \ #include \"MAA_gem5_magic.hpp\"\n #endif\n #include <MAA_utility.hpp>\n+#include \"swdb_dxc_lowering.hpp\"\
      \n \n /*\n GAP Benchmark Suite\n@@ -61,37 +62,76 @@\n using namespace std;\n \n \n+// Peter section\
      \ 5 read offload, fixes E1-E5. Updated: 2026-10-03 ET.\n+static dxc_context swdb_contexts[NUM_CORES];\n\
      +static bool swdb_acceleration_enabled = false;\n+#ifndef SWDB_FRONTIER_THRESHOLD\n+#define SWDB_FRONTIER_THRESHOLD\
      \ 64\n+#endif\n+#ifndef SWDB_CHUNK_SIZE\n+#define SWDB_CHUNK_SIZE TILE_SIZE\n+#endif\n+static_assert(SWDB_CHUNK_SIZE\
      \ > 0 && SWDB_CHUNK_SIZE <= TILE_SIZE, \"chunk capacity\");\n void TDStep(const Graph &g, pvector<SGOffset>\
      \ &VertexOffsets, pvector<NodeID> &parent, SlidingQueue<NodeID> &queue, int num_nodes, int num_edges)\
