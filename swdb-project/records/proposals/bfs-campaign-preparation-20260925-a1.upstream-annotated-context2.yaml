              SPD_size_noncacheable = (volatile uint16_t *)(BASE_ADDR + MEM_SIZE + SPD_DATA_SIZE);
              SPD_ready_noncacheable = (volatile uint8_t *)(BASE_ADDR + MEM_SIZE + SPD_DATA_SIZE + SPD_SIZE_SIZE);
