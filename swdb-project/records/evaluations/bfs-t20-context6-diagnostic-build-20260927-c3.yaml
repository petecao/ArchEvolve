      kind: function
      name: DOBFS
      path: src/bfs.cc
      lines: [277, 351]
      byte_range: [9645, 12011]
      insertion_range: [9782, 12011]
      source_sha256: c5933781d13e31de7524c24beefbdd9a8485427606869ca786584c45d963a85a
      text: |-
        pvector<NodeID> DOBFS(const Graph &g, NodeID source, bool logging_enabled = false,
                              int alpha = 15, int beta = 18) {
          if (logging_enabled)
            PrintStep("Source", static_cast<int64_t>(source));
          Timer t;
          t.Start();
          pvector<NodeID> parent = InitParent(g);
          t.Stop();
          if (logging_enabled)
            PrintStep("i", t.Seconds());
          parent[source] = source;
          SlidingQueue<NodeID> queue(g.num_nodes());
          queue.push_back(source);
          queue.slide_window();
          Bitmap curr(g.num_nodes());
          curr.reset();
          Bitmap front(g.num_nodes());
          front.reset();
        #ifdef MAA
          pvector<int32_t> offsets32;
          const bool dx100 = DX100Prepare(g, offsets32);
          NodeID *neighbors = dx100 ? g.out_neigh(0).begin() : nullptr;
        #endif
          int64_t edges_to_check = g.num_edges_directed();
          int64_t scout_count = g.out_degree(source);
          while (!queue.empty()) {
        #ifdef MAA
            if (dx100 && queue.size() > static_cast<size_t>(NUM_CORES) * 1024) {
              t.Start();
              edges_to_check -= scout_count;
              scout_count = TDStepDX100(g, offsets32.data(), neighbors, parent, queue);
              queue.slide_window();
              t.Stop();
              if (logging_enabled)
                PrintStep("td-dx100", t.Seconds(), queue.size());
              continue;
            }
        #endif
            if (scout_count > edges_to_check / alpha) {
              int64_t awake_count, old_awake_count;
              TIME_OP(t, QueueToBitmap(queue, front));
              if (logging_enabled)
                PrintStep("e", t.Seconds());
              awake_count = queue.size();
              queue.slide_window();
              do {
                t.Start();
                old_awake_count = awake_count;
                awake_count = BUStep(g, parent, front, curr);
                front.swap(curr);
                t.Stop();
                if (logging_enabled)
                  PrintStep("bu", t.Seconds(), awake_count);
              } while ((awake_count >= old_awake_count) ||
                       (awake_count > g.num_nodes() / beta));
              TIME_OP(t, BitmapToQueue(g, front, queue));
              if (logging_enabled)
                PrintStep("c", t.Seconds());
              scout_count = 1;
            } else {
              t.Start();
              edges_to_check -= scout_count;
              scout_count = TDStep(g, parent, queue);
              queue.slide_window();
              t.Stop();
              if (logging_enabled)
                PrintStep("td", t.Seconds(), queue.size());
            }
          }
          #pragma omp parallel for
          for (NodeID n = 0; n < g.num_nodes(); n++)
            if (parent[n] < -1)
              parent[n] = -1;
          return parent;
        }
