      source_sha256: 998b567e01b31fa778793b1646567e817b56d4cb25a3fa4e6f989a5619f1c16e
      text: |-
        void BitmapToQueue(const Graph &g, const Bitmap &bm,
                           SlidingQueue<NodeID> &queue) {
          #pragma omp parallel
          {
            QueueBuffer<NodeID> lqueue(queue);
            #pragma omp for nowait
            for (NodeID n=0; n < g.num_nodes(); n++)
              if (bm.get_bit(n))
                lqueue.push_back(n);
            lqueue.flush();
          }
          queue.slide_window();
        }
