  text: |-
    void PrintBFSStats(const Graph &g, const pvector<NodeID> &bfs_tree) {
        int64_t tree_size = 0;
        int64_t n_edges = 0;
        for (NodeID n : g.vertices()) {
            if (bfs_tree[n] >= 0) {
                n_edges += g.out_degree(n);
                tree_size++;
            }
        }
        cout << "BFS Tree has " << tree_size << " nodes and ";
        cout << n_edges << " edges" << endl;
    }
