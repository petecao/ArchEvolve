      int main(int argc, char* argv[]) {
        CLApp cli(argc, argv, "breadth-first search");
        if (!cli.ParseArgs())
          return -1;
        Builder b(cli);
        Graph g = b.MakeGraph();
        SourcePicker<Graph> sp(g, cli.start_vertex());
