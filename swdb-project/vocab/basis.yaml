# Updated: 2026-10-06 ET.
name: basis
description: The stated source of a recorded fact; unknown never means false.
values:
  - value: estimated
    meaning: Analytic performance estimate from a workload characterization and target description; distinct from inference and execution.
  - value: measured
    meaning: Measured by running code on a real machine (timers, counts taken from the run).
  - value: simulated
    meaning: Produced by a model of a machine (for example cachegrind's cache simulator), not the machine itself.
  - value: code_reading
    meaning: Read from the source code at the pinned version.
  - value: reported
    meaning: Stated by a person, without code or measurement attached.
  - value: inferred
    meaning: Derived by a stated rule from other facts; the note or rests_on names them.
  - value: unknown
    meaning: Not known; the value must be null. Unknown is not false, zero, or safe.
