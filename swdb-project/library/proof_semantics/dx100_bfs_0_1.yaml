description: 'DX100 proof semantics, working version 0.1 (ticket 27): the dx100-mmio 1.0-e4fc4af calls the BFS read
  offload''s lowerings and the authors'' TDStepMAA make. Values as if each command finished at issue; hazards checked
  against ghost state (K = 32 uncovered commands per thread). Ticket 28 supersedes it (remaining calls, memory overlap,
  region stall, ownership).'
