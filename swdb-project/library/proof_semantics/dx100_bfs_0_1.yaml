clauses: []
rules:
- id: operands
  statement: Tile operands name one of the core's tiles and register operands one of its registers; a command's
    destination tile is none of its source tiles (MAA.cc:563-566 asserts it at dispatch).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/MAA.cc
    lines: 563-566
- id: allocation
  statement: get_new_tile and get_new_reg hand out the core's 8 tiles and 8 scalar registers (MAA.py num_tiles_per_core,
    num_regs_per_core); one more is a hazard.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/MAA.py
    lines: 13-15
- id: regions
  statement: add_mem_region registers one memory region (at most DX_NM); clear_mem_region forgets them. Which region
    a command uses, and the region stall, are ticket 28's rules.
  assumed:
    owner: Eric
- id: wait_counted_roles
  statement: 'wait_ready(t) returns when no unfinished command names t as src1, src2, dst1 or dst2; a condition
    tile is not counted (ready counter: MAA.cc:563-580 at dispatch, 605-620 at finish; SPD.cc:120-139; blocking
    read CpuSidePort.cc:295-315).'
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/MAA.cc
    lines: 563-580
- id: wait_transitive
  statement: A command finishes only after the producers of its input tiles finished, so a wait also covers those
    producers, transitively (IndirectAccess.cc:399-459; ALU.cc:199-246; StreamAccess.cc:305-316).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IndirectAccess.cc
    lines: 399-459
- id: wait_range_loop_exception
  statement: A range loop finishes without waiting for the producers of its min, max or condition tiles, so coverage
    never passes through a range loop.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/RangeFuser.cc
    lines: 211-219
- id: dispatch_stall
  statement: A command is not dispatched while its destination tile is any unfinished command's source, destination
    or condition tile, and the issuing call returns only at dispatch; so issuing it covers every uncovered command
    that names that tile in any role.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IF.cc
    lines: 193-212
- id: register_write_stall
  statement: A CPU write to a scalar register is held until no unfinished command names the register; so maa_const
    covers every uncovered command that names it.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IF.cc
    lines: 233-249
- id: register_overlap
  statement: No gem5 rule orders a command after an unfinished command on a register (issue checks tile status only),
    so issuing a command that shares a register with an uncovered command where either writes it is a hazard (ticket
    41, F6).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IF.cc
    lines: 279-299
- id: memory_serial_domain
  statement: 'Conservative proof-domain restriction until ticket 28: after destination-stall coverage, a device
    store needs no uncovered memory command, and a device load needs no uncovered device store. An indirect store
    copies a whole cache line, updates selected words, and writes back the whole line; selected-element disjointness
    therefore does not establish absence of memory interference. Domain failure is not proven, never a refutation
    of the program.'
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IndirectAccess.cc
    lines: 898-940, 1145-1158
- id: unready_read
  statement: A CPU read of tile memory is not blocked while a command fills the tile, so reading a tile through
    its tile pointer while an uncovered command writes it is a hazard (map 12 item 3).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/CpuSidePort.cc
    lines: 346-360
- id: cpu_write_overlap
  statement: A CPU write to tile memory is not ordered with a running command that reads or writes the tile element
    by element, so writing a tile that an uncovered command names as a reader or writer is a hazard; reading a tile
    an uncovered command only reads is not.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/SPD.cc
    lines: 140-157
- id: unready_size_read
  statement: A tile's size is set when its command finishes, so get_tile_size before a wait covers the tile's writer
    is a hazard like an unready read (stream StreamAccess.cc:336-341; indirect IndirectAccess.cc:470-473; range
    loop RangeFuser.cc:235-237).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/StreamAccess.cc
    lines: 336-341
- id: tile_pointer
  statement: get_cacheable_tile_pointer gives the tile's elements in the CPU's cacheable tile range.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/CpuSidePort.cc
    lines: 346-353
- id: stream_values
  statement: maa_stream_load fills dst[k] = data[min + k * stride] for k < n, n = 0 if max == min else min(TILE_SIZE,
    (max - min - 1) / stride + 1), from registers min, max, stride; size n.
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/StreamAccess.cc
    lines: 143-146
- id: stream_operands
  statement: The stream formula is used only with stride > 0 and min <= max; anything else is a hazard (gem5 gives
    a negative or undefined count).
  assumed:
    owner: Eric
- id: gather_values
  statement: maa_indirect_load fills dst[k] = data[idx[k]] (index read as uint32) for k < size(idx); size = size(idx).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IndirectAccess.cc
    lines: 413-418, 491-492
- id: range_loop_values
  statement: 'maa_range_loop continues from registers (last_i, last_j): for i from last_i below size(min), j from
    min[i] (or last_j) while j < max[i] (unsigned), step stride, it emits (i, j) pairs until TILE_SIZE are emitted;
    it writes last_i, last_j back and both sizes.'
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/RangeFuser.cc
    lines: 84-93, 154-208, 233-237
- id: range_operands
  statement: size(min) == size(max) (gem5 panics otherwise); stride > 0 and last_i >= 0 are assumed (otherwise gem5
    loops forever or reads outside the tile).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/RangeFuser.cc
    lines: 126-143
- id: alu_lt_values
  statement: 'maa_alu_scalar with LT_OP on int32 fills dst[k] = (src[k] < reg) ? 1 : 0 for k < size(src); size =
    size(src).'
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/ALU.cc
    lines: 357-447
- id: store_vector_values
  statement: 'maa_indirect_store_vector, for k < size(idx) with cond[k] != 0 (or no condition): dst[k] = the old
    data[idx[k]], then data[idx[k]] = src[k]; size(dst) = size(idx).'
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IndirectAccess.cc
    lines: 905-933
- id: store_operands
  statement: size(src) and size(cond) equal size(idx) (gem5 panics otherwise).
  cites:
    gem5_commit: e4fc4afdf894f295442cef3604667a469fab8e62
    path: src/mem/MAA/IndirectAccess.cc
    lines: 399-418
- id: store_duplicate_order
  statement: With a repeated index, the lanes take effect in element order (the old value a lane returns includes
    earlier lanes' writes).
  assumed:
    owner: Eric
