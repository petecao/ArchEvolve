# DX100 proof semantics 0.1 (Probata proof of concept ticket 27). Created: 2026-10-14 ET.
# Format: docs/reference/format-v0.4-proof-semantics.md. Every rule cites gem5 DX100 at e4fc4af or names an owner.
id: semantics.dx100_bfs_0_1
kind: proof_semantics
