l3_outcome:
  observed: negative-hint CAS failures > 0 and l3_violations = 0; design stays assumed
  refuted: l3_violations > 0; separate CPU-parent-load contract required
  inconclusive: verifier failed without violation, or race count zero; diagnose before
    timed runs
fixes:
- E1 per-thread context
- E2 register handles
- E3 session and region lifecycle
- E4 chunk capacity
- E5 covering wait and barriers
specification_notes:
- Both count guards include 1073741823, one more than Peter section 5 code; this agrees
  with section 4 and Josh byte-offset requirement.
- Parent store after successful CPU CAS is intentionally retained and redundant.
