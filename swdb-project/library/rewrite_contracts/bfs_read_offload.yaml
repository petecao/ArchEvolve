- intrinsic.dxc_tile_pointer
uses_library_operations: []
clauses:
- id: L1
  role: legality
  statement: Continuation emits exactly the nested CSR loop vertex pairs.
  discharge_mode: differential_test
  negative_control:
    id: dropped_continuation
    check: frontier_size_equality
  formal:
    language: reference
    reference:
      path: dx100/reference.hpp
      sha256: 75b80bc3d0027b1700e2fc1f075683e617d059ca4bbef761bfeb31839d9fa897
      root: library
      symbol: range_loop
  formal_label: stated
- id: L2
  role: legality
  statement: Within TDStep each parent changes at most once from its initial negative
    value to a vertex ID.
  discharge_mode: differential_test
  negative_control:
    id: skipped_cas_recheck
    check: duplicate_frontier
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
- id: L3
  role: legality
  statement: DX100 parent gathers return no value older than parent initialization.
  discharge_mode: assumed
  negative_control:
    id: none
    reason: Target observation or named assumption, not a local test discharge.
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
  owner: Eric
  evidence: Pinned specification L3; parent-gather race case tests this assumption
    on each target run.
- id: L4
  role: legality
  statement: The CPU retains CAS, the labeled redundant parent store and queue push;
    frontier vertex and hint come from the same chunk.
  discharge_mode: structural
  negative_control:
    id: skipped_cas_recheck
    check: duplicate_frontier
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
- id: L5
  role: legality
  statement: DX100 reads of CPU-written queue, offsets and parent see stores preceding
    descriptor issue.
  discharge_mode: assumed
  negative_control:
    id: none
    reason: Target observation or named assumption, not a local test discharge.
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
  owner: Eric
  evidence: Pinned specification L5; no target coherence guarantee is asserted.
- id: frontier_threshold
  role: legality
  statement: Frontier threshold is an integer of at least one.
  discharge_mode: runtime_guard
  negative_control:
    id: chunk_off_by_one
    check: knob_range
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
- id: chunk_size
  role: legality
  statement: Chunk size is positive and never exceeds the actual build tile capacity.
  discharge_mode: static_assertion
  negative_control:
    id: chunk_off_by_one
    check: tile_truncation
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
- id: schedule
  role: legality
  statement: Schedule is static or dynamic, with positive granularity.
  discharge_mode: structural
  negative_control:
    id: shared_context
    check: schedule_range
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
- id: once_enqueue
  role: preservation
  statement: Each discovered vertex is enqueued exactly once; trustworthy per-depth
    counts must match.
  discharge_mode: differential_test
  negative_control:
    id: forged_frontier
    check: duplicate_frontier
  natural_language_only: Ownership, memory order or application obligations exceed
    the closed predicate alphabet.
runtime_guards:
- condition: num_vertices <= 1073741823 && directed_edges <= 1073741823
  fallback: whole_pre_rewrite_BFS_call
- condition: omp_threads <= build.core_count
  fallback: whole_pre_rewrite_BFS_call
knobs:
- name: frontier_threshold
  default: 64
  range:
    min: 1
    max: 2147483647
  origin: Peter v1.1 section 5
  legality_clause: frontier_threshold
- name: chunk_size
  default: build.tile_size
  range:
    min: 1
    max: 65535
    upper_bound: build.tile_size
  origin: Peter v1.1 section 5 with E4
  legality_clause: chunk_size
- name: schedule
  default: dynamic
  range:
    choices:
    - dynamic
    - static
  origin: Peter v1.1 section 5
  legality_clause: schedule
- name: schedule_granularity
  default: 1
  range:
    min: 1
    max: 2147483647
  origin: Peter v1.1 section 5
  legality_clause: schedule
preservation_obligations:
- once_enqueue
correctness_check:
  kernel: gapbs-bfs
  application: dx100-gapbs
  symbol: BFSVerifier
  scope: full BFS call; target-bound check remains gem5
execution_witness:
  functional: accelerated_chunks > 0 whenever scalar frontier reaches frontier_threshold
  gem5:
    case: read_only_executed
    stream_min: 1
    range_min: 1
    indirect_min: 1
    alu: 0
    indirect_stores: 0
    equation: indirect = 3 * range - stream
negative_controls:
- id: shared_context
  kind: overlapping_pointer
  check: named BFS correctness, preservation or strict-layer check
- id: skipped_cas_recheck
  kind: double_claim
  check: named BFS correctness, preservation or strict-layer check
- id: dropped_continuation
  kind: dropped_operand
  check: named BFS correctness, preservation or strict-layer check
- id: chunk_off_by_one
  kind: dropped_operand
  check: named BFS correctness, preservation or strict-layer check
- id: dropped_wait
  kind: dropped_operand
  check: named BFS correctness, preservation or strict-layer check
- id: read_before_wait
  kind: dropped_operand
  check: named BFS correctness, preservation or strict-layer check
- id: index_wrap
  kind: dropped_operand
  check: named BFS correctness, preservation or strict-layer check
- id: forged_frontier
  kind: double_claim
  check: named BFS correctness, preservation or strict-layer check
