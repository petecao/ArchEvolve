l3_outcome:
  observed: no BC race case yet; BCVerifier PASS on each target run is the only check
  refuted: BCVerifier FAIL with the stale-hint path excluded; separate CPU-depth-load contract required
  inconclusive: verifier failed without a localized cause; diagnose before timed runs
fixes:
- E1 per-thread context
- E2 register handles
- E3 session and region lifecycle
- E4 chunk capacity
- E5 covering wait and barriers
specification_notes:
- Both count guards include 1073741823, one more than Peter section 5 code; this agrees with section 4
  and Josh byte-offset requirement.
- Derived 2026-10-03 ET (ticket 42) from contract.bfs_read_offload; experimental until Yan-Ru reviews
  it (ticket 43).
- The BFS parent store has no BC counterpart; the CPU depth CAS is the only depth write.
- Both passes stay in one Brandes call; only the forward pass is rewritten and the dependency pass stays
  scalar.
