ranking_rule:
  remaining_gain_bound: 'Upper limit, never an expected gain: share x max(0, 1 - catalog bound / estimate),
    share = region seconds / candidate total seconds. Regions with a known catalog bound only; largest
    first. Clamped at 0 (F29): an entry slower than the region''s estimate offers no gain, the same as
    a region already at its bound. Ties (for example at 0) go by floor headroom, largest first and null
    last, then by region ID.'
  floor_headroom: 'Regions whose catalog bound is no_catalog_match or no_site_finder: estimate / resource
    floor, largest first. Never ranked against the remaining_gain_bound tier. The floor''s bandwidth term
    is the streaming_bandwidth model''s own bound, which leaves out bytes a cache_fit or latency model
    of the description covers, so the floor is a looser but still valid lower limit (F6).'
  unknown: 'Regions whose ranking value is null, in region-ID order, after every known value: an unknown
    catalog bound (its reason, for example needs_rewritten_counts, unknown_catalog_entry, no_baseline_counts
    or site_finder_unplaced), or a null remaining gain bound or floor headroom.'
  comparison: One ranking over the candidate regions of the cumulative comparison (original baseline ->
    candidate), whose catalog bounds run on the original baseline's counts (F35). The this_iteration catalog
    bounds and floors run on the previous candidate's counts; they are informational and never ranked
    (F45).
