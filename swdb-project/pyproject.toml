[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evolveswdb"
version = "0.2.0"
description = "ArchEvolve Software Database: records, schemas, vocabularies, and the swdb tool"
requires-python = ">=3.12"
# Only these two: the tool must run on mbit10's system Python (PyYAML 6.0.1,
# jsonschema 4.10.3) without installing anything.
dependencies = ["PyYAML>=6.0", "jsonschema>=4.10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
swdb = "swdb.cli:main"

[tool.setuptools.packages.find]
include = ["swdb*"]

[tool.setuptools.package-data]
"swdb" = ["llvm/*.cpp", "*.ml"]
"swdb._vendor.lark" = ["grammars/*.lark", "*.lark"]
"swdb._vendor" = ["licenses/*", "PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 2026-09-27 ET: never write .pytest_cache into a checkout. A stray cache in a
# runtime checkout failed native readback a2's root-entry admission.
# 2026-10-13 ET (suite closure): tests that validate the whole real ~1.3 GB records store
# are marked `whole_store` and deselected by default (each takes many minutes). Run them with
# `python -m pytest -m whole_store` (a later `-m` on the command line replaces this one).
addopts = "-p no:cacheprovider -m 'not whole_store'"
markers = [
    "whole_store: validates the whole real records store; opt-in with `-m whole_store`",
]
